spring:
  application:
    name: ai-architecture-auditor-test
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: ai_architecture_auditor
  flyway:
    enabled: true
    schemas: ai_architecture_auditor
    default-schema: ai_architecture_auditor
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration