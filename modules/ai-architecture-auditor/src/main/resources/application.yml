logging:
  level:
    org.neo4j.driver: DEBUG
    com.company.auditor.core.graph: DEBUG
    com.company.auditor.validation: DEBUG

spring:
  application:
    name: ai-architecture-auditor
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/graph_rag?currentSchema=ai_architecture_auditor}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ai_architecture_auditor
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: ai_architecture_auditor
    default-schema: ai_architecture_auditor
    locations: classpath:db/migration
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}

neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  authentication:
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:password}

llm:
  gateway:
    url: ${LLM_GATEWAY_URL:http://localhost:11434/api/generate}
    model: ${LLM_MODEL_NAME:qwen2.5-coder:1.5b}
