    - filename: "BookmarksHeader"
      extension: "tsx"
      path: "webview/src/features/bookmarks/components"
      action: update
      content: |-
        import React, { useEffect } from 'react';
        import { Globe, Search, EyeOff, Eye, Sliders, User, BarChart2, Sun, Moon, Maximize2 } from 'lucide-react';
        import { useBookmarksStore } from '../store/useBookmarksStore';
        import initialData from '../data/initialBookmarks.json';
        import { User as UserType } from '../types/bookmarks.types';

        interface BookmarksHeaderProps {
          onOpenGlobalConfig?: () => void;
          onOpenOmniSearch?: () => void;
          onOpenAnalytics?: () => void;
        }

        export const BookmarksHeader: React.FC<BookmarksHeaderProps> = ({
          onOpenGlobalConfig = () => {},
          onOpenOmniSearch = () => {},
          onOpenAnalytics = () => {}
        }) => {
          const {
            isDarkMode,
            toggleDarkMode,
            toggleZenMode,
            globalSettings,
            setGlobalSettings,
            currentUser,
            setCurrentUser
          } = useBookmarksStore();

          const users = initialData.INITIAL_USERS as UserType[];

          useEffect(() => {
            if (isDarkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }, [isDarkMode]);

          return (
            <header className="flex-shrink-0 h-14 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between z-20 shadow-xs">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold shadow-md shadow-brand-500/20">
                  <Globe className="w-5 h-5"/>
                </div>
                <div>
                  <h1 className="font-bold text-sm tracking-tight text-slate-900 dark:text-slate-100 flex items-center gap-2">
                    Enterprise Bookmark Platform
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 font-semibold">
                      v4.4 PROD
                    </span>
                  </h1>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    2D Grid Physics • Netscape Integration • WCAG AA
                  </p>
                </div>
              </div>

              <button
                type="button"
                onClick={onOpenOmniSearch}
                className="hidden md:flex items-center gap-3 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors w-72 cursor-pointer"
              >
                <Search className="w-3.5 h-3.5"/>
                <span className="flex-1 text-left">
                  Cmd+K Omni-Search...
                </span>
                <kbd className="px-1.5 py-0.5 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-[10px] font-mono">
                  ⌘K
                </kbd>
              </button>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  title={globalSettings.hidePrivate ? "Private elements are hidden. Click to show." : "Private elements are visible. Click to hide."}
                  onClick={() => setGlobalSettings({ hidePrivate: !globalSettings.hidePrivate })}
                  className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-all cursor-pointer ${
                    globalSettings.hidePrivate
                      ? 'bg-amber-100 text-amber-900 border-amber-300 dark:bg-amber-950/80 dark:text-amber-300 dark:border-amber-800 shadow-inner'
                      : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-300 dark:border-slate-700'
                  }`}
                >
                  {globalSettings.hidePrivate ? (
                    <>
                      <EyeOff className="w-3.5 h-3.5 text-amber-600 dark:text-amber-400"/>
                      <span className="hidden sm:inline">
                        Private Hidden
                      </span>
                    </>
                  ) : (
                    <>
                      <Eye className="w-3.5 h-3.5 text-slate-500 dark:text-slate-400"/>
                      <span className="hidden sm:inline">
                        Private Visible
                      </span>
                    </>
                  )}
                </button>

                <button
                  type="button"
                  title="Configure Global Workspace Parameters"
                  onClick={onOpenGlobalConfig}
                  className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-brand-50 hover:bg-brand-100 dark:bg-brand-950/60 dark:hover:bg-brand-900 text-brand-600 dark:text-brand-400 font-medium text-xs border border-brand-200 dark:border-brand-800 transition-colors cursor-pointer"
                >
                  <Sliders className="w-3.5 h-3.5"/>
                  <span className="hidden sm:inline">
                    Global Config
                  </span>
                </button>

                <div className="flex items-center gap-2 px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                  <User className="w-4 h-4 text-brand-500"/>
                  <select
                    value={currentUser?.id}
                    onChange={(e) => {
                      const u = users.find(usr => usr.id === e.target.value);
                      if (u) setCurrentUser(u);
                    }}
                    className="bg-transparent text-xs font-medium text-slate-800 dark:text-slate-200 focus:outline-none cursor-pointer"
                  >
                    {users.map(u => (
                      <option
                        key={u.id}
                        value={u.id}
                      >
                        {u.name} ({u.role})
                      </option>
                    ))}
                  </select>
                </div>

                <button
                  type="button"
                  title="Telemetry & Health Metrics"
                  onClick={onOpenAnalytics}
                  className="p-2 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
                >
                  <BarChart2 className="w-4 h-4"/>
                </button>

                <button
                  type="button"
                  title="Toggle Theme"
                  onClick={toggleDarkMode}
                  className="p-2 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
                >
                  {isDarkMode ? <Sun className="w-4 h-4"/> : <Moon className="w-4 h-4"/>}
                </button>

                <button
                  type="button"
                  title="Zen Canvas Mode"
                  onClick={toggleZenMode}
                  className="p-2 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
                >
                  <Maximize2 className="w-4 h-4"/>
                </button>
              </div>
            </header>
          );
        };

    - filename: "BookmarksToolBar"
      extension: "tsx"
      path: "webview/src/features/bookmarks/components"
      action: update
      content: |-
        import React, { useRef } from 'react';
        import { Sparkles, Upload, Download, Share2, Grid, EyeOff, Folder, Lock } from 'lucide-react';
        import { useBookmarksStore } from '../store/useBookmarksStore';
        import { exportWorkspaceJson } from '../utils/exportImport';
        import { parseNetscapeHtml } from '../utils/chromeBookmarkParser';
        import { useTreeStore } from '../store/useTreeStore';
        import { useGridPhysics } from '../hooks/useGridPhysics';

        interface BookmarksToolBarProps {
          onAiGroup?: () => void;
          onShare?: () => void;
        }

        export const BookmarksToolBar: React.FC<BookmarksToolBarProps> = ({
          onAiGroup = () => {},
          onShare = () => {}
        }) => {
          const { tabs, setTabs, activeTabId, globalSettings, setGlobalSettings, isSidebarOpen, toggleSidebar } = useBookmarksStore();
          const { setTreeNodes } = useTreeStore();
          const { computeCompactPositions } = useGridPhysics();
          const fileInputRef = useRef<HTMLInputElement>(null);

          const activeTab = tabs.find(t => t.id === activeTabId) || tabs[0];
          const overrides = activeTab?.overrides || {};
          const effectiveCols = overrides.nbCols ?? globalSettings.nbCols;
          const effectiveRowHeight = overrides.rowHeight ?? globalSettings.rowHeight;
          const effectiveGapX = overrides.gapX ?? globalSettings.gapX;
          const effectiveGapY = overrides.gapY ?? globalSettings.gapY;
          const effectiveShowGrid = overrides.showGridLines ?? globalSettings.showGridLines;
          const effectiveHidePrivate = overrides.hidePrivate ?? globalSettings.hidePrivate;
          const effectiveAlgo = overrides.cardsCollisionAlgo ?? globalSettings.cardsCollisionAlgo;

          const handleImportFile = (e: React.ChangeEvent<HTMLInputElement>) => {
            const file = e.target.files?.[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const html = event.target?.result as string;
                if (typeof html === 'string') {
                  const { nodes } = parseNetscapeHtml(html);
                  if (nodes && nodes.length > 0) {
                    setTreeNodes(nodes);
                    if (!isSidebarOpen) toggleSidebar();
                  }
                }
              } catch (err) {}
            };
            reader.readAsText(file);
            e.target.value = '';
          };

          const handleSwitchAlgo = (newAlgo: 'Compact' | 'Grid') => {
            setGlobalSettings({ cardsCollisionAlgo: newAlgo });
            if (newAlgo === 'Compact' && activeTab) {
              setTabs(prevTabs => prevTabs.map(tab => {
                if (tab.id !== activeTabId) return tab;
                const compactPos = computeCompactPositions(tab.cards, effectiveCols, globalSettings.nbRowsMax);
                return {
                  ...tab,
                  cards: tab.cards.map(c => {
                    const pos = compactPos[c.id];
                    return pos ? { ...c, position: { ...c.position, x: pos.x, y: pos.y } } : c;
                  })
                };
              }));
            }
          };

          return (
            <div className="flex-shrink-0 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-2 flex items-center justify-between gap-3 text-xs flex-wrap">
              <div className="flex items-center gap-2 flex-wrap">
                <button
                  type="button"
                  onClick={onAiGroup}
                  className="flex items-center gap-1 px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800 font-semibold hover:bg-indigo-100 transition-colors cursor-pointer"
                >
                  <Sparkles className="w-3.5 h-3.5"/>
                  <span>
                    AI Smart Group
                  </span>
                </button>

                <button
                  type="button"
                  title="Import Chrome Netscape HTML bookmarks file"
                  onClick={() => fileInputRef.current?.click()}
                  className="flex items-center gap-1 px-2.5 py-1 rounded-md bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800 font-semibold hover:bg-brand-100 transition-colors shadow-xs cursor-pointer"
                >
                  <Upload className="w-3.5 h-3.5"/>
                  <span>
                    Import Chrome
                  </span>
                </button>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept=".html"
                  onChange={handleImportFile}
                  className="hidden"
                />

                <button
                  type="button"
                  onClick={() => exportWorkspaceJson(globalSettings, tabs)}
                  className="flex items-center gap-1 px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 font-medium transition-colors cursor-pointer"
                >
                  <Download className="w-3.5 h-3.5"/>
                  <span>
                    Export JSON
                  </span>
                </button>

                <button
                  type="button"
                  onClick={onShare}
                  className="flex items-center gap-1 px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 font-medium transition-colors cursor-pointer"
                >
                  <Share2 className="w-3.5 h-3.5"/>
                  <span>
                    Share
                  </span>
                </button>

                <div className="h-4 w-px bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block" />

                <button
                  type="button"
                  title={effectiveShowGrid ? 'Hide Grid Pattern' : 'Show Grid Pattern'}
                  onClick={() => setGlobalSettings({ showGridLines: !effectiveShowGrid })}
                  className={`flex items-center gap-1.5 px-2.5 py-1 rounded-md font-medium border transition-colors cursor-pointer ${
                    effectiveShowGrid
                      ? 'bg-brand-50 dark:bg-brand-950/50 border-brand-200 dark:border-brand-800 text-brand-600 dark:text-brand-400'
                      : 'bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500'
                  }`}
                >
                  {effectiveShowGrid ? <Grid className="w-3.5 h-3.5"/> : <EyeOff className="w-3.5 h-3.5"/>}
                  <span>
                    {effectiveShowGrid ? 'Grid Visible' : 'Grid Hidden'}
                  </span>
                </button>

                <div className="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-700">
                  <span className="text-slate-500 font-medium">
                    Cols:
                  </span>
                  <span className="font-mono font-semibold text-brand-600 dark:text-brand-400">
                    {effectiveCols}
                  </span>
                </div>

                <div className="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-700">
                  <span className="text-slate-500 font-medium">
                    Row:
                  </span>
                  <span className="font-mono font-semibold text-brand-600 dark:text-brand-400">
                    {effectiveRowHeight}px
                  </span>
                </div>

                <div
                  title="Horizontal and Vertical Card Spacing"
                  className="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-700"
                >
                  <span className="text-slate-500 font-medium">
                    Gap:
                  </span>
                  <span className="font-mono font-semibold text-brand-600 dark:text-brand-400">
                    {effectiveGapX}×{effectiveGapY}px
                  </span>
                </div>

                {effectiveHidePrivate && (
                  <span className="flex items-center gap-1 text-[11px] font-semibold text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/50 px-2 py-0.5 rounded border border-amber-200 dark:border-amber-800">
                    <Lock className="w-3 h-3"/>
                    <span>
                      Private Hidden
                    </span>
                  </span>
                )}
              </div>

              <div className="flex items-center gap-2">
                <div
                  title="Collision Physics Algorithm: Compact (flow push) or Grid (nearest-space slot push)"
                  className="flex items-center rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5 border border-slate-200 dark:border-slate-700"
                >
                  <span className="text-[10px] text-slate-400 px-1 font-mono">
                    Algo:
                  </span>
                  <button
                    type="button"
                    onClick={() => handleSwitchAlgo('Compact')}
                    className={`px-2 py-0.5 rounded text-[11px] font-medium transition-colors cursor-pointer ${
                      effectiveAlgo === 'Compact' ? 'bg-white dark:bg-slate-900 shadow-xs text-brand-600 dark:text-brand-400' : 'text-slate-400'
                    }`}
                  >
                    Compact
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSwitchAlgo('Grid')}
                    className={`px-2 py-0.5 rounded text-[11px] font-medium transition-colors cursor-pointer ${
                      effectiveAlgo === 'Grid' ? 'bg-white dark:bg-slate-900 shadow-xs text-brand-600 dark:text-brand-400' : 'text-slate-400'
                    }`}
                  >
                    Grid
                  </button>
                </div>

                <button
                  type="button"
                  onClick={toggleSidebar}
                  className={`flex items-center gap-1 px-2.5 py-1 rounded-md font-medium transition-colors cursor-pointer ${
                    isSidebarOpen
                      ? 'bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
                  }`}
                >
                  <Folder className="w-3.5 h-3.5"/>
                  <span>
                    Treeview
                  </span>
                </button>
              </div>
            </div>
          );
        };

    - filename: "BookmarksTabList"
      extension: "tsx"
      path: "webview/src/features/bookmarks/components/tabs"
      action: update
      content: |-
        import React, { useState, useRef, useEffect } from 'react';
        import { GripVertical, Plus, Settings, Lock, Trash, Check, X, Layers } from 'lucide-react';
        import { useBookmarksStore } from '../../store/useBookmarksStore';
        import { BookmarkTab } from '../../types/bookmarks.types';

        interface BookmarksTabListProps {
          onOpenTabConfig?: () => void;
          onRequestDeleteTab?: (tab: BookmarkTab) => void;
        }

        export const BookmarksTabList: React.FC<BookmarksTabListProps> = ({
          onOpenTabConfig = () => {},
          onRequestDeleteTab
        }) => {
          const { tabs, setTabs, activeTabId, setActiveTabId, currentUser } = useBookmarksStore();
          const [editingTabId, setEditingTabId] = useState<string | null>(null);
          const [tabNameInput, setTabNameInput] = useState('');
          const [draggedTabId, setDraggedTabId] = useState<string | null>(null);
          const [tabHoverTargetId, setTabHoverTargetId] = useState<string | null>(null);
          const [tabHoverDirection, setTabHoverDirection] = useState<'left' | 'right' | null>(null);
          const [previewTabOrder, setPreviewTabOrder] = useState<string[] | null>(null);
          const tabInputRef = useRef<HTMLInputElement>(null);

          useEffect(() => {
            if (editingTabId && tabInputRef.current) {
              tabInputRef.current.focus();
              tabInputRef.current.select();
            }
          }, [editingTabId]);

          const handleSaveInlineTabName = (tabId: string) => {
            const trimmed = tabNameInput.trim();
            if (trimmed) {
              setTabs(prev => prev.map(t => t.id === tabId ? { ...t, name: trimmed } : t));
            }
            setEditingTabId(null);
          };

          const handleCancelInlineTabName = () => {
            setEditingTabId(null);
          };

          const handleTabDragStart = (e: React.DragEvent, tabId: string) => {
            const tab = tabs.find(t => t.id === tabId);
            if (tab?.isLocked) {
              e.preventDefault();
              return;
            }
            setDraggedTabId(tabId);
            e.dataTransfer.setData('text/plain', tabId);
            e.dataTransfer.effectAllowed = 'move';
          };

          const handleTabDragOver = (e: React.DragEvent, targetTabId: string) => {
            e.preventDefault();
            e.stopPropagation();
            if (!draggedTabId || draggedTabId === targetTabId) return;

            const targetTab = tabs.find(t => t.id === targetTabId);
            if (targetTab?.isLocked) return;

            const rect = e.currentTarget.getBoundingClientRect();
            const isHoveringRight = (e.clientX - rect.left) > (rect.width / 2);
            const direction = isHoveringRight ? 'right' : 'left';

            setTabHoverTargetId(targetTabId);
            setTabHoverDirection(direction);

            const currentOrder = tabs.map(t => t.id);
            const dragIdx = currentOrder.indexOf(draggedTabId);
            let targetIdx = currentOrder.indexOf(targetTabId);

            if (dragIdx !== -1 && targetIdx !== -1) {
              const newOrder = [...currentOrder];
              newOrder.splice(dragIdx, 1);

              targetIdx = newOrder.indexOf(targetTabId);
              const insertIdx = direction === 'right' ? targetIdx + 1 : targetIdx;
              newOrder.splice(insertIdx, 0, draggedTabId);
              setPreviewTabOrder(newOrder);
            }
          };

          const handleTabDrop = (e: React.DragEvent, targetTabId: string) => {
            e.preventDefault();
            e.stopPropagation();

            if (previewTabOrder && previewTabOrder.length > 0) {
              const tabMap = new Map(tabs.map(t => [t.id, t]));
              const committedTabs = previewTabOrder.map(id => tabMap.get(id)).filter(Boolean) as BookmarkTab[];
              tabs.forEach(t => {
                if (!previewTabOrder.includes(t.id)) committedTabs.push(t);
              });
              setTabs(committedTabs);
            }

            setDraggedTabId(null);
            setTabHoverTargetId(null);
            setTabHoverDirection(null);
            setPreviewTabOrder(null);
          };

          const handleAddNewTab = () => {
            const newTab: BookmarkTab = {
              id: `tab_${Date.now()}`,
              name: 'New Tab',
              description: 'Custom workspace',
              isPrivate: false,
              owner: currentUser.id,
              isLocked: false,
              userRolePermissions: { admin: true, editor: true, viewer: true },
              style: { tabNameBackgroundColor: '#059669', tabNameTextColor: '#ffffff' },
              cards: [],
              overrides: {}
            };
            setTabs(prev => [...prev, newTab]);
            setActiveTabId(newTab.id);
          };

          const visibleTabs = React.useMemo(() => {
            if (!previewTabOrder || previewTabOrder.length === 0) return tabs;
            const tabMap = new Map(tabs.map(t => [t.id, t]));
            const reordered = previewTabOrder.map(id => tabMap.get(id)).filter(Boolean) as BookmarkTab[];
            tabs.forEach(t => {
              if (!previewTabOrder.includes(t.id)) reordered.push(t);
            });
            return reordered;
          }, [tabs, previewTabOrder]);

          return (
            <div className="flex-shrink-0 bg-slate-200/60 dark:bg-slate-950 px-4 pt-2 flex items-center justify-between border-b border-slate-200 dark:border-slate-800 overflow-x-auto">
              <div className="flex items-center gap-1">
                {visibleTabs.map(tab => {
                  const isActive = tab.id === activeTabId;
                  const isBeingDragged = draggedTabId === tab.id;
                  const isHoverTarget = tabHoverTargetId === tab.id;
                  const isEditingThisTab = editingTabId === tab.id;
                  const hasOverrides = tab.overrides && Object.keys(tab.overrides).length > 0;

                  return (
                    <div
                      key={tab.id}
                      draggable={!tab.isLocked && !isEditingThisTab}
                      title={tab.isLocked ? 'Tab locked' : 'Double-click to rename tab, drag to reorder'}
                      onDragStart={(e) => handleTabDragStart(e, tab.id)}
                      onDragOver={(e) => handleTabDragOver(e, tab.id)}
                      onDragLeave={() => {
                        if (tabHoverTargetId === tab.id) {
                          setTabHoverTargetId(null);
                          setTabHoverDirection(null);
                        }
                      }}
                      onDrop={(e) => handleTabDrop(e, tab.id)}
                      onDragEnd={() => {
                        setDraggedTabId(null);
                        setTabHoverTargetId(null);
                        setTabHoverDirection(null);
                        setPreviewTabOrder(null);
                      }}
                      onClick={() => setActiveTabId(tab.id)}
                      onDoubleClick={(e) => {
                        if (!tab.isLocked) {
                          e.stopPropagation();
                          setEditingTabId(tab.id);
                          setTabNameInput(tab.name);
                        }
                      }}
                      style={{
                        backgroundColor: isActive ? (tab.style?.tabNameBackgroundColor || '#4f46e5') : undefined,
                        color: isActive ? (tab.style?.tabNameTextColor || '#ffffff') : undefined
                      }}
                      className={`flex items-center gap-2 px-3 py-1.5 rounded-t-lg text-xs font-semibold cursor-pointer border-t border-l border-r transition-all select-none relative ${
                        isBeingDragged ? 'opacity-40 scale-95' : ''
                      } ${
                        isHoverTarget && tabHoverDirection === 'left' ? '-translate-x-1.5 border-l-2 border-l-brand-500' : ''
                      } ${
                        isHoverTarget && tabHoverDirection === 'right' ? 'translate-x-1.5 border-r-2 border-r-brand-500' : ''
                      } ${
                        isActive
                          ? 'border-transparent shadow-xs'
                          : 'bg-slate-100/70 dark:bg-slate-900/60 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:bg-white dark:hover:bg-slate-900'
                      }`}
                    >
                      {isEditingThisTab ? (
                        <div
                          onClick={(e) => e.stopPropagation()}
                          className="flex items-center gap-1"
                        >
                          <input
                            ref={tabInputRef}
                            type="text"
                            value={tabNameInput}
                            onChange={(e) => setTabNameInput(e.target.value)}
                            onKeyDown={(e) => {
                              e.stopPropagation();
                              if (e.key === 'Enter') {
                                e.preventDefault();
                                handleSaveInlineTabName(tab.id);
                              }
                              if (e.key === 'Escape') {
                                e.preventDefault();
                                handleCancelInlineTabName();
                              }
                            }}
                            onBlur={handleCancelInlineTabName}
                            className="text-xs font-semibold px-1.5 py-0.5 rounded bg-white text-slate-900 dark:bg-slate-800 dark:text-slate-100 border border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 w-28 shadow-xs"
                          />
                          <button
                            type="button"
                            title="Save name"
                            onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); handleSaveInlineTabName(tab.id); }}
                            className="p-1 rounded bg-emerald-500 text-white hover:bg-emerald-600"
                          >
                            <Check className="w-2.5 h-2.5"/>
                          </button>
                          <button
                            type="button"
                            title="Cancel edition"
                            onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); handleCancelInlineTabName(); }}
                            className="p-1 rounded bg-rose-500 text-white hover:bg-rose-600"
                          >
                            <X className="w-2.5 h-2.5"/>
                          </button>
                        </div>
                      ) : (
                        <span className="flex items-center gap-1">
                          {!tab.isLocked && (
                            <span className="text-current opacity-40 hover:opacity-80 cursor-grab active:cursor-grabbing">
                              <GripVertical className="w-3 h-3"/>
                            </span>
                          )}
                          {tab.name}
                        </span>
                      )}

                      {hasOverrides && (
                        <span
                          title="This tab has custom layout overrides"
                          className="opacity-80"
                        >
                          <Layers className="w-3 h-3"/>
                        </span>
                      )}

                      {tab.isLocked && <Lock className="w-3 h-3 opacity-70"/>}

                      {!tab.isLocked && tabs.length > 1 && !isEditingThisTab && (
                        <button
                          type="button"
                          title="Remove Tab"
                          onClick={(e) => {
                            e.stopPropagation();
                            if (onRequestDeleteTab) {
                              onRequestDeleteTab(tab);
                            } else {
                              setTabs(prev => prev.filter(t => t.id !== tab.id));
                            }
                          }}
                          className="p-0.5 rounded hover:bg-rose-500/30 text-inherit opacity-60 hover:opacity-100 transition-colors ml-0.5 cursor-pointer"
                        >
                          <Trash className="w-3 h-3"/>
                        </button>
                      )}
                    </div>
                  );
                })}

                <button
                  type="button"
                  title="Create New Tab"
                  onClick={handleAddNewTab}
                  className="p-1.5 rounded-t-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 cursor-pointer"
                >
                  <Plus className="w-4 h-4"/>
                </button>
              </div>

              <button
                type="button"
                onClick={onOpenTabConfig}
                className="text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-medium flex items-center gap-1 mb-1 cursor-pointer"
              >
                <Settings className="w-3 h-3"/>
                <span>
                  Tab Config
                </span>
              </button>
            </div>
          );
        };

    - filename: "BookmarkCard"
      extension: "tsx"
      path: "webview/src/features/bookmarks/components"
      action: update
      content: |-
        import React, { useState, useEffect, useRef, useMemo, memo } from 'react';
        import { Search, GripVertical, Lock, Plus, Settings, Trash, Check, X } from 'lucide-react';
        import { BookmarkCard as CardType, Bookmark } from '../types/bookmarks.types';
        import { BookmarkItem } from './BookmarkItem';
        import { IconRenderer } from './IconRenderer';

        interface BookmarkCardProps {
          card: CardType;
          currentUser: any;
          onEditCard: (card: CardType) => void;
          onDeleteCard: (card: CardType) => void;
          onAddBookmark: (cardId: string) => void;
          onEditBookmark: (cardId: string, bookmark: Bookmark) => void;
          onDeleteBookmark: (cardId: string, bookmarkId: string) => void;
          onOpenReader: (bm: Bookmark) => void;
          onCopyBookmark: (bm: Bookmark) => void;
          onDropLinkOntoCard: (cardId: string, payload: any, type: 'uri' | 'tree') => void;
          onMoveOrCopyBookmark: (sourceCardId: string, targetCardId: string, bookmarkId: string, isCopy: boolean) => void;
          isSelected: boolean;
          onSelectCard: (e: React.MouseEvent, cardId: string) => void;
          onCardPositionChange: (cardId: string, x: number, y: number) => void;
          onCardSizeChange: (cardId: string, w: number, h: number) => void;
          cardsCollisionAlgo: 'Grid' | 'Compact';
          gridCols?: number;
          gridRows?: number;
          rowHeight?: number;
          gapX?: number;
          gapY?: number;
          defaultHeaderBg?: string;
          defaultHeaderTextColor?: string;
          onCardDragStart: (cardId: string) => void;
          onCardDragEnd: () => void;
          onCardDragOverCard: (cardId: string) => void;
          onCardDragLeaveCard: (cardId: string) => void;
          onCardDropOnCard: (fromCardId: string, toCardId: string) => void;
          isDropTarget?: boolean;
          canvasContainerRef?: React.RefObject<HTMLDivElement | null>;
          isCmdPressed?: boolean;
          isBeingDragged?: boolean;
          hidePrivate?: boolean;
        }

        export const BookmarkCard = memo(({
          card,
          currentUser,
          onEditCard,
          onDeleteCard,
          onAddBookmark,
          onEditBookmark,
          onDeleteBookmark,
          onOpenReader,
          onCopyBookmark,
          onDropLinkOntoCard,
          onMoveOrCopyBookmark,
          isSelected,
          onSelectCard,
          onCardPositionChange,
          onCardSizeChange,
          cardsCollisionAlgo,
          gridCols = 4,
          gridRows = 8,
          rowHeight = 130,
          gapX = 16,
          gapY = 16,
          defaultHeaderBg = '#312e81',
          defaultHeaderTextColor = '#ffffff',
          onCardDragStart,
          onCardDragEnd,
          onCardDragOverCard,
          onCardDragLeaveCard,
          onCardDropOnCard,
          isDropTarget = false,
          canvasContainerRef,
          isCmdPressed = false,
          isBeingDragged = false,
          hidePrivate = false
        }: BookmarkCardProps) => {
          const [filterTerm, setFilterTerm] = useState('');
          const [isDraggingOver, setIsDraggingOver] = useState(false);
          const [selectedBookmarkIds, setSelectedBookmarkIds] = useState<Set<string>>(new Set());
          const cardContainerRef = useRef<HTMLDivElement>(null);

          const [isEditingName, setIsEditingName] = useState(false);
          const [nameInputValue, setNameInputValue] = useState(card.name);
          const nameInputRef = useRef<HTMLInputElement>(null);

          useEffect(() => {
            setNameInputValue(card.name);
          }, [card.name]);

          useEffect(() => {
            if (isEditingName && nameInputRef.current) {
              nameInputRef.current.focus();
              nameInputRef.current.select();
            }
          }, [isEditingName]);

          const handleSaveInlineName = () => {
            const trimmed = nameInputValue.trim();
            if (trimmed && trimmed !== card.name) {
              onEditCard({ ...card, name: trimmed });
            } else {
              setNameInputValue(card.name);
            }
            setIsEditingName(false);
          };

          const handleCancelInlineName = () => {
            setNameInputValue(card.name);
            setIsEditingName(false);
          };

          const selfLocks = card.locks.cardLocks;
          const bmLocks = card.locks.bookmarkLocks;
          const isCardDraggable = !selfLocks.lockedPosition;
          const isCardResizable = !selfLocks.lockedSize;

          const accessibleBookmarks = useMemo(() => {
            return card.bookmarks.filter(bm => {
              if (hidePrivate && bm.isPrivate) return false;
              if (bm.isPrivate && bm.owner !== currentUser.id) return false;
              return true;
            });
          }, [card.bookmarks, hidePrivate, currentUser.id]);

          const filteredBookmarks = useMemo(() => {
            return accessibleBookmarks.filter(bm => {
              if (!filterTerm) return true;
              const term = filterTerm.toLowerCase();
              return (
                bm.name.toLowerCase().includes(term) ||
                bm.url.toLowerCase().includes(term) ||
                (bm.description && bm.description.toLowerCase().includes(term)) ||
                (bm.tags && bm.tags.some(t => t.toLowerCase().includes(term)))
              );
            });
          }, [accessibleBookmarks, filterTerm]);

          const healthRatio = useMemo(() => {
            if (!accessibleBookmarks.length) return 100;
            const healthy = accessibleBookmarks.filter(b => b.healthStatus === 'healthy').length;
            return Math.round((healthy / accessibleBookmarks.length) * 100);
          }, [accessibleBookmarks]);

          const handleBookmarkSelect = (e: React.MouseEvent, bId: string) => {
            if (e.ctrlKey || e.metaKey) {
              setSelectedBookmarkIds(prev => {
                const next = new Set(prev);
                if (next.has(bId)) next.delete(bId);
                else next.add(bId);
                return next;
              });
            } else {
              setSelectedBookmarkIds(new Set([bId]));
            }
          };

          const handleDragOver = (e: React.DragEvent) => {
            e.preventDefault();
            e.stopPropagation();

            const cardDragPayload = e.dataTransfer.types.includes('application/x-bookmark-card-id');
            if (cardDragPayload) {
              onCardDragOverCard(card.id);
              return;
            }

            if (bmLocks.addable) {
              setIsDraggingOver(true);
            }
          };

          const handleDragLeave = (e: React.DragEvent) => {
            e.preventDefault();
            e.stopPropagation();
            setIsDraggingOver(false);
            onCardDragLeaveCard(card.id);
          };

          const handleDrop = (e: React.DragEvent) => {
            e.preventDefault();
            e.stopPropagation();
            setIsDraggingOver(false);

            const draggedCardId = e.dataTransfer.getData('application/x-bookmark-card-id');
            if (draggedCardId && draggedCardId !== card.id) {
              onCardDropOnCard(draggedCardId, card.id);
              return;
            }

            if (!bmLocks.addable) return;

            const bookmarkItemRaw = e.dataTransfer.getData('application/x-bookmark-item');
            if (bookmarkItemRaw) {
              try {
                const { bookmarkId, sourceCardId } = JSON.parse(bookmarkItemRaw);
                const isCopyAction = e.ctrlKey || e.metaKey || isCmdPressed;
                onMoveOrCopyBookmark(sourceCardId, card.id, bookmarkId, isCopyAction);
                return;
              } catch (err) {}
            }

            const treeDataJson = e.dataTransfer.getData('application/bookmark-tree-node');
            if (treeDataJson) {
              try {
                const treeNode = JSON.parse(treeDataJson);
                onDropLinkOntoCard(card.id, treeNode, 'tree');
                return;
              } catch (err) {}
            }

            const uriList = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
            if (uriList && (uriList.startsWith('http://') || uriList.startsWith('https://') || uriList.startsWith('file://'))) {
              onDropLinkOntoCard(card.id, { url: uriList }, 'uri');
            }
          };

          const handleResizeStart = (e: React.MouseEvent) => {
            if (!isCardResizable) return;
            e.preventDefault();
            e.stopPropagation();

            const canvasEl = canvasContainerRef?.current || cardContainerRef.current?.parentElement;
            const canvasRect = canvasEl ? canvasEl.getBoundingClientRect() : { width: 1200, height: 800 };
            const colWidthPx = (canvasRect.width - (gridCols - 1) * gapX) / gridCols;
            const rowHeightPx = rowHeight + gapY;

            const startX = e.clientX;
            const startY = e.clientY;
            const initialW = card.position.w;
            const initialH = card.position.h || 2;

            const handleMouseMove = (moveEvent: MouseEvent) => {
              const deltaX = moveEvent.clientX - startX;
              const deltaY = moveEvent.clientY - startY;

              const addCols = Math.round(deltaX / (colWidthPx + gapX));
              const addRows = Math.round(deltaY / rowHeightPx);

              const newW = Math.max(1, Math.min(gridCols, initialW + addCols));
              const newH = Math.max(1, Math.min(gridRows, initialH + addRows));

              if (newW !== card.position.w || newH !== card.position.h) {
                onCardSizeChange(card.id, newW, newH);
              }
            };

            const handleMouseUp = () => {
              window.removeEventListener('mousemove', handleMouseMove);
              window.removeEventListener('mouseup', handleMouseUp);
            };

            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
          };

          const handleVerticalResizeStart = (e: React.MouseEvent) => {
            if (!isCardResizable) return;
            e.preventDefault();
            e.stopPropagation();

            const rowHeightPx = rowHeight + gapY;
            const startY = e.clientY;
            const initialH = card.position.h || 2;

            const handleMouseMove = (moveEvent: MouseEvent) => {
              const deltaY = moveEvent.clientY - startY;
              const addRows = Math.round(deltaY / rowHeightPx);
              const newH = Math.max(1, Math.min(gridRows, initialH + addRows));

              if (newH !== card.position.h) {
                onCardSizeChange(card.id, card.position.w, newH);
              }
            };

            const handleMouseUp = () => {
              window.removeEventListener('mousemove', handleMouseMove);
              window.removeEventListener('mouseup', handleMouseUp);
            };

            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
          };

          const posX = card.position?.x ?? 0;
          const posY = card.position?.y ?? 0;
          const spanW = Math.min(card.position?.w || 2, gridCols);
          const spanH = card.position?.h || 2;

          return (
            <div
              ref={cardContainerRef}
              onClick={(e) => onSelectCard(e, card.id)}
              onDragOver={handleDragOver}
              onDragLeave={handleDragLeave}
              onDrop={handleDrop}
              style={{
                gridColumn: `${posX + 1} / span ${spanW}`,
                gridRow: `${posY + 1} / span ${spanH}`,
                minHeight: `${spanH * rowHeight + (spanH - 1) * gapY}px`,
                borderColor: card.contentStyle?.borderColor || undefined,
                borderStyle: card.contentStyle?.borderStyle || 'solid',
                backgroundColor: card.contentStyle?.backgroundColor || undefined,
              }}
              className={`group flex flex-col rounded-xl border bg-white dark:bg-slate-900 shadow-sm transition-all duration-200 relative overflow-hidden h-full ${
                isSelected ? 'ring-2 ring-brand-500 shadow-md' : 'hover:shadow-md'
              } ${isDraggingOver ? 'ring-2 ring-emerald-500 bg-emerald-50/10' : ''} ${
                isDropTarget ? 'scale-[0.98] ring-2 ring-brand-500 ring-offset-2 border-brand-500 shadow-xl opacity-90' : ''
              } ${isBeingDragged ? 'opacity-35 scale-[0.98] ring-2 ring-brand-400 border-dashed' : ''}`}
            >
              <div
                draggable={isCardDraggable && !isEditingName}
                onDragStart={(e) => {
                  if (isEditingName) {
                    e.preventDefault();
                    return;
                  }
                  e.dataTransfer.setData('application/x-bookmark-card-id', card.id);
                  if (cardContainerRef.current) {
                    const rect = cardContainerRef.current.getBoundingClientRect();
                    e.dataTransfer.setDragImage(cardContainerRef.current, e.clientX - rect.left, e.clientY - rect.top);
                  }
                  onCardDragStart(card.id);
                }}
                onDragEnd={onCardDragEnd}
                style={{
                  backgroundColor: card.headerStyle?.backgroundColor || defaultHeaderBg,
                  color: card.headerStyle?.textColor || defaultHeaderTextColor,
                }}
                className={`px-3.5 py-2.5 flex items-center justify-between border-b border-slate-200/50 dark:border-slate-800/50 ${
                  isCardDraggable && !isEditingName ? 'cursor-grab active:cursor-grabbing' : 'cursor-default'
                }`}
              >
                <div className="flex items-center gap-2 min-w-0 flex-1">
                  {isCardDraggable && (
                    <span
                      title="Drag to reorder card position"
                      className="text-slate-400 hover:text-slate-200 flex-shrink-0"
                    >
                      <GripVertical className="w-4 h-4"/>
                    </span>
                  )}

                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-1.5">
                      {isEditingName ? (
                        <div
                          onClick={(e) => e.stopPropagation()}
                          className="flex items-center gap-1 w-full"
                        >
                          <input
                            ref={nameInputRef}
                            type="text"
                            value={nameInputValue}
                            onChange={(e) => setNameInputValue(e.target.value)}
                            onKeyDown={(e) => {
                              e.stopPropagation();
                              if (e.key === 'Enter') { e.preventDefault(); handleSaveInlineName(); }
                              if (e.key === 'Escape') { e.preventDefault(); handleCancelInlineName(); }
                            }}
                            onBlur={handleCancelInlineName}
                            className="w-full text-xs font-semibold px-2 py-0.5 rounded bg-white text-slate-900 dark:bg-slate-800 dark:text-slate-100 border border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 shadow-xs"
                          />
                          <button
                            type="button"
                            title="Save name"
                            onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); handleSaveInlineName(); }}
                            className="p-1 rounded bg-emerald-500 text-white hover:bg-emerald-600 flex-shrink-0"
                          >
                            <Check className="w-3 h-3"/>
                          </button>
                          <button
                            type="button"
                            title="Cancel edition"
                            onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); handleCancelInlineName(); }}
                            className="p-1 rounded bg-rose-500 text-white hover:bg-rose-600 flex-shrink-0"
                          >
                            <X className="w-3 h-3"/>
                          </button>
                        </div>
                      ) : (
                        <h3
                          title={selfLocks.lockedName ? 'Card name locked' : 'Double-click to rename'}
                          onDoubleClick={(e) => {
                            if (!selfLocks.lockedName) {
                              e.stopPropagation();
                              setIsEditingName(true);
                            }
                          }}
                          className="font-semibold text-sm truncate tracking-tight select-none cursor-pointer hover:underline decoration-dotted"
                        >
                          {card.name}
                        </h3>
                      )}

                      {card.isPrivate && (
                        <span
                          title="Private Card"
                          className="text-amber-400 flex-shrink-0"
                        >
                          <Lock className="w-3.5 h-3.5"/>
                        </span>
                      )}

                      {selfLocks.lockedPosition && (
                        <span
                          title="Locked Position"
                          className="text-xs bg-black/20 text-slate-300 px-1 rounded flex-shrink-0 font-mono"
                        >
                          🔒 Pos
                        </span>
                      )}

                      {selfLocks.lockedSize && (
                        <span
                          title="Locked Size"
                          className="text-xs bg-black/20 text-slate-300 px-1 rounded flex-shrink-0 font-mono"
                        >
                          🔒 Size
                        </span>
                      )}
                    </div>

                    {card.badges && card.badges.length > 0 && (
                      <div className="flex items-center gap-1 mt-1 flex-wrap">
                        {card.badges.map(b => (
                          <span
                            key={b.id}
                            style={{ backgroundColor: b.backgroundColor, color: b.textColor }}
                            className="text-[10px] font-medium px-1.5 py-0.2 rounded-full inline-flex items-center gap-1"
                          >
                            <IconRenderer className="w-2.5 h-2.5" icon={b.icon} iconType={b.iconType}/>
                            {b.name}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <div className="flex items-center gap-1 flex-shrink-0 ml-2">
                  {bmLocks.addable && (
                    <button
                      type="button"
                      title="Add Bookmark"
                      onClick={(e) => { e.stopPropagation(); onAddBookmark(card.id); }}
                      className="p-1 rounded-md bg-white/10 hover:bg-white/20 text-current transition-colors"
                    >
                      <Plus className="w-3.5 h-3.5"/>
                    </button>
                  )}
                  <button
                    type="button"
                    title="Configure Card"
                    onClick={(e) => { e.stopPropagation(); onEditCard(card); }}
                    className="p-1 rounded-md bg-white/10 hover:bg-white/20 text-current transition-colors"
                  >
                    <Settings className="w-3.5 h-3.5"/>
                  </button>
                  {!selfLocks.lockedDeletion && (
                    <button
                      type="button"
                      title="Remove Card"
                      onClick={(e) => { e.stopPropagation(); onDeleteCard(card); }}
                      className="p-1 rounded-md bg-white/10 hover:bg-rose-500/30 text-current transition-colors"
                    >
                      <Trash className="w-3.5 h-3.5"/>
                    </button>
                  )}
                </div>
              </div>

              <div className="p-2 border-b border-slate-100 dark:border-slate-800/80 bg-slate-50/50 dark:bg-slate-900/40">
                <div className="relative">
                  <span className="absolute inset-y-0 left-0 flex items-center pl-2 text-slate-400 pointer-events-none">
                    <Search className="w-3 h-3"/>
                  </span>
                  <input
                    type="text"
                    placeholder="Search bookmarks in card..."
                    value={filterTerm}
                    onChange={(e) => setFilterTerm(e.target.value)}
                    className="w-full pl-7 pr-2 py-1 text-xs rounded-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-1 focus:ring-brand-500"
                  />
                </div>
              </div>

              <div className="p-2 space-y-1.5 flex-1 min-h-0 overflow-y-auto">
                {filteredBookmarks.length === 0 ? (
                  <div className="py-6 text-center text-xs text-slate-400">
                    {card.bookmarks.length === 0 ? (
                      <p>
                        Drop URLs or click <span className="font-semibold text-brand-500">+</span> to add bookmarks
                      </p>
                    ) : (
                      <p>
                        No matching bookmarks found
                      </p>
                    )}
                  </div>
                ) : (
                  filteredBookmarks.map((bm) => (
                    <BookmarkItem bookmark={bm} cardId={card.id} cardLocks={bmLocks} key={bm.id} onEdit={(item) => onEditBookmark(card.id, item)}
                      onDelete={() => onDeleteBookmark(card.id, bm.id)}
                      onOpenReader={onOpenReader}
                      onCopyBookmark={onCopyBookmark}
                      isSelected={selectedBookmarkIds.has(bm.id)}
                      onSelect={handleBookmarkSelect}
                      isCmdPressed={isCmdPressed}
                      bookmarkDisplayMode={card.bookmarkDisplayMode || 'compact'}
                    />
                  ))
                )}
              </div>

              <div className="mt-auto flex-shrink-0 px-3 py-1.5 bg-slate-50 dark:bg-slate-950/90 border-t border-slate-100 dark:border-slate-800/80 text-[11px] text-slate-400 flex items-center justify-between relative z-10">
                <div className="flex items-center gap-2 truncate">
                  <span>
                    {accessibleBookmarks.length} links
                  </span>
                  <span>•</span>
                  <span className={healthRatio < 100 ? 'text-amber-500 font-medium' : 'text-emerald-500 font-medium'}>
                    {healthRatio}% healthy
                  </span>
                  <span>•</span>
                  <span className="font-mono text-[10px]">
                    ({posX},{posY})
                  </span>
                </div>

                {isCardResizable && (
                  <div className="flex items-center gap-2">
                    <div
                      title="Drag vertically to change card height in grid rows"
                      onMouseDown={handleVerticalResizeStart}
                      className="cursor-ns-resize px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-500 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-950 transition-colors flex items-center gap-0.5 text-[9px] font-mono select-none"
                    >
                      <span className="leading-none">
                        ↕
                      </span>
                      <span className="hidden sm:inline">
                        Row
                      </span>
                    </div>

                    <div
                      title="Drag to resize card width and height"
                      onMouseDown={handleResizeStart}
                      className="cursor-nwse-resize p-0.5 text-slate-400 hover:text-brand-500 transition-colors"
                    >
                      <svg
                        width="10"
                        height="10"
                        viewBox="0 0 10 10"
                        fill="currentColor"
                      >
                        <circle
                          cx="8"
                          cy="8"
                          r="1.5"
                        />
                        <circle
                          cx="4"
                          cy="8"
                          r="1.5"
                        />
                      </svg>
                    </div>
                  </div>
                )}
              </div>

              {isCardResizable && (
                <div
                  title="Drag edge to resize height"
                  onMouseDown={handleVerticalResizeStart}
                  className="absolute bottom-0 inset-x-0 h-1 cursor-ns-resize hover:bg-brand-500/50 transition-colors"
                />
              )}
            </div>
          );
        });

        BookmarkCard.displayName = 'BookmarkCard';

    - filename: "BookmarksPanel"
      extension: "tsx"
      path: "webview/src/features/bookmarks/components"
      action: update
      content: |-
        import React, { useState, useMemo, useRef, useEffect } from 'react';
        import { CornerDownLeft, Plus } from 'lucide-react';
        import { useBookmarksStore } from '../store/useBookmarksStore';
        import { BookmarkCard } from './BookmarkCard';
        import { BookmarkCard as CardType, Bookmark, GridPosition } from '../types/bookmarks.types';
        import { useGridPhysics } from '../hooks/useGridPhysics';

        interface BookmarksPanelProps {
          onEditCard?: (card: CardType) => void;
          onDeleteCard?: (card: CardType) => void;
          onAddBookmark?: (cardId: string) => void;
          onEditBookmark?: (cardId: string, bookmark: Bookmark) => void;
          onDeleteBookmark?: (cardId: string, bookmarkId: string) => void;
          onOpenReader?: (bm: Bookmark) => void;
          onAddNewCard?: () => void;
        }

        export const BookmarksPanel: React.FC<BookmarksPanelProps> = ({
          onEditCard = () => {},
          onDeleteCard = () => {},
          onAddBookmark = () => {},
          onEditBookmark = () => {},
          onDeleteBookmark = () => {},
          onOpenReader = () => {},
          onAddNewCard = () => {}
        }) => {
          const { tabs, activeTabId, setTabs, globalSettings, currentUser } = useBookmarksStore();
          const { computeCompactPositions, findNearestFreeSlot } = useGridPhysics();

          const [draggedCardId, setDraggedCardId] = useState<string | null>(null);
          const [cardHoverTargetId, setCardHoverTargetId] = useState<string | null>(null);
          const [dragGhostPos, setDragGhostPos] = useState<GridPosition | null>(null);
          const [previewDisplacedOrder, setPreviewDisplacedOrder] = useState<string[] | null>(null);
          const [previewDisplacedPositions, setPreviewDisplacedPositions] = useState<Record<string, GridPosition>>({});
          const [selectedCardIds, setSelectedCardIds] = useState<Set<string>>(new Set());
          const [isCmdPressed, setIsCmdPressed] = useState(false);

          const canvasRef = useRef<HTMLDivElement>(null);

          const clearDragGhost = () => {
            setDraggedCardId(null);
            setCardHoverTargetId(null);
            setDragGhostPos(null);
            setPreviewDisplacedOrder(null);
            setPreviewDisplacedPositions({});
          };

          useEffect(() => {
            const handleKeyDown = (e: KeyboardEvent) => {
              if (e.key === 'Meta' || e.key === 'Control') setIsCmdPressed(true);
              if (e.key === 'Escape') {
                clearDragGhost();
              }
            };
            const handleKeyUp = (e: KeyboardEvent) => {
              if (e.key === 'Meta' || e.key === 'Control') setIsCmdPressed(false);
            };
            const handleGlobalDragEnd = () => {
              clearDragGhost();
            };

            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            window.addEventListener('dragend', handleGlobalDragEnd);
            return () => {
              window.removeEventListener('keydown', handleKeyDown);
              window.removeEventListener('keyup', handleKeyUp);
              window.removeEventListener('dragend', handleGlobalDragEnd);
            };
          }, []);

          const activeTab = useMemo(() => {
            return tabs.find(t => t.id === activeTabId) || tabs[0];
          }, [tabs, activeTabId]);

          const effectiveSettings = useMemo(() => {
            const overrides = activeTab?.overrides || {};
            return {
              nbCols: overrides.nbCols ?? globalSettings.nbCols,
              nbRowsMax: overrides.nbRowsMax ?? globalSettings.nbRowsMax,
              rowHeight: overrides.rowHeight ?? globalSettings.rowHeight,
              gapX: overrides.gapX ?? globalSettings.gapX,
              gapY: overrides.gapY ?? globalSettings.gapY,
              showGridLines: overrides.showGridLines ?? globalSettings.showGridLines,
              cardsCollisionAlgo: overrides.cardsCollisionAlgo ?? globalSettings.cardsCollisionAlgo,
              defaultCardHeaderBgColor: overrides.defaultCardHeaderBgColor ?? globalSettings.defaultCardHeaderBgColor,
              defaultCardHeaderTextColor: overrides.defaultCardHeaderTextColor ?? globalSettings.defaultCardHeaderTextColor,
              hidePrivate: overrides.hidePrivate ?? globalSettings.hidePrivate,
            };
          }, [activeTab, globalSettings]);

          const visibleCards = useMemo(() => {
            if (!activeTab) return [];
            let baseCards = activeTab.cards.filter(c => {
              if (effectiveSettings.hidePrivate && c.isPrivate) return false;
              if (c.isPrivate && c.owner !== currentUser.id) return false;
              return true;
            });

            if (previewDisplacedOrder && previewDisplacedOrder.length > 0) {
              const map = new Map(baseCards.map(c => [c.id, c]));
              const reordered = previewDisplacedOrder.map(id => map.get(id)).filter(Boolean) as CardType[];
              baseCards.forEach(c => {
                if (!previewDisplacedOrder.includes(c.id)) reordered.push(c);
              });
              return reordered;
            }

            return baseCards;
          }, [activeTab, currentUser.id, previewDisplacedOrder, effectiveSettings.hidePrivate]);

          const handleCanvasDragOver = (e: React.DragEvent) => {
            const cardDragPayload = e.dataTransfer.types.includes('application/x-bookmark-card-id');
            if (!cardDragPayload || !draggedCardId || !canvasRef.current) return;

            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            const canvasRect = canvasRef.current.getBoundingClientRect();
            const mouseX = e.clientX - canvasRect.left + canvasRef.current.scrollLeft;
            const mouseY = e.clientY - canvasRect.top + canvasRef.current.scrollTop;

            const cellWidth = (canvasRect.width - (effectiveSettings.nbCols - 1) * effectiveSettings.gapX) / effectiveSettings.nbCols;
            const stepX = cellWidth + effectiveSettings.gapX;
            const stepY = effectiveSettings.rowHeight + effectiveSettings.gapY;

            const rawCol = Math.floor(mouseX / stepX);
            const rawRow = Math.floor(mouseY / stepY);

            const currentDragged = activeTab?.cards.find(c => c.id === draggedCardId);
            if (!currentDragged) return;

            const cardW = Math.min(currentDragged.position?.w || 2, effectiveSettings.nbCols);
            const cardH = currentDragged.position?.h || 2;
            const targetCol = Math.max(0, Math.min(effectiveSettings.nbCols - cardW, rawCol));
            const targetRow = Math.max(0, Math.min(effectiveSettings.nbRowsMax - cardH, rawRow));

            if (effectiveSettings.cardsCollisionAlgo === 'Compact') {
              let hoveredCard = visibleCards.find(c => {
                if (c.id === draggedCardId) return false;
                const cx = previewDisplacedPositions[c.id]?.x ?? c.position?.x ?? 0;
                const cy = previewDisplacedPositions[c.id]?.y ?? c.position?.y ?? 0;
                const cw = Math.min(c.position?.w || 2, effectiveSettings.nbCols);
                const ch = c.position?.h || 2;
                return targetCol >= cx && targetCol < cx + cw && targetRow >= cy && targetRow < cy + ch;
              });

              const baseList = [...visibleCards];
              const dragIdx = baseList.findIndex(c => c.id === draggedCardId);

              if (hoveredCard && !hoveredCard.locks?.cardLocks?.lockedPosition) {
                const hoverIdx = baseList.findIndex(c => c.id === hoveredCard.id);
                if (dragIdx !== -1 && hoverIdx !== -1 && dragIdx !== hoverIdx) {
                  const [removed] = baseList.splice(dragIdx, 1);
                  baseList.splice(hoverIdx, 0, removed);
                }
              }

              const compactPositions = computeCompactPositions(baseList, effectiveSettings.nbCols, effectiveSettings.nbRowsMax);
              const ghostPos = compactPositions[draggedCardId];
              if (ghostPos) {
                setDragGhostPos({ x: ghostPos.x, y: ghostPos.y, w: cardW, h: cardH });
              } else {
                setDragGhostPos({ x: targetCol, y: targetRow, w: cardW, h: cardH });
              }
              setPreviewDisplacedPositions(compactPositions);
              setPreviewDisplacedOrder(baseList.map(c => c.id));
            } else {
              const prospectiveGhost = { x: targetCol, y: targetRow, w: cardW, h: cardH };
              setDragGhostPos(prospectiveGhost);

              const collidingCards = visibleCards.filter(c => c.id !== draggedCardId && !(
                prospectiveGhost.x + prospectiveGhost.w <= (c.position?.x ?? 0) ||
                (c.position?.x ?? 0) + (c.position?.w || 2) <= prospectiveGhost.x ||
                prospectiveGhost.y + prospectiveGhost.h <= (c.position?.y ?? 0) ||
                (c.position?.y ?? 0) + (c.position?.h || 2) <= prospectiveGhost.y
              ));

              if (collidingCards.length > 0) {
                const tempDisplacements: Record<string, GridPosition> = {};
                collidingCards.forEach(colCard => {
                  if (!colCard.locks?.cardLocks?.lockedPosition) {
                    const freeSlot = findNearestFreeSlot(
                      colCard,
                      prospectiveGhost,
                      visibleCards,
                      draggedCardId,
                      effectiveSettings.nbCols,
                      effectiveSettings.nbRowsMax,
                      tempDisplacements
                    );
                    if (freeSlot) {
                      tempDisplacements[colCard.id] = freeSlot;
                    }
                  }
                });
                setPreviewDisplacedPositions(tempDisplacements);
              } else {
                setPreviewDisplacedPositions({});
              }
              setPreviewDisplacedOrder(null);
            }
          };

          const handleCanvasDrop = (e: React.DragEvent) => {
            const draggedCardIdFromEvent = e.dataTransfer.getData('application/x-bookmark-card-id');
            const targetId = draggedCardIdFromEvent || draggedCardId;
            if (!targetId || !canvasRef.current) return;

            e.preventDefault();
            e.stopPropagation();

            const canvasRect = canvasRef.current.getBoundingClientRect();
            const mouseX = e.clientX - canvasRect.left + canvasRef.current.scrollLeft;
            const mouseY = e.clientY - canvasRect.top + canvasRef.current.scrollTop;

            const cellWidth = (canvasRect.width - (effectiveSettings.nbCols - 1) * effectiveSettings.gapX) / effectiveSettings.nbCols;
            const stepX = cellWidth + effectiveSettings.gapX;
            const stepY = effectiveSettings.rowHeight + effectiveSettings.gapY;

            const targetCol = dragGhostPos ? dragGhostPos.x : Math.max(0, Math.min(effectiveSettings.nbCols - 1, Math.floor(mouseX / stepX)));
            const targetRow = dragGhostPos ? dragGhostPos.y : Math.max(0, Math.min(effectiveSettings.nbRowsMax - 1, Math.floor(mouseY / stepY)));

            setTabs(prevTabs => prevTabs.map(tab => {
              if (tab.id !== activeTabId) return tab;

              if (effectiveSettings.cardsCollisionAlgo === 'Compact') {
                const order = previewDisplacedOrder || tab.cards.map(c => c.id);
                const orderedCards = order.map(id => tab.cards.find(c => c.id === id)).filter(Boolean) as CardType[];
                tab.cards.forEach(c => {
                  if (!order.includes(c.id)) orderedCards.push(c);
                });

                const updatedCards = orderedCards.map(c => {
                  const newPos = previewDisplacedPositions && previewDisplacedPositions[c.id];
                  if (newPos) {
                    return {
                      ...c,
                      position: { ...c.position, x: newPos.x, y: newPos.y }
                    };
                  }
                  return c;
                });

                return { ...tab, cards: updatedCards };
              }

              const updatedCards = tab.cards.map(c => {
                if (c.id === targetId) {
                  const cardW = c.position?.w || 2;
                  const clampedCol = Math.min(targetCol, effectiveSettings.nbCols - cardW);
                  return {
                    ...c,
                    position: { ...c.position, x: Math.max(0, clampedCol), y: targetRow }
                  };
                }
                if (previewDisplacedPositions && previewDisplacedPositions[c.id]) {
                  return {
                    ...c,
                    position: {
                      ...c.position,
                      x: previewDisplacedPositions[c.id].x,
                      y: previewDisplacedPositions[c.id].y
                    }
                  };
                }
                return c;
              });

              return { ...tab, cards: updatedCards };
            }));

            clearDragGhost();
          };

          const handleCardSizeChange = (cardId: string, newW: number, newH: number) => {
            setTabs(prevTabs => prevTabs.map(tab => {
              if (tab.id !== activeTabId) return tab;
              return {
                ...tab,
                cards: tab.cards.map(card => {
                  if (card.id !== cardId) return card;
                  return {
                    ...card,
                    position: { ...card.position, w: newW, h: newH }
                  };
                })
              };
            }));
          };

          const handleCardPositionChange = (cardId: string, newX: number, newY: number) => {
            setTabs(prevTabs => prevTabs.map(tab => {
              if (tab.id !== activeTabId) return tab;
              return {
                ...tab,
                cards: tab.cards.map(card => {
                  if (card.id !== cardId) return card;
                  return {
                    ...card,
                    position: { ...card.position, x: newX, y: newY }
                  };
                })
              };
            }));
          };

          const handleMoveOrCopyBookmark = (sourceCardId: string, targetCardId: string, bookmarkId: string, isCopy: boolean) => {
            if (!sourceCardId || !targetCardId || !bookmarkId) return;

            setTabs(prevTabs => prevTabs.map(tab => {
              if (tab.id !== activeTabId) return tab;

              const sourceCard = tab.cards.find(c => c.id === sourceCardId);
              const bookmarkToTransfer = sourceCard?.bookmarks.find(b => b.id === bookmarkId);
              if (!bookmarkToTransfer) return tab;

              if (sourceCardId === targetCardId) {
                if (isCopy) {
                  const duplicateBm = {
                    ...bookmarkToTransfer,
                    id: `bm_${Date.now()}_copy`,
                    name: `${bookmarkToTransfer.name} (Copy)`,
                    createdAt: Date.now()
                  };
                  return {
                    ...tab,
                    cards: tab.cards.map(c => c.id === targetCardId ? { ...c, bookmarks: [...c.bookmarks, duplicateBm] } : c)
                  };
                }
                return tab;
              }

              const payloadBm = isCopy ? {
                ...bookmarkToTransfer,
                id: `bm_${Date.now()}_copy`,
                createdAt: Date.now()
              } : bookmarkToTransfer;

              return {
                ...tab,
                cards: tab.cards.map(c => {
                  if (c.id === sourceCardId && !isCopy) {
                    return {
                      ...c,
                      bookmarks: c.bookmarks.filter(b => b.id !== bookmarkId)
                    };
                  }
                  if (c.id === targetCardId) {
                    return {
                      ...c,
                      bookmarks: [...c.bookmarks, payloadBm]
                    };
                  }
                  return c;
                })
              };
            }));
          };

          const handleDropLinkOntoCard = (cardId: string, payload: any, type: 'uri' | 'tree') => {
            if (type === 'uri') {
              try {
                const urlObj = new URL(payload.url);
                const domain = urlObj.hostname.replace('www.', '');
                const newBm: Bookmark = {
                  id: `bm_drop_${Date.now()}`,
                  name: domain.charAt(0).toUpperCase() + domain.slice(1).split('.')[0],
                  description: `Extracted from ${payload.url}`,
                  url: payload.url,
                  icon: `[https://www.google.com/s2/favicons?domain=$](https://www.google.com/s2/favicons?domain=$){domain}&sz=64`,
                  iconType: 'url',
                  tags: ['external-drop'],
                  isPrivate: false,
                  isLocked: false,
                  owner: currentUser.id,
                  healthStatus: 'healthy',
                  clickCount: 0,
                  createdAt: Date.now()
                };

                setTabs(prevTabs => prevTabs.map(tab => {
                  if (tab.id !== activeTabId) return tab;
                  return {
                    ...tab,
                    cards: tab.cards.map(card => card.id === cardId ? { ...card, bookmarks: [...card.bookmarks, newBm] } : card)
                  };
                }));
              } catch (e) {}
            } else if (type === 'tree') {
              const flattenLeaves = (node: any): Bookmark[] => {
                let leaves: Bookmark[] = [];
                if (node.url) {
                  leaves.push({
                    id: `bm_tree_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`,
                    name: node.name,
                    url: node.url,
                    icon: node.icon || 'Globe',
                    iconType: node.iconType || 'lucide',
                    description: `Imported from path: ${node.path?.join(' / ') || 'Bookmarks'}`,
                    tags: node.path ? node.path.map((p: string) => p.toLowerCase().replace(/\s+/g, '-')) : ['imported'],
                    isPrivate: false,
                    isLocked: false,
                    owner: currentUser.id,
                    healthStatus: 'healthy',
                    clickCount: 0,
                    createdAt: Date.now()
                  });
                }
                if (node.children) {
                  node.children.forEach((c: any) => {
                    leaves = leaves.concat(flattenLeaves(c));
                  });
                }
                return leaves;
              };

              const extractedBookmarks = flattenLeaves(payload);
              if (extractedBookmarks.length > 0) {
                setTabs(prevTabs => prevTabs.map(tab => {
                  if (tab.id !== activeTabId) return tab;
                  return {
                    ...tab,
                    cards: tab.cards.map(card => card.id === cardId ? { ...card, bookmarks: [...card.bookmarks, ...extractedBookmarks] } : card)
                  };
                }));
              }
            }
          };

          return (
            <div
              ref={canvasRef}
              onDragOver={handleCanvasDragOver}
              onDragLeave={(e) => {
                if (canvasRef.current && !canvasRef.current.contains(e.relatedTarget as Node)) {
                  setDragGhostPos(null);
                  setCardHoverTargetId(null);
                }
              }}
              onDrop={handleCanvasDrop}
              className={`flex-1 overflow-y-auto p-6 transition-all relative ${!effectiveSettings.showGridLines ? 'bg-slate-50 dark:bg-slate-950' : ''}`}
            >
              <div className="max-w-7xl mx-auto">
                {activeTab?.description && (
                  <div className="mb-4 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                    <p>{activeTab.description}</p>
                    <div className="flex items-center gap-3">
                      {isCmdPressed && (
                        <span className="flex items-center gap-1 text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-2 py-0.5 rounded font-mono text-[11px] font-medium border border-emerald-200 dark:border-emerald-800">
                          <span>Cmd/Ctrl active: Drop will COPY bookmark</span>
                        </span>
                      )}
                      <button
                        type="button"
                        onClick={onAddNewCard}
                        className="flex items-center gap-1 font-semibold text-brand-600 dark:text-brand-400 hover:underline"
                      >
                        <Plus className="w-3.5 h-3.5"/>
                        <span>Add Section Card</span>
                      </button>
                    </div>
                  </div>
                )}

                <div
                  style={{
                    display: 'grid',
                    gridTemplateColumns: `repeat(${effectiveSettings.nbCols}, minmax(0, 1fr))`,
                    columnGap: `${effectiveSettings.gapX}px`,
                    rowGap: `${effectiveSettings.gapY}px`,
                    gridAutoRows: `${effectiveSettings.rowHeight}px`,
                    minHeight: `${effectiveSettings.nbRowsMax * effectiveSettings.rowHeight + (effectiveSettings.nbRowsMax - 1) * effectiveSettings.gapY}px`,
                  }}
                  className="w-full transition-all duration-300 rounded-xl relative"
                >
                  {effectiveSettings.showGridLines && (
                    <div
                      className="absolute inset-0 pointer-events-none"
                      style={{
                        display: 'grid',
                        gridTemplateColumns: `repeat(${effectiveSettings.nbCols}, minmax(0, 1fr))`,
                        columnGap: `${effectiveSettings.gapX}px`,
                        rowGap: `${effectiveSettings.gapY}px`,
                        gridAutoRows: `${effectiveSettings.rowHeight}px`,
                      }}
                    >
                      {Array.from({ length: effectiveSettings.nbCols * effectiveSettings.nbRowsMax }).map((_, idx) => {
                        const col = idx % effectiveSettings.nbCols;
                        const row = Math.floor(idx / effectiveSettings.nbCols);
                        return (
                          <div
                            key={idx}
                            style={{ minHeight: `${effectiveSettings.rowHeight}px` }}
                            className="rounded-xl border border-dashed border-indigo-400/25 dark:border-indigo-500/20 bg-indigo-500/[0.015] dark:bg-indigo-400/[0.015] flex items-start justify-end p-2"
                          >
                            <span className="text-[10px] font-mono text-indigo-400/40 dark:text-indigo-400/30 select-none">
                              {col},{row}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {draggedCardId && dragGhostPos && (
                    <div
                      style={{
                        gridColumn: `${dragGhostPos.x + 1} / span ${dragGhostPos.w}`,
                        gridRow: `${dragGhostPos.y + 1} / span ${dragGhostPos.h}`,
                        minHeight: `${dragGhostPos.h * effectiveSettings.rowHeight + (dragGhostPos.h - 1) * effectiveSettings.gapY}px`,
                      }}
                      className="pointer-events-none rounded-xl border-2 border-dashed border-brand-500/90 bg-brand-500/10 dark:bg-brand-400/15 backdrop-blur-[1.5px] p-4 flex flex-col items-center justify-center text-center z-20 animate-pulse transition-all duration-150 shadow-inner"
                    >
                      <div className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-600 text-white text-xs font-semibold shadow-md mb-1.5">
                        <CornerDownLeft className="w-3.5 h-3.5"/>
                        <span>Future Position ({dragGhostPos.x}, {dragGhostPos.y})</span>
                      </div>
                      <p className="text-xs font-medium text-brand-700 dark:text-brand-300">
                        {effectiveSettings.cardsCollisionAlgo === 'Compact' ? 'Compact Flow Displacement' : 'Grid Nearest-Space Push'}
                      </p>
                      <span className="text-[10px] font-mono text-brand-600/80 dark:text-brand-400/80 mt-0.5">
                        Span: {dragGhostPos.w} col × {dragGhostPos.h} row
                      </span>
                    </div>
                  )}

                  {visibleCards.map((card) => {
                    const previewPos = previewDisplacedPositions && previewDisplacedPositions[card.id];
                    const activeCard = previewPos ? { ...card, position: { ...card.position, ...previewPos } } : card;

                    return (
                      <BookmarkCard card={activeCard} currentUser={currentUser} key={card.id} onAddBookmark={onAddBookmark} onCopyBookmark={(bm)" onDeleteBookmark={onDeleteBookmark} onDeleteCard={onDeleteCard} onEditBookmark={onEditBookmark} onEditCard={onEditCard} onOpenReader={onOpenReader}> navigator.clipboard.writeText(bm.url)}
                        onDropLinkOntoCard={handleDropLinkOntoCard}
                        onMoveOrCopyBookmark={handleMoveOrCopyBookmark}
                        isSelected={selectedCardIds.has(card.id)}
                        onSelectCard={(e, cId) => {
                          if (e.ctrlKey || e.metaKey) {
                            setSelectedCardIds(prev => {
                              const n = new Set(prev);
                              if (n.has(cId)) n.delete(cId);
                              else n.add(cId);
                              return n;
                            });
                          } else {
                            setSelectedCardIds(new Set([cId]));
                          }
                        }}
                        onCardPositionChange={handleCardPositionChange}
                        onCardSizeChange={handleCardSizeChange}
                        cardsCollisionAlgo={effectiveSettings.cardsCollisionAlgo}
                        gridCols={effectiveSettings.nbCols}
                        gridRows={effectiveSettings.nbRowsMax}
                        rowHeight={effectiveSettings.rowHeight}
                        gapX={effectiveSettings.gapX}
                        gapY={effectiveSettings.gapY}
                        defaultHeaderBg={effectiveSettings.defaultCardHeaderBgColor}
                        defaultHeaderTextColor={effectiveSettings.defaultCardHeaderTextColor}
                        onCardDragStart={(cId) => setDraggedCardId(cId)}
                        onCardDragEnd={clearDragGhost}
                        onCardDragOverCard={(cId) => setCardHoverTargetId(cId)}
                        onCardDragLeaveCard={() => setCardHoverTargetId(null)}
                        onCardDropOnCard={(fromId, toId) => {
                          handleCanvasDrop({
                            dataTransfer: { getData: () => fromId },
                            preventDefault: () => {},
                            stopPropagation: () => {},
                            clientX: 0,
                            clientY: 0
                          } as any);
                        }}
                        isDropTarget={cardHoverTargetId === card.id}
                        canvasContainerRef={canvasRef}
                        isCmdPressed={isCmdPressed}
                        isBeingDragged={draggedCardId === card.id}
                        hidePrivate={effectiveSettings.hidePrivate}
                      />
                    );
                  })}
                </div>

                {visibleCards.length === 0 && (
                  <div className="py-20 text-center">
                    <p className="text-sm text-slate-400 mb-2">No accessible cards in this tab</p>
                    <button
                      type="button"
                      onClick={onAddNewCard}
                      className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-brand-600 text-white text-xs font-semibold shadow-sm hover:bg-brand-700 transition-colors"
                    >
                      <Plus className="w-4 h-4"/>
                      <span>Create First Card</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        };

    - filename: "BookmarkTreeview"
      extension: "tsx"
      path: "webview/src/features/bookmarks/components/sidebar"
      action: update
      content: |-
        import React, { useState, useMemo } from 'react';
        import { TreeBookmarkNode } from '../../types/bookmarks.types';
        import { TreeNodeItem } from './TreeNodeItem';
        import { TreeToolbar } from './TreeToolbar';
        import { useTreeSelection } from '../../hooks/useTreeSelection';

        interface BookmarkTreeviewProps {
          treeNodes: TreeBookmarkNode[];
          onTreeNodesChange: (nodes: TreeBookmarkNode[]) => void;
          onImportChromeHtml: (parsed: TreeBookmarkNode[]) => void;
        }

        export const BookmarkTreeview: React.FC<BookmarkTreeviewProps> = ({ treeNodes, onTreeNodesChange, onImportChromeHtml }) => {
          const [searchTerm, setSearchTerm] = useState('');
          const [expandedFolders, setExpandedFolders] = useState<Set<string>>(new Set(['node_bar', 'node_eng']));
          const [importStatus, setImportStatus] = useState<{type: string, message: string} | null>(null);
          const { updateCheckState } = useTreeSelection();

          const toggleFolder = (folderId: string) => {
            setExpandedFolders(prev => {
              const next = new Set(prev);
              if (next.has(folderId)) next.delete(folderId);
              else next.add(folderId);
              return next;
            });
          };

          const handleCheckChange = (nodeId: string, newState: any) => {
            const updated = updateCheckState(treeNodes, nodeId, newState);
            onTreeNodesChange(updated);
          };

          const filterTreeNodes = (nodes: TreeBookmarkNode[], query: string): TreeBookmarkNode[] => {
            if (!query) return nodes;
            const q = query.toLowerCase();
            return nodes.reduce((acc, node) => {
              const nameMatches = node.name?.toLowerCase().includes(q);
              const urlMatches = node.url && node.url.toLowerCase().includes(q);
              const filteredChildren = node.children ? filterTreeNodes(node.children, query) : undefined;
              const hasMatchingChildren = filteredChildren && filteredChildren.length > 0;

              if (nameMatches || urlMatches || hasMatchingChildren) {
                acc.push({
                  ...node,
                  children: filteredChildren
                });
              }
              return acc;
            }, [] as TreeBookmarkNode[]);
          };

          const displayedNodes = useMemo(() => {
            return filterTreeNodes(treeNodes, searchTerm);
          }, [treeNodes, searchTerm]);

          return (
            <div className="flex flex-col h-full bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 w-full">
              <TreeToolbar importStatus={importStatus} onImportChromeHtml={onImportChromeHtml} searchTerm={searchTerm} setExpandedFolders={setExpandedFolders} setImportStatus={setImportStatus} setSearchTerm={setSearchTerm}/>

              <div className="flex-1 overflow-y-auto p-2 space-y-0.5">
                {displayedNodes.length === 0 ? (
                  <div className="py-8 text-center text-xs text-slate-400">
                    {searchTerm ? 'No tree nodes match filter' : 'No bookmarks in treeview'}
                  </div>
                ) : (
                  displayedNodes.map(node => (
                    <TreeNodeItem expandedFolders={expandedFolders} key={node.id} level={0} node={node} onNodeCheckChange={handleCheckChange} toggleFolder={toggleFolder}/>
                  ))
                )}
              </div>

              <div className="p-3 bg-slate-50 dark:bg-slate-950/60 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-500 dark:text-slate-400">
                <p className="flex items-center gap-1 font-medium text-slate-700 dark:text-slate-300 mb-0.5">
                  💡 Drag & Drop Flattening
                </p>
                <p>
                  Drag any folder or checked leaves directly onto an unlocked Card to flatten bookmarks into items with folder path tags.
                </p>
              </div>
            </div>
          );
        };

    - filename: "CardConfigDialog"
      extension: "tsx"
      path: "webview/src/features/bookmarks/components/dialogs"
      action: update
      content: |-
        import React, { useState, useEffect } from 'react';
        import { Settings, X } from 'lucide-react';
        import { BookmarkCard } from '../../types/bookmarks.types';

        interface CardConfigDialogProps {
          isOpen: boolean;
          card: BookmarkCard | null;
          onClose: () => void;
          onSave: (updatedCard: BookmarkCard) => void;
        }

        export const CardConfigDialog: React.FC<CardConfigDialogProps> = ({ isOpen, card, onClose, onSave }) => {
          const [activeTab, setActiveTab] = useState('general');
          const [formData, setFormData] = useState<BookmarkCard | null>(null);

          useEffect(() => {
            if (card) {
              setFormData(JSON.parse(JSON.stringify(card)));
            }
          }, [card]);

          if (!isOpen || !formData) return null;

          const handleSave = () => {
            if (formData) {
              onSave(formData);
            }
            onClose();
          };

          const selfLocks = formData.locks.cardLocks;
          const bmLocks = formData.locks.bookmarkLocks;

          return (
