                            locks: {
                              ...formData.locks,
                              bookmarkLocks: { ...bmLocks, reorderable: e.target.checked }
                            }
                          })}
                          className="mt-0.5 rounded text-brand-600"
                        />
                        <div>
                          <div className="text-xs font-semibold">
                            Allow Reordering
