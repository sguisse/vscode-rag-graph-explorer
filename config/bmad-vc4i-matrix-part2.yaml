bmad_vc4i_matrix_part2:
  - id: phase4-implementation
    title: "Phase 4: Implementation"
    description: "Build it one story at a time"
    skills:
      - command: bmad-sprint-planning
        name: "Sprint Planning"
        prompts:
          planning: >-
            BUSINESS CONTEXT: In a high-variance industrial manufacturing environment, shop floor schedules frequently experience disruption due to unplanned equipment downtime and shifting customer order priorities. Schedulers must continuously balance work center load factors against strict delivery commitments across multiple discrete production lines. Ensuring high overall equipment effectiveness (OEE) while maintaining high customer on-time-in-full (OTIF) metrics requires granular sprint planning for shop-floor automation tools.
            EXPECTED ACTION: Analyze the upcoming implementation stories for the Finite Capacity Production Scheduling engine and conduct a readiness gate assessment. Break down technical dependencies related to machine shift calendars, changeover matrix calculations, and real-time work center status feeds. Prioritize developer backlog items based on shop-floor critical path risks and estimate effort using story points.
            OUTPUT FORMAT: Provide a structured Sprint Planning document organized into three distinct sections: Readiness Gate Evaluation, Prioritized Story Backlog with Effort Estimates, and Dependency Risk Mitigation Matrix. Use standard markdown tables for story allocations and sprint capacity calculations. Ensure every task explicitly lists acceptance criteria aligned with plant operations targets.
          order: >-
            BUSINESS CONTEXT: Industrial equipment manufacturers rely on automated Configure-To-Order (CTO) order validation to prevent unbuildable product configurations from entering production lines. When order entry systems accept invalid component combinations or unverified options, factory floor operations suffer severe delays and costly engineering holds. High-volume order streams require automated verification against live engineering rules before work order creation.
            EXPECTED ACTION: Evaluate user stories for the Order Build Validation engine to establish a sprint plan for upcoming developer iterations. Identify dependencies between customer credit clearance checks, BOM option constraint evaluation, and shop-floor work order generation. Define capacity allocation for edge-case validation testing and legacy order system data mapping.
            OUTPUT FORMAT: Format the output as an executive Sprint Backlog Plan featuring a Sprint Goal summary paragraph, a detailed Story Breakdown Table (ID, Story Name, Points, Priority, Prerequisites), and a Risk Log. Include clear bullet points detailing technical definition-of-done criteria for order validation services. Avoid meta-introductions and start directly with the plan structure.
          orderDelivery: >-
            BUSINESS CONTEXT: End-of-line packaging and finished goods dispatch represent critical touchpoints in the factory-to-delivery value chain where delay bottlenecks directly impact customer satisfaction. Fragmented communication between factory staging docks, 3PL freight carriers, and customer notification portals leads to missed pickup windows and inflated demurrage costs. Automating outbound dispatch notices requires seamless integration between plant warehouse systems and logistics providers.
            EXPECTED ACTION: Plan the implementation sprint for the Outbound Order Delivery and Shipping Notice (ASN) automation engine. Group development tasks around carrier slot reservation APIs, EDI 856 manifest generation, and real-time tracking webhook implementations. Assess technical readiness and flag external API dependencies that could block developer velocity.
            OUTPUT FORMAT: Structure the deliverable as a Sprint Scope & Execution Plan containing a Sprint Readiness Checklist, a Ranked Story Table with story point sizing, and an External API Dependency Log. Utilize markdown tables with clear column headers (Task ID, Technical Scope, Assigned Agent, Complexity, Blockers). Conclude with specific testing milestones for dock-side hardware integration.
          stock: >-
            BUSINESS CONTEXT: Precise tracking of raw material, Work-In-Progress (WIP), and finished goods stock across plant bin locations is essential for maintaining smooth assembly line operation. Material stockouts force line stoppages, while excess buffer stock ties up working capital and inflates factory floor footprint requirements. Modern factories demand real-time stock allocation locks linked dynamically to active work orders.
            EXPECTED ACTION: Conduct sprint planning for the WIP Stock Allocation and Bin Management service. Organize backlog items focusing on barcode/RFID scan ingest, safety stock dynamic buffer updates, and automatic component reservation locks upon work order release. Evaluate team velocity and sequence stories to minimize shop-floor testing disruptions.
            OUTPUT FORMAT: Output a comprehensive Sprint Readiness Report beginning with a Sprint Capacity Overview table. Follow with a detailed Task Breakdown list categorized by core service modules (Ingestion, Allocation, Alerts) and a Sprint Risk Assessment matrix. Ensure all story descriptions include concrete database and event-stream technical requirements.
          referential: >-
            BUSINESS CONTEXT: Master Data Referential services form the foundational backbone for industrial ERP, PLM, and MES integration. Mismatches between Engineering Bill of Materials (EBOM), Manufacturing Bill of Materials (MBOM), and Work Center Routings lead to production errors and scrap. Maintaining single-source-of-truth accuracy requires robust master data management pipelines across all manufacturing facilities.
            EXPECTED ACTION: Plan the development sprint for the Multi-Level BOM Versioning and Routing Referential service. Organize stories covering PLM EBOM ingestion, automated EBOM-to-MBOM transformation workflows, and routing operation mapping. Identify critical path technical risks regarding recursive multi-level BOM explosion performance.
            OUTPUT FORMAT: Present the result as a formal Sprint Backlog Document including a Technical Debt Assessment, a Story Assignment Table (Story ID, Functional Area, Points, Technical Dependency), and a Pipeline Verification Protocol. Use markdown headers for distinct technical sub-domains and tabular formatting for velocity estimations.
          pricing: >-
            BUSINESS CONTEXT: Volatile raw material markets and fluctuating energy surcharges require industrial manufacturers to dynamically adjust finished goods pricing. Static pricing models expose manufacturers to margin erosion on long-lead-time custom builds. Integrating real-time BOM component cost rollups with dynamic pricing engines ensures profitable order acceptance.
            EXPECTED ACTION: Prepare a sprint plan for the Dynamic Manufacturing Pricing Engine. Structure developer deliverables around BOM cost rollup calculations, customer tier discount evaluation, dynamic surcharge application, and margin threshold guardrails. Assess story dependencies on the Master Data Referential service and historical component cost databases.
            OUTPUT FORMAT: Deliver a Sprint Architecture and Backlog Plan starting directly with a Sprint Goal Statement. Include a tabular Breakdown of User Stories detailing functional acceptance criteria, API endpoints impacted, and story point estimates. Conclude with a Sprint Burn-Down Strategy for validating complex math calculations.
          orderAdmenment: >-
            BUSINESS CONTEXT: Customer order amendments post-release introduce significant operational complexity to factory operations. Modifying option packages or quantities while work orders are in progress requires instant evaluation of scrap risk, rework labor costs, and component availability. Without automated controls, mid-production order changes cause shop floor chaos and scheduling drift.
            EXPECTED ACTION: Detail the sprint plan for the Order Amendment Impact & Execution engine. Plan user stories for shop-floor WIP state checking, distributed work order locks, component stock reservation rollbacks, and delta billing calculations. Map technical dependencies with shop floor MES controllers and billing systems.
            OUTPUT FORMAT: Generate a Sprint Scope Document formatted with a Sprint Summary Table, a Sequence-Ordered Story Implementation List, and a Shop-Floor Integration Test Matrix. Ensure clear section separation using horizontal rules and concise bullet points for developer acceptance criteria.

      - command: bmad-build
        name: "Build"
        prompts:
          planning: >-
            BUSINESS CONTEXT: Shop floor execution relies on deterministic finite-capacity scheduling algorithms to route work orders through bottleneck work centers efficiently. Manual schedule adjustments by plant supervisors often introduce unintended line starvation or capacity over-allocation. Automated scheduling modules must dynamically re-calculate execution queues when work order priorities or machine statuses change.
            EXPECTED ACTION: Build the core Finite Capacity Scheduling engine service logic. Implement algorithms that calculate job start/finish times based on work center shift patterns, setup changeover matrices, and tool availability. Build event listeners for machine downtime events that trigger automatic queue re-sequencing.
            OUTPUT FORMAT: Provide the implementation as production-ready Python or Java service code enclosed in clean code blocks. Include comprehensive inline code comments explaining constraint evaluation math, data models for work center capacities, and unit test suites verifying re-sequencing logic.
          order: >-
            BUSINESS CONTEXT: Validating custom finished goods configurations prior to factory release prevents costly assembly errors and line disruptions. The order build validation service acts as a strict gateway, evaluating incoming sales orders against product option rules, component availability, and customer credit status. Immediate, accurate feedback ensures only buildable orders enter the master production schedule.
            EXPECTED ACTION: Implement the Order Build Validation service controller and business logic layer. Code validation routines that check option compatibility matrix rules, perform phantom BOM explosions, verify component lead-time feasibility, and generate standardized validation status responses. Integrate transaction handling to ensure atomic processing.
            OUTPUT FORMAT: Provide fully realized backend code with inline documentation and error handling routines. Supply an API Endpoint Specification table (Method, URI, Payload, Response) and complete JSON schema definitions for order validation request and response structures.
          orderDelivery: >-
            BUSINESS CONTEXT: Timely outbound shipment dispatch depends on automated coordination between factory packaging lines and shipping dock systems. Once finished goods pass final quality inspection, automated systems must generate Advance Shipping Notices (ASN EDI 856), reserve carrier dispatch slots, and issue dock loading instructions. Fast execution prevents warehouse congestion and carrier delay fees.
            EXPECTED ACTION: Construct the Outbound Delivery Execution and ASN Generation service. Implement event-driven handlers that consume 'Finished Goods Passed QA' messages, compile multi-pack shipping structure trees, format compliant EDI 856 and PDF shipping labels, and invoke 3PL carrier booking APIs.
            OUTPUT FORMAT: Deliver production-grade source code for the ASN generation service along with automated integration test scripts. Include clear database schema definitions for Delivery Notes, Shipping Containers, and Carrier Bookings using markdown code blocks.
          stock: >-
            BUSINESS CONTEXT: High-accuracy stock management requires continuous synchronization between warehouse bin scans, raw component reservations, and WIP consumption. When components are picked for a work order, the inventory service must immediately reserve and deduct stock across warehouse bins to prevent double-allocation. Dynamic safety stock alerts must trigger automated replenishment requests before stockouts occur.
            EXPECTED ACTION: Implement the Stock Allocation and Bin Management microservice logic. Build database interaction logic for pessimistic inventory locking during high-concurrency picking scans, automated safety stock threshold checks, and event publication for low-stock conditions.
            OUTPUT FORMAT: Output fully functional backend code implementing the inventory service interfaces, data models, and repository layers. Include a set of unit and integration tests covering concurrent stock allocation scenarios and edge-case race conditions.
          referential: >-
            BUSINESS CONTEXT: Manufacturing accuracy relies on strict synchronization of master data records across PLM, ERP, and factory MES databases. The Master Data Referential engine serves as the canonical record for Item Masters, multi-level Bill of Materials (BOMs), and routing operation steps. Any corruption or lag in master data synchronization leads directly to incorrect product builds on the factory floor.
            EXPECTED ACTION: Build the Master Data Referential management service. Implement REST and gRPC interfaces for creating and updating multi-level BOM trees, validating active engineering revisions, managing operation routing sequences, and broadcasting master data updates to edge factory nodes.
            OUTPUT FORMAT: Provide production-ready backend code implementing the BOM tree traversal and CRUD operations. Supply detailed data schema definitions (DDL or ORM entities) and a comprehensive Swagger/OpenAPI spec snippet describing the referential endpoints.
          pricing: >-
            BUSINESS CONTEXT: Dynamic cost rollups enable manufacturers to maintain profitable margins on complex build-to-order goods despite volatile supplier pricing. The pricing engine calculates real-time finished goods pricing by aggregating raw material component costs, labor routings, work center overheads, and dynamic market surcharges. Accuracy and execution speed are paramount for real-time order quoting systems.
            EXPECTED ACTION: Develop the Dynamic Manufacturing Pricing service module. Code the logic that traverses complex multi-level BOM structures, retrieves live component unit costs, computes operation routing costs based on machine hour rates, and applies customer-specific contract discounts and surcharges.
            OUTPUT FORMAT: Present full implementation code for the pricing engine, complete with mathematical formulas implemented in code. Include comprehensive unit tests verifying cost rollups against complex sample BOM structures and multi-tiered surcharge matrix inputs.
          orderAdmenment: >-
            BUSINESS CONTEXT: Processing order amendments on active work orders requires precise coordination between order management and shop floor execution. If an amendment is approved, the service must immediately evaluate work-in-progress status, calculate rework/scrap costs, release unneeded reserved components, and update the factory dispatch queue without bringing down assembly lines.
            EXPECTED ACTION: Build the Order Amendment State Machine and Delta Execution engine. Code state transitions handling amendment request intake, shop-floor lock requests, scrap/rework evaluation, BOM difference calculation, and dynamic work order update commands sent to the MES.
            OUTPUT FORMAT: Provide complete source code implementing the amendment state machine logic. Include workflow sequence diagrams (represented in Mermaid syntax) and comprehensive unit tests covering all amendment approval and rejection branches.

      - command: bmad-build-auto
        name: "Build Auto"
        prompts:
          planning: >-
            BUSINESS CONTEXT: Unattended automated build pipelines allow continuous delivery of manufacturing planning algorithms and scheduling rules without manual developer intervention. Automated test suites validate that schedule optimization logic consistently complies with work center capacity rules and shift schedules. Fast, automated verification guarantees robust deployment into mission-critical factory control systems.
            EXPECTED ACTION: Execute an unattended automated build run to compile, test, and package the Finite Capacity Master Production Scheduler. Verify that all automated scheduling test scenarios pass, code coverage meets defined thresholds, and deployable container artifacts are generated automatically.
            OUTPUT FORMAT: Output a detailed Automated Build Run Log detailing build steps, compilation status, automated test execution summary (passed/failed/skipped), code coverage metrics, and container image artifact digests. Omit conversational intro text.
          order: >-
            BUSINESS CONTEXT: Automated build pipelines for order validation services ensure that rule updates for product options and constraints can be deployed rapidly and safely. Automated regression testing verifies that new configuration rules do not break existing product option dependencies or order intake workflows. Continuous automation minimizes time-to-market for new product releases.
            EXPECTED ACTION: Run an unattended build execution for the Order Build Validation microservice. Execute full static code analysis, unit tests for option dependency matrices, API contract verification tests, and automatic build artifact generation.
            OUTPUT FORMAT: Provide an Automated Build Execution Report containing Build Pipeline Metrics, Static Analysis Findings, Unit/Contract Test Results Table, and Artifact Deployment Manifest. Format output with clean markdown headings and code blocks.
          orderDelivery: >-
            BUSINESS CONTEXT: Outbound shipping notice and carrier integration services must undergo rigorous automated testing to guarantee fault-tolerant document generation under high volume. Automated pipeline builds test EDI 856 message validation and 3PL carrier mock API responses before releasing software updates to shipping dock workstations.
            EXPECTED ACTION: Execute an unattended automated build and test pipeline for the Order Delivery and ASN generation service. Automate testing of EDI validation schemas, carrier API failover mechanisms, and shipping label generation performance under synthetic load.
            OUTPUT FORMAT: Deliver an Automated Build Summary detailing Pipeline Execution Duration, EDI Validation Test Results, Performance Benchmark Results, and Container Registry Target Digest.
          stock: >-
            BUSINESS CONTEXT: Automated build workflows for inventory management software ensure that high-concurrency stock locking algorithms are thoroughly stress-tested before production deployment. Continuous integration testing verifies that concurrent stock allocation requests from multiple factory lines do not produce deadlock or data corruption.
            EXPECTED ACTION: Trigger an unattended automated build pipeline for the Stock Allocation microservice. Execute automated concurrency stress tests, database migration scripts, and component reservation isolation tests.
            OUTPUT FORMAT: Output a comprehensive Build Pipeline Log featuring Database Migration Verification, Concurrency Test Results, Code Coverage Analysis, and Final Artifact Verification status.
          referential: >-
            BUSINESS CONTEXT: Automated build validation for Master Data Referential modules guarantees that complex multi-level BOM explosion algorithms remain fast and bug-free across schema updates. CI/CD automation validates recursive database query performance and event broadcasting reliability without human manual QA testing.
            EXPECTED ACTION: Run an unattended build execution for the Master Data Referential microservice. Run automated regression tests across deep multi-level BOM data structures, route sequence updates, and Kafka event publishing pipelines.
            OUTPUT FORMAT: Present an Automated CI/CD Run Report including Summary Execution Status, Performance/Latency Benchmarks for BOM Explosion, Test Suite Results, and Package Distribution Details.
          pricing: >-
            BUSINESS CONTEXT: Continuous automated builds for manufacturing pricing engines validate that complex pricing matrices and surcharge algorithms maintain precision across code refactors. Automated test harnesses execute thousands of pricing permutations to verify financial accuracy before production release.
            EXPECTED ACTION: Execute an unattended automated build run for the Dynamic Pricing and Costing engine. Perform automated financial calculation precision tests, surcharge matrix evaluation tests, and API contract compliance suites.
            OUTPUT FORMAT: Provide an Automated Build Execution Log containing Test Suite Breakdown, Math Precision Verification Results, Build Performance Metrics, and Deployment Package Artifact Info.
          orderAdmenment: >-
            BUSINESS CONTEXT: Order amendment software requires automated test validation across complex state machines to prevent invalid order status transitions. Automated builds verify that amendment rollbacks, component releases, and scrap charge calculations function flawlessly across all edge cases before deployment.
            EXPECTED ACTION: Trigger an unattended automated build pipeline for the Order Amendment service. Validate all state machine branch transitions, mock MES lock responses, and automated delta billing computations.
            OUTPUT FORMAT: Deliver a Pipeline Build Summary including State Machine Test Coverage Matrix, Integration Test Pass Rates, Static Security Scan Results, and Release Container Hashes.

      - command: bmad-code-review
        name: "Code Review"
        prompts:
          planning: >-
            BUSINESS CONTEXT: Finite production scheduling algorithms must process high-volume work center state updates with sub-second performance without introducing memory leaks or deadlock conditions. Rigorous code reviews ensure scheduling code adheres to strict concurrency patterns and computational efficiency standards required for continuous shop floor execution.
            EXPECTED ACTION: Perform an in-depth code review of the Master Production Scheduler engine implementation. Inspect memory management during large Gantt chart calculations, verify thread safety on shared work center queue data structures, and assess compliance with enterprise architectural standards.
            OUTPUT FORMAT: Provide a structured Code Review Report comprising Executive Summary, Security & Performance Analysis, Code Quality Findings (with inline code snippet recommendations), and Final Merge Approval Verdict. Use markdown blockquotes for critical findings.
          order: >-
            BUSINESS CONTEXT: Order intake code serves as the frontline safeguard preventing corrupted or invalid product builds from being committed to manufacturing. Thorough code reviews verify that option dependency validation logic, database transaction boundaries, and error logging conform to resilient software engineering practices.
            EXPECTED ACTION: Conduct a comprehensive code review of the Order Build Validation service. Evaluate error handling around invalid CTO configurations, check database transaction boundary isolation during work order generation, and identify potential SQL injection or data parsing vulnerabilities.
            OUTPUT FORMAT: Deliver a formal Code Review Document formatted with Severity Levels (CRITICAL, MAJOR, MINOR), Specific Line-by-Line Code Annotations with proposed refactorings, and an Overall Readiness Score.
          orderDelivery: >-
            BUSINESS CONTEXT: Outbound delivery execution software interfaces directly with external carrier REST APIs and hardware packing station peripherals. Code reviews must verify robust timeout configurations, circuit breaker implementations, and strict EDI document schema compliance to prevent factory shipping dock delays.
            EXPECTED ACTION: Review source code for the Outbound Delivery & ASN Generator service. Inspect external carrier API client implementations for retry and circuit breaker logic, review EDI 856 text formatting routines, and verify secure handling of carrier authentication credentials.
            OUTPUT FORMAT: Structure the review output into an Executive Audit Summary, Architectural Compliance Table, Code Improvement Snippets, and Release Readiness Checklist.
          stock: >-
            BUSINESS CONTEXT: Stock management systems handle continuous, high-concurrency database updates from barcode scanners and automated guided vehicles (AGVs) across the factory floor. Code reviews must rigorously evaluate pessimistic database locks, race-condition mitigation, and transaction isolation levels to prevent inventory drift.
            EXPECTED ACTION: Perform a code review on the Stock Allocation and Bin Tracking microservice. Audit database query locking mechanisms, examine distributed cache synchronization logic, and assess exception handling during inventory shortage events.
            OUTPUT FORMAT: Output a detailed Technical Audit Report with sections for Concurrency & Locking Analysis, Memory/Performance Profile, Detailed Itemized Code Remarks, and Sign-Off Decision.
          referential: >-
            BUSINESS CONTEXT: Master Data Referential code governs critical multi-level BOM structures and routing records used across all manufacturing applications. Code reviews must verify recursive tree traversal efficiency, event publishing atomicity, and schema migration safety to prevent master data corruption.
            EXPECTED ACTION: Conduct a code review of the Master Data Referential engine. Review recursive algorithms for multi-level BOM tree processing, evaluate Kafka publisher transactional guarantees, and check API validation logic for item master attributes.
            OUTPUT FORMAT: Present a structured Code Review Report containing Architectural Integrity Score, Recursive Algorithm Complexity Analysis, Line-Item Refactor Recommendations, and Deployment Approval Status.
          pricing: >-
            BUSINESS CONTEXT: Dynamic pricing engines must execute floating-point arithmetic with strict financial precision to eliminate rounding errors during cost rollups. Code reviews ensure that mathematical calculations utilize appropriate high-precision numeric types and adhere to corporate auditing standards.
            EXPECTED ACTION: Perform a code review of the Dynamic Manufacturing Pricing module. Verify that monetary and component unit calculations use arbitrary-precision decimal libraries, audit surcharge rule evaluation logic, and inspect API response caching mechanisms.
            OUTPUT FORMAT: Deliver a comprehensive Code Quality Report featuring Precision & Numeric Audit Results, Caching Strategy Evaluation, Itemized Code Defect Table, and Final Approval Recommendation.
          orderAdmenment: >-
            BUSINESS CONTEXT: Order amendment processing involves multi-system orchestration with complex rollback requirements in the event of failure. Code reviews must scrutinize state machine transition logic, distributed lock handling, and transactional integrity across Order, WIP, and Billing microservices.
            EXPECTED ACTION: Review source code for the Order Amendment State Machine service. Inspect saga orchestration patterns, distributed lock acquisition and release timeouts, and exception handling during MES communication failures.
            OUTPUT FORMAT: Output a formal Software Audit Document including Distributed Transaction Analysis, Failure Mode & Rollback Audit, Code Modification Annotations, and Release Sign-off.

      - command: bmad-qa-generate-e2e-tests
        name: "QA Automation Test"
        prompts:
          planning: >-
            BUSINESS CONTEXT: Automated end-to-end testing of production scheduling software ensures that complex schedule re-sequencing logic operates reliably under real-world factory load conditions. Quality assurance automation must simulate concurrent shift changes, machine breakdown events, and sudden order priority changes to verify schedule stability.
            EXPECTED ACTION: Generate automated end-to-end API and UI test suites for the Finite Production Capacity Scheduler. Create test cases simulating work center capacity overbooking, shift calendar overrides, and dynamic queue re-ordering upon simulated machine failure.
            OUTPUT FORMAT: Provide complete, runnable automated test scripts (e.g., Cypress/Playwright for UI, REST-assured/PyTest for API) in executable code blocks. Include test environment setup steps, test data fixtures, and explicit assertions for scheduling outputs.
          order: >-
            BUSINESS CONTEXT: QA automation for order validation systems must cover thousands of valid and invalid option combinations to guarantee that unbuildable configurations are rejected reliably. Automated testing validates that error messages accurately guide customer service reps to correct configuration errors before factory submission.
            EXPECTED ACTION: Construct automated E2E test suites for the Order Build Validation engine. Write API tests covering multi-option dependency validation, credit hold triggers, and automated creation of shop floor work orders upon valid submission.
            OUTPUT FORMAT: Output full automated test suite code formatted into distinct test suites (Option Matrix Suite, Credit Hold Suite, Work Order Release Suite). Include comprehensive assertions, mock request payloads, and test execution instructions.
          orderDelivery: >-
            BUSINESS CONTEXT: End-to-end QA automation for delivery execution ensures that end-of-line packing scans reliably trigger correct carrier booking requests and ASN message generation. Automated test suites verify document generation under edge-case conditions like partial order shipments and carrier service outages.
            EXPECTED ACTION: Develop automated E2E integration test scripts for the Outbound Delivery and ASN generation service. Write test scenarios covering end-of-line packaging scan events, EDI 856 message structure validation, and carrier API fallback mechanisms.
            OUTPUT FORMAT: Deliver ready-to-run test automation code (Playwright/REST-assured) with full setup and execution instructions. Format code with clean indentation and include test validation data tables.
          stock: >-
            BUSINESS CONTEXT: Inventory management QA automation must rigorously simulate concurrent stock allocation requests from multiple assembly lines to detect dynamic race conditions or reservation mismatches. E2E tests guarantee that warehouse bin balances remain perfectly synchronized with physical line stock consumption.
            EXPECTED ACTION: Generate automated performance and functional E2E test scripts for the Stock Allocation microservice. Create concurrent test workflows simulating real-time barcode picking scans, bin reservation locks, and automatic safety stock replenishment alerts.
            OUTPUT FORMAT: Present executable automated test code with concurrent execution harnesses. Include test assertions for database state verification, concurrency performance metrics, and detailed execution instructions.
          referential: >-
            BUSINESS CONTEXT: Testing master data referential services requires verifying multi-level BOM structures across deep hierarchical trees and multiple revision versions. Automated QA scripts ensure that engineering change orders (ECOs) correctly propagate through item master and routing records without breaking historical references.
            EXPECTED ACTION: Construct automated E2E API test suites for the Master Data Referential engine. Create test cases for deep multi-level BOM creation, EBOM-to-MBOM revision updates, and routing operation sequence validation.
            OUTPUT FORMAT: Output production-ready automated test code containing recursive BOM verification routines, test data generation helpers, and clear test execution documentation.
          pricing: >-
            BUSINESS CONTEXT: QA automation for manufacturing pricing models must validate cost rollup accuracy across complex option configurations and volatile component cost tables. Automated test suites run comprehensive matrix permutations to verify exact financial outputs against expected benchmark calculations.
            EXPECTED ACTION: Generate automated functional and regression test suites for the Dynamic Manufacturing Pricing Engine. Build test cases covering multi-level BOM cost rollups, customer discount tiers, and dynamic index surcharge calculations.
            OUTPUT FORMAT: Provide runnable automated test scripts featuring extensive assertion sets for monetary accuracy. Structure the output into clear test files with code blocks and include sample input test fixtures.
          orderAdmenment: >-
            BUSINESS CONTEXT: Order amendment QA automation must test complex state transitions when changes occur at various stages of production execution. Automated tests verify that mid-production amendments correctly calculate scrap charges, update MES work orders, and release unused component stock without disrupting unaffected assembly lines.
            EXPECTED ACTION: Develop automated E2E test scripts for the Order Amendment workflow. Simulate amendment requests submitted at different work order execution phases (PLANNED, WIP, FINISHED) and assert correct system state rollbacks, stock adjustments, and delta billing outputs.
            OUTPUT FORMAT: Output full test automation scripts with explicit assertions for each production state transition. Include mock MES interface fixtures, environment configuration guidelines, and clear execution steps.

      - command: bmad-correct-course
        name: "Correct Course"
        prompts:
          planning: >-
            BUSINESS CONTEXT: Unforeseen operational events such as critical component stockouts or major assembly line breakdowns require immediate mid-sprint course correction for software delivery teams. Development priorities must adjust rapidly to deliver critical hotfixes or mitigation tools without abandoning core sprint commitments.
            EXPECTED ACTION: Formulate a mid-sprint course correction plan addressing an urgent requirement change caused by new plant work center line capabilities. Re-prioritize developer stories, re-allocate team velocity, and establish mitigation strategies for deferred features.
            OUTPUT FORMAT: Deliver a formal Course Correction Plan starting directly with an Executive Impact Summary paragraph. Include a Revised Sprint Backlog Table (Original Story, Status, Action Taken, Adjusted Story Points) and a Risk & Communication Strategy list.
          order: >-
            BUSINESS CONTEXT: Discovery of an edge-case configuration bug during production order intake can require immediate developer course correction to prevent invalid work orders from reaching the factory floor. Software teams must pivot quickly to deploy urgent validation fixes while maintaining delivery timelines for scheduled features.
            EXPECTED ACTION: Develop a course correction plan to address critical validation defects identified in the active order intake pipeline. Restructure current sprint backlog tasks, define immediate hotfix scope, and adjust sprint delivery milestones accordingly.
            OUTPUT FORMAT: Present a Course Correction Action Plan formatted with Impact Assessment Bullet Points, a Task Pivot Matrix Table, and an Updated Velocity & Burn-Down Projection.
          orderDelivery: >-
            BUSINESS CONTEXT: Abrupt changes in 3PL carrier API requirements or dock management hardware integrations require rapid alignment adjustments during an active development iteration. Technical teams must modify interface specifications and shift task priorities without losing momentum on core delivery milestones.
            EXPECTED ACTION: Draft a course correction plan reacting to mandatory carrier API schema updates mid-sprint. Re-sequence developer deliverables, isolate affected delivery microservices, and define an adjusted sprint completion roadmap.
            OUTPUT FORMAT: Output a clear Course Correction Strategy featuring an Emergency Scope Delta Table, a Re-sequenced Sprint Timeline, and a Stakeholder Alignment Plan.
          stock: >-
            BUSINESS CONTEXT: High latency spikes detected during peak warehouse barcode scanning require an immediate pivot to optimize database locking mechanisms mid-sprint. Development resources must be reallocated to address performance bottlenecks before adding new stock management functionality.
            EXPECTED ACTION: Formulate a sprint course-correction strategy focusing on immediate performance refactoring of stock allocation database queries. Re-prioritize performance tuning stories over lower-priority backlog items and update sprint capacity allocations.
            OUTPUT FORMAT: Deliver a Sprint Course Correction Report comprising Performance Defect Summary, Scope Trade-Off Table (Deferred vs Accelerated Stories), and Technical Remediation Roadmap.
          referential: >-
            BUSINESS CONTEXT: Discovery of legacy data discrepancies during multi-plant master data migration requires an immediate pause and pivot in development focus. Teams must quickly create data cleansing tools and schema adaptations to handle unannounced legacy BOM structures.
            EXPECTED ACTION: Create a course correction plan to address unexpected legacy BOM data format mismatches during master data service implementation. Define technical interventions for schema mapping, re-allocate developer assignments, and revise sprint goals.
            OUTPUT FORMAT: Provide a Course Correction Blueprint organized with Immediate Technical Containment Steps, Backlog Realignment Matrix, and Revised Release Schedule.
          pricing: >-
            BUSINESS CONTEXT: Sudden regulatory shifts or corporate policy updates regarding raw material surcharge passthroughs require fast adaptation of active pricing module development. Teams must incorporate new financial rules into active code iterations without compromising system reliability.
            EXPECTED ACTION: Draft a course correction document adapting the dynamic pricing engine sprint to new compliance rules for material index surcharges. Re-evaluate active story scopes, update math specs, and adjust sprint delivery commitments.
            OUTPUT FORMAT: Structure the output as an Executive Course Correction Memo featuring Compliance Impact Overview, Modified User Story Requirements Table, and Revised Sprint Milestone Roadmap.
          orderAdmenment: >-
            BUSINESS CONTEXT: Production edge-case testing revealing race conditions during mid-assembly order amendments necessitates an immediate shift in engineering priority. Software teams must suspend non-critical features to build dynamic locking mechanisms for active work orders.
            EXPECTED ACTION: Develop a course correction plan focusing engineering resources on resolving distributed locking flaws in the Order Amendment service. Restructure active sprint tasks, re-allocate developer effort, and establish containment verification gates.
            OUTPUT FORMAT: Output a structured Course Correction Plan including Critical Flaw Analysis, Re-prioritized Sprint Backlog Table, and Verification Test Milestones.

      - command: bmad-retrospective
        name: "Retrospective"
        prompts:
          planning: >-
            BUSINESS CONTEXT: Evidence-based retrospectives after deploying planning and scheduling modules enable continuous process improvement for software engineering and plant operations teams. Analyzing velocity metrics, production bugs, and scheduler adoption provides actionable insights for subsequent release cycles.
            EXPECTED ACTION: Facilitate an evidence-based retrospective for the completed Master Production Scheduling epic. Analyze sprint execution metrics, evaluate cycle times from story commitment to production deployment, and identify root causes for delivery bottlenecks.
            OUTPUT FORMAT: Provide a comprehensive Epic Retrospective Document containing Metrics Summary Table (Velocity, Lead Time, Defect Density), Key Accomplishments, Identified Process Impediments, and Actionable Improvement Items (with assigned owners and target completion dates).
          order: >-
            BUSINESS CONTEXT: Conducting post-implementation retrospectives on order validation workflows helps teams identify gaps in rule specifications and integration testing. Evaluating operational metrics post-launch highlights opportunities to further streamline customer order intake and factory release velocity.
            EXPECTED ACTION: Conduct a retrospective review of the Order Build Validation epic deployment. Review performance metrics, analyze initial production order rejection rates, and identify process improvements for future configuration rule rollouts.
            OUTPUT FORMAT: Deliver a formal Retrospective Report formatted with Quantitative Delivery Performance Metrics, Root Cause Analysis for Escaped Defects, and a SMART Action Item Matrix.
          orderDelivery: >-
            BUSINESS CONTEXT: Reviewing completed delivery execution and ASN automation epics allows engineering teams to optimize external integration patterns and hardware peripheral drivers. Retrospectives provide clarity on carrier API reliability, dock-side user adoption, and system uptime metrics.
            EXPECTED ACTION: Lead an evidence-based retrospective on the Outbound Order Delivery and ASN Generation epic. Evaluate system stability during peak dock loading hours, analyze carrier API error handling, and propose team workflow optimizations.
            OUTPUT FORMAT: Output an Epic Retrospective Summary featuring System Performance Metrics Table, Operational Lessons Learned, Technical Debt Identified, and Continuous Improvement Roadmap.
          stock: >-
            BUSINESS CONTEXT: Post-epic retrospectives for stock management modules evaluate database concurrency performance, hardware scan responsiveness, and inventory accuracy improvements. Continuous retrospective feedback ensures inventory systems stay aligned with fast-paced warehouse operations.
            EXPECTED ACTION: Facilitate a retrospective for the Stock Allocation and Bin Tracking epic. Analyze scan-to-allocation latency data, review developer sprint velocity variance, and establish actionable guidelines for future inventory microservice development.
