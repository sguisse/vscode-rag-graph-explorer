- id: quick-start
  title: Quick Start
  description: Get help or initialize SpecKit Spec-Driven Development (SDD) workflows
  icon: run-all
  emoji: "🔀"
  skills:
    - icon: question
      emoji: "❓"
      name: Help & Guidance
      description: Contextual help for SpecKit SDD workflows and next steps
      command: speckit-help
      prompts:
        - vc4i:
            planning: >-
              <🧠_BUSINESS_CONTEXT>
                Industrial shop floor planners face unexpected bottlenecks when equipment downtime impacts assembly lines. Schedulers need guidance on which SpecKit specification workflow or persona to activate to re-sequence production schedules.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Provide guidance on initiating a spec-driven re-planning workflow using SpecKit commands. Explain how to transition from incident detection to specification updates for the finite scheduling engine.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Provide a 3-step action guide with recommended SpecKit commands, target agents (Spec Architect vs. Dev), and required input parameters.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              <🧠_BUSINESS_CONTEXT>
                Order entry specialists encounter invalid option combinations in Configure-To-Order (CTO) requests.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Recommend the next SpecKit command to diagnose order rule validation failures and configure automated constraint specification contracts.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Concise execution pathway detailing recommended commands (e.g., speckit-spec, speckit-architecture) and decision points.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              <🧠_BUSINESS_CONTEXT>
                Logistics managers face delayed 3PL carrier assignments resulting in dock congestion and potential demurrage costs.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Identify the appropriate SpecKit analysis and specification skills needed to build an automated ASN dispatch integration.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Step-by-step guidance list specifying SpecKit skill invocation sequences for shipping notice automation.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              <🧠_BUSINESS_CONTEXT>
                Plant inventory controllers experience phantom stockouts due to delayed RFID scan ingestion.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Direct the user to the correct SpecKit workflows for specifying real-time inventory reservation locks and buffer alerts.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Structured recommendation matrix listing relevant SpecKit skills, expected inputs, and produced deliverables.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              <🧠_BUSINESS_CONTEXT>
                Engineering revisions in PLM cause BOM synchronization mismatches with MES routing master data.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Guide the user on using SpecKit agents to establish a single-source-of-truth master data spec pipeline.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Direct navigation map linking current master data issues to targeted SpecKit solutioning skills.
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              <🧠_BUSINESS_CONTEXT>
                Raw material cost fluctuations erode margins on long-lead finished goods quotes.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Outline how to leverage SpecKit skills to specify a dynamic cost-rollup and surcharge pricing engine.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Bulleted workflow guide highlighting spec drafting, architectural design, and automated build execution steps.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              <🧠_BUSINESS_CONTEXT>
                Mid-production order modifications create shop floor scrap and scheduling chaos.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Provide instructions on selecting SpecKit skills to specify mid-flight order lock and delta billing controls.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Actionable flowchart in standard text listing agent roles and command triggers.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              <🧠_BUSINESS_CONTEXT>
                High-volume B2B e-commerce orders fail during real-time Available-To-Promise (ATP) stock validation.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Guide the developer on using SpecKit skills to troubleshoot e-commerce API webhooks and order queue processing specs.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Quick-reference diagnostic list with recommended SpecKit skills for e-commerce integration.
              </🖨️_OUTPUT_FORMAT>
    - icon: book
      emoji: "🏁"
      name: Init Spec Repo
      description: Initialize repository layout and core SpecKit SDD conventions
      command: speckit-init
      prompts:
        - vc4i:
            planning: >-
              <🧠_BUSINESS_CONTEXT>
                Initializing repository layout for the Shop-Floor Finite Capacity Scheduling module under SpecKit SDD guidelines.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Establish standard SpecKit repository structure including specs folder, template files, and AGENTS.md configuration.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Directory layout tree and setup summary detailing folder structure and initial configuration contracts.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              <🧠_BUSINESS_CONTEXT>
                Setting up SpecKit SDD repository structure for CTO Order Build Validation service.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Bootstrap the project specifications root directory and configure option rule validation spec templates.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Boilerplate structure list with description of core specification files created.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              <🧠_BUSINESS_CONTEXT>
                Initializing SpecKit environment for Outbound Shipping & EDI 856 Integration system.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Generate project specification templates and contract definitions for carrier webhook integrations.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Summary checklist of initialized SpecKit repository files and initial contract definitions.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              <🧠_BUSINESS_CONTEXT>
                Setting up SpecKit layout for WIP Stock Allocation and RFID Telemetry project.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Initialize spec directories for stream processing rules, buffer thresholds, and Redis lock contracts.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Formatted folder map with template details for inventory event schemas.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              <🧠_BUSINESS_CONTEXT>
                Initializing SpecKit repository for Master Data Referential Synchronization hub.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Create standard specification taxonomy for multi-level BOM explosion and routing transformation rules.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Spec repository initialization report detailing schema directories and mapping contracts.
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              <🧠_BUSINESS_CONTEXT>
                Bootstrapping SpecKit structure for Dynamic Component Cost Rollup and Pricing Engine repository.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Establish spec files for financial precision rules, index feed integrations, and surcharge policies.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Structured setup overview with initialized specification paths and validation rules.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              <🧠_BUSINESS_CONTEXT>
                Initializing SpecKit environment for Order Amendment WIP State Controller.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Setup repository structure for state machine specifications, hold locks, and delta calculation contracts.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Initialization plan with created spec template manifest and state transition schemas.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              <🧠_BUSINESS_CONTEXT>
                Initializing SpecKit repository layout for B2B E-commerce Order Ingestion Middleware.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Bootstrap spec workspace for checkout cart stock locks, payload mapping, and ERP submission queues.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Repository initialization manifest with core endpoint spec templates.
              </🖨️_OUTPUT_FORMAT>
  collapsed: false

- id: phase1-specification
  title: "Phase 1: Specification"
  description: Define executable features, requirements, and domain contracts
  icon: search
  emoji: "📊"
  skills:
    - icon: file-text
      emoji: "📄"
      name: Feature Spec (SPEC.md)
      description: Create or update executable SPEC.md contract
      command: speckit-spec
      prompts:
        - vc4i:
            planning: >-
              <🧠_BUSINESS_CONTEXT>
                High-mix discrete machinery manufacturer requires a modern SPEC.md contract for Finite Capacity Production Scheduling.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Author a formal SPEC.md document covering capacity constraints, work center availability, shift overrides, and schedule SLAs.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Executable SPEC.md contract with Endpoints, Data Models, Error Enums, and Acceptance Criteria.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              <🧠_BUSINESS_CONTEXT>
                Equipment builder requires a SPEC.md contract for CTO Order Build Validation Engine.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Draft a SPEC.md defining JSON option combination payload schemas, constraint violation codes, and latency SLAs (<50ms).
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Production SPEC.md contract with request/response schemas and explicit validation rules.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              <🧠_BUSINESS_CONTEXT>
                Dispatch operations need a SPEC.md contract for Outbound Shipping Notice & 3PL Carrier Integration.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Produce a SPEC.md specifying EDI 856 manifest formats, carrier slot booking API hooks, and webhook event payloads.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Strict SPEC.md contract detailing Interface Definitions, Output Validation Rules, and Carrier Delivery SLA.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              <🧠_BUSINESS_CONTEXT>
                Plant warehouse requires a SPEC.md contract for WIP Stock Allocation & Smart Bin System.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Author a SPEC.md covering real-time RFID scan ingestion, Redis distributed locks, and buffer recalculation algorithms.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Technical SPEC.md document featuring gRPC/REST method definitions, lock TTL specs, and performance guarantees.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              <🧠_BUSINESS_CONTEXT>
                Manufacturing engineering team needs a SPEC.md contract for PLM-to-MES Master Data Referential Sync.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Write a SPEC.md defining recursive EBOM-to-MBOM conversion, routing mapping endpoints, and versioning schemas.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Executable SPEC.md contract containing GraphQL/REST schemas, status codes, and data types.
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              <🧠_BUSINESS_CONTEXT>
                Commercial operations requires a SPEC.md contract for Dynamic BOM Cost Rollup & Surcharge Engine.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Create a SPEC.md specifying raw material price feed contracts, arbitrary precision decimal math, and surcharge formulas.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Precise SPEC.md contract detailing Field Data Types, Mathematical Rounding Rules, and API Endpoint Schemas.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              <🧠_BUSINESS_CONTEXT>
                Plant operations needs a SPEC.md contract for Order Amendment Impact & WIP Controller.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Author a SPEC.md defining mid-production change evaluation, scrap/rework calculation formulas, and WIP hold locks.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Strict SPEC.md contract featuring gRPC/REST Method Definitions, State Enum Values, and Financial Delta Schemas.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              <🧠_BUSINESS_CONTEXT>
                E-commerce team requires a SPEC.md contract for B2B Web Order Ingestion & ATP Stock Reservation Service.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Create a SPEC.md covering shopping cart inventory hold locks, customer tier pricing resolution, and ERP queue status.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Production SPEC.md contract detailing Endpoint Contracts, HMAC Headers, Payload JSON Schemas, and SLA Requirements.
              </🖨️_OUTPUT_FORMAT>

    - icon: tasklist
      emoji: "📊"
      name: User Stories & Scenarios
      description: Break specifications into Gherkin user stories and executable scenarios
      command: speckit-user-stories
      prompts:
        - vc4i:
            planning: >-
              <🧠_BUSINESS_CONTEXT>
                Finite Capacity Scheduling SPEC.md requirements need breakdown into executable BDD user stories.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Generate User Stories formatted with Given/When/Then Gherkin acceptance criteria for shift overrides and capacity solvers.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                User Stories & Scenarios Backlog formatted with Story Sizing, Dependencies, and Executable Gherkin Feature files.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              <🧠_BUSINESS_CONTEXT>
                CTO Order Validation Engine SPEC.md needs story and scenario decomposition.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Create User Stories (Option Constraint Engine, ERP Credit Gateway) with explicit Gherkin scenarios for invalid builds.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Backlog Document containing Scenarios, Sizing Estimates, Technical Dependencies, and Test Verification Criteria.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              <🧠_BUSINESS_CONTEXT>
                Outbound Order Delivery SPEC.md needs scenario decomposition for development sprints.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Generate granular Gherkin scenarios for EDI 856 generation, carrier slot booking failures, and dock status alerts.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Structured Scenario Backlog with Story IDs, Point Estimates, and Detailed Acceptance Test Protocols.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              <🧠_BUSINESS_CONTEXT>
                WIP Stock Allocation SPEC.md requires user scenario creation.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Break down requirements into scenarios for RFID ingestion, concurrent bin stock locks, and safety buffer breaches.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Gherkin Feature Scenarios complete with Priority Ratings, Effort Estimates, and Concrete Definition of Done Criteria.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              <🧠_BUSINESS_CONTEXT>
                Master Data Referential SPEC.md needs scenario breakdown for engineering teams.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Create Gherkin scenarios for recursive EBOM-to-MBOM conversion and routing operation assignments.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Scenario Specification featuring Ranked Stories, Technical Contracts, and Data Validation Rules.
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              <🧠_BUSINESS_CONTEXT>
                Dynamic Pricing SPEC.md requirements need translation into testable scenarios.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Break down requirements into Gherkin scenarios covering commodity index feeds, cost rollups, and volume discounting.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Feature Scenarios Document with Story Points, Mathematical Formulas, and Gherkin Verification Criteria.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              <🧠_BUSINESS_CONTEXT>
                Order Amendment SPEC.md requires scenario decomposition.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Create Gherkin scenarios for WIP state checking, work order locks, component rollbacks, and delta billing calculations.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Backlog Specification with Scenario Breakdown, Edge Case Scenarios, and Test Verification Plans.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              <🧠_BUSINESS_CONTEXT>
                B2B E-commerce Order Ingestion SPEC.md needs scenario decomposition.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Generate Gherkin scenarios for ATP real-time locking, customer tier pricing, and ERP submission timeouts.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Sized Gherkin Scenario Backlog with API Method Names, Headers, and SLA Requirements.
              </🖨️_OUTPUT_FORMAT>

- id: phase2-design
  title: "Phase 2: Architecture & Design"
  description: Formalize technical design, schemas, and system contracts
  icon: type-hierarchy
  emoji: "🏗️"
  skills:
    - icon: layout
      emoji: "📐"
      name: System Architecture
      description: Make system boundaries and component topologies explicit
      command: speckit-architecture
      prompts:
        - vc4i:
            planning: >-
              <🧠_BUSINESS_CONTEXT>
                Heavy industrial manufacturing enterprise needs an architectural blueprint for its Finite Capacity Production Scheduling System.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Architect a microservices/event-driven system handling shift calendars, work center availability, job sequencing, and real-time shop floor events.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                System Architecture Document featuring Component Diagrams (Mermaid), Event Stream Topology, API Specifications, and Data Store Choices.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              <🧠_BUSINESS_CONTEXT>
                System architecture needed for CTO Order Build Validation service connecting CRM, ERP, and MES.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Define technical architecture including rule evaluation engine, distributed caching layer for fast option lookup, and asynchronous work order generator.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Architecture Specification with Sequence Diagrams, Interface Definitions (gRPC/REST), Database Schemas, and Fault-Tolerance Patterns.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              <🧠_BUSINESS_CONTEXT>
                Technical design required for Outbound Order Delivery & ASN EDI 856 Service.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Architect an integration hub linking plant warehouse controllers with external 3PL carrier APIs and legacy EDI translation gateways.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Technical Architecture Document detailing API Gateway configuration, Message Queue topology (RabbitMQ/Kafka), Resiliency, and Security.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              <🧠_BUSINESS_CONTEXT>
                Architectural design for Real-Time WIP Stock Allocation & RFID Scan Processing System.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Architect an IoT telemetry processing pipeline handling 10,000 scans/sec, dynamic inventory locks, and ERP synchronization.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Comprehensive Architecture Document detailing Ingestion Pipeline, Stream Processing Rules, In-Memory Caching (Redis), and Persistence Layer.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              <🧠_BUSINESS_CONTEXT>
                Enterprise master data architecture needed for PLM-to-MES Multi-Level BOM Versioning Hub.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Design a scalable data architecture for BOM explosion, versioning, routing mapping, and multi-plant data synchronization.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Architecture Document with Entity-Relationship Diagrams, Data Pipeline Topology, Conflict Resolution Rules, and Schema Definitions.
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              <🧠_BUSINESS_CONTEXT>
                Architectural specification for Dynamic Manufacturing Pricing & Cost Rollup Engine.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Architect a high-precision financial processing engine that calculates dynamic BOM cost rollups, applies volume tier rules, and outputs quotes.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Architecture Specification detailing Numerical Precision Rules, Caching Strategy, Integration Interfaces, and Audit Logging Architecture.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              <🧠_BUSINESS_CONTEXT>
                System architecture for Order Amendment & Shop Floor WIP State Controller.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Design a distributed transaction management architecture (Saga Pattern) to handle work order holds, stock unlocks, and delta billing updates.
              </🎯_EXPECTED_ACTION>


