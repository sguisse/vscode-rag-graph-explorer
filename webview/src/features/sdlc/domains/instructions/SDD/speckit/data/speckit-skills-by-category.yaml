                System Architecture Document featuring Saga Flow Diagrams, Compensation Logic Maps, State Persistence Schemas, and Event Models.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              <🧠_BUSINESS_CONTEXT>
                Scalable architecture design for B2B E-commerce Order Ingestion & ATP Inventory Locking Middleware.
              </🧠_BUSINESS_CONTEXT>


              <🎯_EXPECTED_ACTION>
                Architect an API middleware layer handling flash order spikes, distributed stock locking, credit limit validation, and ERP queueing.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Production Architecture Document featuring High-Availability Topologies, Distributed Locking Patterns (Redis Redlock), and Latency Profiles.
              </🖨️_OUTPUT_FORMAT>

