- id: quick-start
  title: Quick Start
  description: Get help or implement quickly without all phases
  icon: run-all
  emoji: "🔀"
  skills:
    - icon: question
      emoji: "❓"
      name: Help & Guidance
      description: Contextual help for next steps
      command: bmad-help
      prompts:
        - vc4i:
            planning: >-
              ## 🧠 BUSINESS CONTEXT
                Industrial shop floor planners face unexpected bottlenecks when equipment downtime impacts assembly lines. Schedulers need guidance on which BMAD workflow or agent to activate to re-sequence production schedules.

              <🎯_EXPECTED_ACTION>
                Provide guidance on initiating a re-planning workflow using BMAD skills. Explain how to transition from incident detection to story re-prioritization for the finite scheduling engine.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Provide a 3-step action guide with recommended BMAD commands, target agents (SRE vs. PM), and required input parameters.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              ## 🧠 BUSINESS CONTEXT
                Order entry specialists encounter invalid option combinations in Configure-To-Order (CTO) requests.

              <🎯_EXPECTED_ACTION>
                Recommend the next BMAD skill to diagnose order rule validation failures and configure automated constraint checking.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Concise execution pathway detailing recommended commands (e.g., bmad-agent-analyst, bmad-prd) and decision points.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              ## 🧠 BUSINESS CONTEXT
                Logistics managers face delayed 3PL carrier assignments resulting in dock congestion and potential demurrage costs.

              <🎯_EXPECTED_ACTION>
                Identify the appropriate BMAD analysis and architecture skills needed to build an automated ASN dispatch integration.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Step-by-step guidance list specifying BMAD skill invocation sequences for shipping notice automation.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              ## 🧠 BUSINESS CONTEXT
                Plant inventory controllers experience phantom stockouts due to delayed RFID scan ingestion.

              <🎯_EXPECTED_ACTION>
                Direct the user to the correct BMAD workflows for designing real-time inventory reservation locks and buffer alerts.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Structured recommendation matrix listing relevant BMAD skills, expected inputs, and produced deliverables.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              ## 🧠 BUSINESS CONTEXT
                Engineering revisions in PLM cause BOM synchronization mismatches with MES routing master data.

              <🎯_EXPECTED_ACTION>
                Guide the user on using BMAD agents to establish a single-source-of-truth master data pipeline.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Direct navigation map linking current master data issues to targeted BMAD solutioning skills.
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              ## 🧠 BUSINESS CONTEXT
                Raw material cost fluctuations erode margins on long-lead finished goods quotes.

              <🎯_EXPECTED_ACTION>
                Outline how to leverage BMAD skills to build a dynamic cost-rollup and surcharge pricing engine.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Bulleted workflow guide highlighting analysis, architectural design, and automated build execution steps.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              ## 🧠 BUSINESS CONTEXT
                Mid-production order modifications create shop floor scrap and scheduling chaos.

              <🎯_EXPECTED_ACTION>
                Provide instructions on selecting BMAD skills to implement mid-flight order lock and delta billing controls.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Actionable flowchart in standard text listing agent roles and command triggers.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              ## 🧠 BUSINESS CONTEXT
                High-volume B2B e-commerce orders fail during real-time Available-To-Promise (ATP) stock validation.

              <🎯_EXPECTED_ACTION>
                Guide the developer on using BMAD skills to troubleshoot e-commerce API webhooks and order queue processing.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Quick-reference diagnostic list with recommended BMAD skills for e-commerce integration.
              </🖨️_OUTPUT_FORMAT>
  collapsed: false

- id: phase1-analysis
  title: "Phase 1: Analysis"
  description: Explore the problem space and validate ideas
  icon: search
  emoji: "📊"
  skills:
    - icon: light-bulb
      emoji: "💡"
      name: Brainstorming
      description: Brainstorm ideas with guided facilitation
      command: bmad-brainstorming
      prompts:
        - vc4i:
            planning: >-
              ## 🧠 BUSINESS CONTEXT
                Industrial plant managers need innovative concepts to mitigate machine changeover downtime in high-variance discrete assembly.

              <🎯_EXPECTED_ACTION>
                Facilitate a structured brainstorming session focusing on automated sequence optimization algorithms and predictive shift planning.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Ranked list of 5 innovative scheduling concepts categorized by implementation complexity, OEE impact, and data prerequisites.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              ## 🧠 BUSINESS CONTEXT
                CTO order streams often contain invalid option dependencies that escape manual entry validation.

              <🎯_EXPECTED_ACTION>
                Brainstorm automated constraint checking methods for complex industrial equipment options (e.g., voltage matching, frame sizing).
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Categorized ideation mind-map (Text format) covering rule engine options, UX guardrails, and real-time ERP verification mechanisms.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              ## 🧠 BUSINESS CONTEXT
                Shipping docks experience dock-door congestion due to uncoordinated 3PL carrier pickup arrivals.

              <🎯_EXPECTED_ACTION>
                Generate solutions for automated dock slot reservation and real-time EDI 856 Advance Shipping Notice (ASN) dispatch triggers.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Idea matrix evaluating proposals on carrier adoption, API feasibility, reduction in demurrage fees, and ROI.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              ## 🧠 BUSINESS CONTEXT
                Assembly lines suffer intermittent material shortages despite adequate total plant stock due to poor bin-level visibility.

              <🎯_EXPECTED_ACTION>
                Brainstorm IoT and automated scanning solutions for real-time WIP stock allocation dynamic safety buffers.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Structured concept summary covering sensor hardware, event-driven software patterns, and operator workflow changes.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              ## 🧠 BUSINESS CONTEXT
                Frequent discrepancies between PLM Engineering BOMs and MES Manufacturing BOMs lead to costly rework.

              <🎯_EXPECTED_ACTION>
                Facilitate ideation on automated EBOM-to-MBOM transformation and routing synchronization pipelines.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Pro/Con evaluation matrix of potential synchronization architectures (event-driven ETL, GraphQL middleware, direct PLM triggers).
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              ## 🧠 BUSINESS CONTEXT
                Volatile copper and steel market prices make static quote pricing risky for 12-week build cycles.

              <🎯_EXPECTED_ACTION>
                Brainstorm automated pricing engines that continuously update finished product quotes based on real-time component cost rollups.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                List of actionable pricing concepts detailing data source requirements, risk guardrails, and customer transparency mechanisms.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              ## 🧠 BUSINESS CONTEXT
                Customers frequently request custom modifications after work orders have been released to the shop floor.

              <🎯_EXPECTED_ACTION>
                Brainstorm automated amendment evaluation mechanisms to calculate instant scrap risk, rework labor, and delta billing.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Conceptual framework outlining WIP state detection, automatic work order holding locks, and cost impact calculators.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              ## 🧠 BUSINESS CONTEXT
                B2B customers demand real-time Available-To-Promise (ATP) inventory visibility during online checkout.

              <🎯_EXPECTED_ACTION>
                Brainstorm ultra-low-latency inventory synchronization strategies between core ERP stock tables and e-commerce storefronts.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Solution matrix comparing caching layers, webhooks, and distributed ledger techniques for ATP queries.
              </🖨️_OUTPUT_FORMAT>

    - icon: flame
      emoji: "🔥"
      name: Forge Idea
      description: Pressure-test and harden an idea until it proves out or dies cheaply
      command: bmad-forge-idea
      prompts:
        - vc4i:
            planning: >-
              ## 🧠 BUSINESS CONTEXT
                Proposal to implement an AI-driven dynamic finite scheduling engine on the shop floor.

              <🎯_EXPECTED_ACTION>
                Pressure-test the proposal against edge cases like sudden multi-machine power failures, unrecorded operator absence, and missing raw material lots.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Stress-Test Report containing Failure Modes Analysis, Critical Assumptions list, and Hardened Concept Specifications.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              ## 🧠 BUSINESS CONTEXT
                Idea to enforce zero-touch automated CTO order release directly to MES without human planner review.

              <🎯_EXPECTED_ACTION>
                Challenge this concept by simulating high-risk order edge cases (custom engineered options, unverified credit, obsolete sub-assemblies).
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Risk Assessment Log with explicit Go/No-Go guardrails and mandatory human-in-the-loop fallback conditions.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              ## 🧠 BUSINESS CONTEXT
                Proposal for fully automated EDI 856 shipping notice dispatch upon automated packaging line scan.

              <🎯_EXPECTED_ACTION>
                Stress-test against network latency, partial pallet loads, damaged barcodes, and misaligned carrier pickup slots.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Vulnerability Analysis highlighting failure scenarios, automated rollback protocols, and exception queue designs.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              ## 🧠 BUSINESS CONTEXT
                Proposal to use computer vision for automated WIP bin stock level tracking on assembly lines.

              <🎯_EXPECTED_ACTION>
                Challenge technical feasibility against factory environmental factors (lighting variations, stacked parts, dirty lenses).
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Feasibility Evaluation Matrix with alternative low-cost fallbacks (e.g., smart scale weight sensors, RFID tags).
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              ## 🧠 BUSINESS CONTEXT
                Proposal to automate continuous real-time synchronization between EBOM in Teamcenter and MBOM in SAP.

              <🎯_EXPECTED_ACTION>
                Stress-test against simultaneous engineering changes, active work orders in flight, and circular BOM dependencies.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Data Integrity Risk Assessment detailing lock protocols, staging queues, and reconciliation procedures.
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              ## 🧠 BUSINESS CONTEXT
                Idea to dynamically adjust order pricing post-checkout if component spot prices increase by >5%.

              <🎯_EXPECTED_ACTION>
                Pressure-test against legal liability, customer relationship damage, contract terms, and order cancellation risks.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Business Risk & Viability Audit with recommended pricing model adjustments and contract clause requirements.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              ## 🧠 BUSINESS CONTEXT
                Proposal to allow self-service B2B order amendments up to 24 hours prior to final assembly.

              <🎯_EXPECTED_ACTION>
                Stress-test against parts already issued to WIP, sub-assembly staging delays, and scheduling slot loss.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Operational Feasibility Report defining strict non-amendable production thresholds and automated penalty charges.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              ## 🧠 BUSINESS CONTEXT
                Proposal to instantly lock factory stock for 30 minutes during customer e-commerce cart sessions.

              <🎯_EXPECTED_ACTION>
                Pressure-test against cart abandonment, inventory starvation for high-priority industrial clients, and Denial-of-Service scenarios.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Threat and Bottleneck Evaluation Report with dynamic lock duration and user tier recommendations.
              </🖨️_OUTPUT_FORMAT>

    - icon: file-text
      emoji: "📄"
      name: Product Brief
      description: Create a concise product brief
      command: bmad-product-brief
      prompts:
        - vc4i:
            planning: >-
              ## 🧠 BUSINESS CONTEXT
                High-mix discrete machinery manufacturer requires a modern Finite Capacity Production Scheduling Engine.

              <🎯_EXPECTED_ACTION>
                Write a Product Brief defining core problem, target persona (Plant Scheduler), business goals (OEE +12%, OTIF >98%), and key features.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Executive Product Brief following standard structure: Problem, Opportunity, Target User, Core Value Proposition, Success Metrics.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              ## 🧠 BUSINESS CONTEXT
                Industrial equipment company needs an Order Build Validation & Constraint Engine.

              <🎯_EXPECTED_ACTION>
                Draft a Product Brief outlining automated rule evaluation for CTO builds, preventing unbuildable configurations from entering MES.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Structured Product Brief with explicit Functional Objectives, Integration Points (ERP/MES), and Key Performance Indicators.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              ## 🧠 BUSINESS CONTEXT
                Dispatch operations need an Automated Outbound Shipping & ASN Management Portal.

              <🎯_EXPECTED_ACTION>
