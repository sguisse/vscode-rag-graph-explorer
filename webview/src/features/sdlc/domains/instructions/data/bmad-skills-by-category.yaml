                Write a Product Brief detailing dynamic price calculation based on raw material spot prices, margins, and volume tiers.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Product Brief featuring Core Features, Financial Objectives, System Interfaces, and Guardrail Rules.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              ## 🧠 BUSINESS CONTEXT
                Machinery builder requires an Order Amendment Impact & WIP Lock Engine.

              <🎯_EXPECTED_ACTION>
                Develop a Product Brief for assessing post-release order changes, calculating scrap/rework costs, and updating MES work orders.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Product Brief outlining System Vision, Key Functional Requirements, Operating Constraints, and Impact Metrics.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              ## 🧠 BUSINESS CONTEXT
                B2B industrial portal requires an E-commerce Order Ingestion & ATP Reservation Middleware.

              <🎯_EXPECTED_ACTION>
                Draft a Product Brief for seamless order passing from web shopfront to ERP with instant stock locking.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Product Brief with Clear Scope Statement, Performance SLA Targets (<200ms response), and Success Metrics.
              </🖨️_OUTPUT_FORMAT>

