- id: phase4-implementation
  title: "Phase 4: Implementation"
  description: Build it one story at a time
  icon: code
  emoji: "⚙️"
  skills:
    - icon: calendar
      emoji: "🗓️"
      name: Sprint Planning
      description: Readiness gate then sprint tracking and status
      command: bmad-sprint-planning
      prompts:
        - vc4i:
            planning: >-
              ## 🧠 BUSINESS CONTEXT
                In a high-variance industrial manufacturing environment, shop floor schedules frequently experience disruption due to unplanned equipment downtime and shifting customer order priorities. Schedulers must continuously balance work center load factors against strict delivery commitments across multiple discrete production lines. Ensuring high overall equipment effectiveness (OEE) while maintaining high customer on-time-in-full (OTIF) metrics requires granular sprint planning for shop-floor automation tools.

              <🎯_EXPECTED_ACTION>
                Analyze the upcoming implementation stories for the Finite Capacity Production Scheduling engine and conduct a readiness gate assessment. Break down technical dependencies related to machine shift calendars, changeover matrix calculations, and real-time work center status feeds. Prioritize developer backlog items based on shop-floor critical path risks and estimate effort using story points.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Provide a structured Sprint Planning document organized into three distinct sections: Readiness Gate Evaluation, Prioritized Story Backlog with Effort Estimates, and Dependency Risk Mitigation Matrix. Use standard markdown tables for story allocations and sprint capacity calculations. Ensure every task explicitly lists acceptance criteria aligned with plant operations targets.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              ## 🧠 BUSINESS CONTEXT
                Industrial equipment manufacturers rely on automated Configure-To-Order (CTO) order validation to prevent unbuildable product configurations from entering production lines. When order entry systems accept invalid component combinations or unverified options, factory floor operations suffer severe delays and costly engineering holds. High-volume order streams require automated verification against live engineering rules before work order creation.

              <🎯_EXPECTED_ACTION>
                Evaluate user stories for the Order Build Validation engine to establish a sprint plan for upcoming developer iterations. Identify dependencies between customer credit clearance checks, BOM option constraint evaluation, and shop-floor work order generation. Define capacity allocation for edge-case validation testing and legacy order system data mapping.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Format the output as an executive Sprint Backlog Plan featuring a Sprint Goal summary paragraph, a detailed Story Breakdown Table (ID, Story Name, Points, Priority, Prerequisites), and a Risk Log. Include clear bullet points detailing technical definition-of-done criteria for order validation services. Avoid meta-introductions and start directly with the plan structure.
              </🖨️_OUTPUT_FORMAT>
            orderDelivery: >-
              ## 🧠 BUSINESS CONTEXT
                End-of-line packaging and finished goods dispatch represent critical touchpoints in the factory-to-delivery value chain where delay bottlenecks directly impact customer satisfaction. Fragmented communication between factory staging docks, 3PL freight carriers, and customer notification portals leads to missed pickup windows and inflated demurrage costs. Automating outbound dispatch notices requires seamless integration between plant warehouse systems and logistics providers.

              <🎯_EXPECTED_ACTION>
                Plan the implementation sprint for the Outbound Order Delivery and Shipping Notice (ASN) automation engine. Group development tasks around carrier slot reservation APIs, EDI 856 manifest generation, and real-time tracking webhook implementations. Assess technical readiness and flag external API dependencies that could block developer velocity.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Structure the deliverable as a Sprint Scope & Execution Plan containing a Sprint Readiness Checklist, a Ranked Story Table with story point sizing, and an External API Dependency Log. Utilize markdown tables with clear column headers (Task ID, Technical Scope, Assigned Agent, Complexity, Blockers). Conclude with specific testing milestones for dock-side hardware integration.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              ## 🧠 BUSINESS CONTEXT
                Precise tracking of raw material, Work-In-Progress (WIP), and finished goods stock across plant bin locations is essential for maintaining smooth assembly line operation. Material stockouts force line stoppages, while excess buffer stock ties up working capital and inflates factory floor footprint requirements. Modern factories demand real-time stock allocation locks linked dynamically to active work orders.

              <🎯_EXPECTED_ACTION>
                Conduct sprint planning for the WIP Stock Allocation and Bin Management service. Organize backlog items focusing on barcode/RFID scan ingest, safety stock dynamic buffer updates, and automatic component reservation locks upon work order release. Evaluate team velocity and sequence stories to minimize shop-floor testing disruptions.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Output a comprehensive Sprint Readiness Report beginning with a Sprint Capacity Overview table. Follow with a detailed Task Breakdown list categorized by core service modules (Ingestion, Allocation, Alerts) and a Sprint Risk Assessment matrix. Ensure all story descriptions include concrete database and event-stream technical requirements.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              ## 🧠 BUSINESS CONTEXT
                Master Data Referential services form the foundational backbone for industrial ERP, PLM, and MES integration. Mismatches between Engineering Bill of Materials (EBOM), Manufacturing Bill of Materials (MBOM), and Work Center Routings lead to production errors and scrap. Maintaining single-source-of-truth accuracy requires robust master data management pipelines across all manufacturing facilities.

              <🎯_EXPECTED_ACTION>
                Plan the development sprint for the Multi-Level BOM Versioning and Routing Referential service. Organize stories covering PLM EBOM ingestion, automated EBOM-to-MBOM transformation workflows, and routing operation mapping. Identify critical path technical risks regarding recursive multi-level BOM explosion performance.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Present the result as a formal Sprint Backlog Document including a Technical Debt Assessment, a Story Assignment Table (Story ID, Functional Area, Points, Technical Dependency), and a Pipeline Verification Protocol. Use markdown headers for distinct technical sub-domains and tabular formatting for velocity estimations.
              </🖨️_OUTPUT_FORMAT>
            pricing: >-
              ## 🧠 BUSINESS CONTEXT
                Volatile raw material markets and fluctuating energy surcharges require industrial manufacturers to dynamically adjust finished goods pricing. Static pricing models expose manufacturers to margin erosion on long-lead-time custom builds. Integrating real-time BOM component cost rollups with dynamic pricing engines ensures profitable order acceptance.

              <🎯_EXPECTED_ACTION>
                Prepare a sprint plan for the Dynamic Manufacturing Pricing Engine. Structure developer deliverables around BOM cost rollup calculations, customer tier discount evaluation, dynamic surcharge application, and margin threshold guardrails. Assess story dependencies on the Master Data Referential service and historical component cost databases.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Deliver a Sprint Architecture and Backlog Plan starting directly with a Sprint Goal Statement. Include a tabular Breakdown of User Stories detailing functional acceptance criteria, API endpoints impacted, and story point estimates. Conclude with a Sprint Burn-Down Strategy for validating complex math calculations.
              </🖨️_OUTPUT_FORMAT>
            orderAdmenment: >-
              ## 🧠 BUSINESS CONTEXT
                Customer order amendments post-release introduce significant operational complexity to factory operations. Modifying option packages or quantities while work orders are in progress requires instant evaluation of scrap risk, rework labor costs, and component availability. Without automated controls, mid-production order changes cause shop floor chaos and scheduling drift.

              <🎯_EXPECTED_ACTION>
                Detail the sprint plan for the Order Amendment Impact & Execution engine. Plan user stories for shop-floor WIP state checking, distributed work order locks, component stock reservation rollbacks, and delta billing calculations. Map technical dependencies with shop floor MES controllers and billing systems.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Generate a Sprint Scope Document formatted with a Sprint Summary Table, a Sequence-Ordered Story Implementation List, and a Shop-Floor Integration Test Matrix. Ensure clear section separation using horizontal rules and concise bullet points for developer acceptance criteria.
              </🖨️_OUTPUT_FORMAT>
        - ecommerce:
            order: >-
              ## 🧠 BUSINESS CONTEXT
                E-commerce platforms for industrial equipment manufacturers must handle complex product configurations, multi-tier pricing, and real-time inventory availability. Inaccurate order validation or delayed stock updates can lead to customer dissatisfaction and lost revenue. A robust e-commerce backend requires seamless integration with ERP and MES systems.

              <🎯_EXPECTED_ACTION>
                Develop a sprint plan for the E-commerce Order Management and Validation system. Organize stories around real-time inventory checks, dynamic pricing calculations, and automated order confirmation workflows. Identify dependencies on the Master Data Referential service and external payment gateways.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Present a Sprint Execution Plan with a clear Sprint Goal, a Prioritized Story Backlog Table (Story ID, Description, Points, Dependencies), and an Integration Testing Checklist. Use markdown tables for clarity and ensure all stories include acceptance criteria aligned with e-commerce best practices.
              </🖨️_OUTPUT_FORMAT>

