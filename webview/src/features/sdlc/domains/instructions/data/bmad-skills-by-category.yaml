              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Product Brief with clear Business Drivers, Target User Personas (Warehouse Manager, Carrier Dispatcher), and Operational Requirements.
              </🖨️_OUTPUT_FORMAT>
            stock: >-
              ## 🧠 BUSINESS CONTEXT
                Assembly plant requires a Real-Time WIP Stock Allocation and Bin Management System.

              <🎯_EXPECTED_ACTION>
                Author a Product Brief for real-time inventory tracking, automatic safety buffer alerts, and component reservation locks.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Concise Product Brief specifying Key Capabilities, Data Integration Boundaries, and ROI Targets.
              </🖨️_OUTPUT_FORMAT>
            referential: >-
              ## 🧠 BUSINESS CONTEXT
                Enterprise manufacturing group requires a Master Data Referential Management Service for BOMs and Routings.

              <🎯_EXPECTED_ACTION>
                Produce a Product Brief for automated EBOM-to-MBOM conversion, versioning control, and Work Center master mapping.
