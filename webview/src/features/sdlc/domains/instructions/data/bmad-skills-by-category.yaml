            planning: >-
              ## 🧠 BUSINESS CONTEXT
                Industrial machinery plant needs a comprehensive PRD for the Finite Capacity Scheduling Service.

              <🎯_EXPECTED_ACTION>
                Generate a detailed PRD including functional requirements for shift management, work center capacity constraints, machine maintenance locks, and schedule optimization.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
                Formal PRD document with User Stories, Functional & Non-Functional Requirements, Edge Cases, and Acceptance Criteria.
              </🖨️_OUTPUT_FORMAT>
            order: >-
              ## 🧠 BUSINESS CONTEXT
                Equipment builder requires a PRD for the CTO Order Build Validation Engine.

              <🎯_EXPECTED_ACTION>
                Write a PRD covering constraint evaluation rules, credit check integration, mandatory option dependencies, and order state transitions.
              </🎯_EXPECTED_ACTION>


              <🖨️_OUTPUT_FORMAT>
