    - icon: tasklist
      emoji: "📊"
      name: "Epics & Stories"
      description: Break requirements into implementable work
      command: bmad-create-epics-and-stories
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: Finite Capacity Scheduling System requirements need breakdown into actionable engineering work.
              EXPECTED ACTION: Break down the PRD into Epics (Shift Management, Capacity Solver, Gantt API) and detailed User Stories with Gherkin acceptance criteria.
              OUTPUT FORMAT: Epics & Stories Backlog formatted with Story Sizing (Points), Dependencies, and Given/When/Then Acceptance Criteria.
