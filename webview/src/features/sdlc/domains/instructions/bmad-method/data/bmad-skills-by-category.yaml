- id: quick-start
  title: Quick Start
  description: Get help or implement quickly without all phases
  icon: run-all
  emoji: "🔀"
  skills:
    - icon: question
      emoji: "❓"
      name: Help & Guidance
      description: Contextual help for next steps
      command: bmad-help
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: Industrial shop floor planners face unexpected bottlenecks when equipment downtime impacts assembly lines. Schedulers need guidance on which BMAD workflow or agent to activate to re-sequence production schedules.
              EXPECTED ACTION: Provide guidance on initiating a re-planning workflow using BMAD skills. Explain how to transition from incident detection to story re-prioritization for the finite scheduling engine.
              OUTPUT FORMAT: Provide a 3-step action guide with recommended BMAD commands, target agents (SRE vs. PM), and required input parameters.
            order: >-
              BUSINESS CONTEXT: Order entry specialists encounter invalid option combinations in Configure-To-Order (CTO) requests.
              EXPECTED ACTION: Recommend the next BMAD skill to diagnose order rule validation failures and configure automated constraint checking.
              OUTPUT FORMAT: Concise execution pathway detailing recommended commands (e.g., bmad-agent-analyst, bmad-prd) and decision points.
            orderDelivery: >-
              BUSINESS CONTEXT: Logistics managers face delayed 3PL carrier assignments resulting in dock congestion and potential demurrage costs.
              EXPECTED ACTION: Identify the appropriate BMAD analysis and architecture skills needed to build an automated ASN dispatch integration.
              OUTPUT FORMAT: Step-by-step guidance list specifying BMAD skill invocation sequences for shipping notice automation.
            stock: >-
              BUSINESS CONTEXT: Plant inventory controllers experience phantom stockouts due to delayed RFID scan ingestion.
              EXPECTED ACTION: Direct the user to the correct BMAD workflows for designing real-time inventory reservation locks and buffer alerts.
              OUTPUT FORMAT: Structured recommendation matrix listing relevant BMAD skills, expected inputs, and produced deliverables.
            referential: >-
              BUSINESS CONTEXT: Engineering revisions in PLM cause BOM synchronization mismatches with MES routing master data.
              EXPECTED ACTION: Guide the user on using BMAD agents to establish a single-source-of-truth master data pipeline.
              OUTPUT FORMAT: Direct navigation map linking current master data issues to targeted BMAD solutioning skills.
            pricing: >-
              BUSINESS CONTEXT: Raw material cost fluctuations erode margins on long-lead finished goods quotes.
              EXPECTED ACTION: Outline how to leverage BMAD skills to build a dynamic cost-rollup and surcharge pricing engine.
              OUTPUT FORMAT: Bulleted workflow guide highlighting analysis, architectural design, and automated build execution steps.
            orderAdmenment: >-
              BUSINESS CONTEXT: Mid-production order modifications create shop floor scrap and scheduling chaos.
              EXPECTED ACTION: Provide instructions on selecting BMAD skills to implement mid-flight order lock and delta billing controls.
              OUTPUT FORMAT: Actionable flowchart in standard text listing agent roles and command triggers.
        - ecommerce:
            order: >-
              BUSINESS CONTEXT: High-volume B2B e-commerce orders fail during real-time Available-To-Promise (ATP) stock validation.
              EXPECTED ACTION: Guide the developer on using BMAD skills to troubleshoot e-commerce API webhooks and order queue processing.
              OUTPUT FORMAT: Quick-reference diagnostic list with recommended BMAD skills for e-commerce integration.
  collapsed: false

- id: phase1-analysis
  title: "Phase 1: Analysis"
  description: Explore the problem space and validate ideas
  icon: search
  emoji: "📊"
  skills:
    - icon: light-bulb
      emoji: "💡"
      name: Brainstorming
      description: Brainstorm ideas with guided facilitation
      command: bmad-brainstorming
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: Industrial plant managers need innovative concepts to mitigate machine changeover downtime in high-variance discrete assembly.
              EXPECTED ACTION: Facilitate a structured brainstorming session focusing on automated sequence optimization algorithms and predictive shift planning.
              OUTPUT FORMAT: Ranked list of 5 innovative scheduling concepts categorized by implementation complexity, OEE impact, and data prerequisites.
            order: >-
              BUSINESS CONTEXT: CTO order streams often contain invalid option dependencies that escape manual entry validation.
              EXPECTED ACTION: Brainstorm automated constraint checking methods for complex industrial equipment options (e.g., voltage matching, frame sizing).
              OUTPUT FORMAT: Categorized ideation mind-map (Text format) covering rule engine options, UX guardrails, and real-time ERP verification mechanisms.
            orderDelivery: >-
              BUSINESS CONTEXT: Shipping docks experience dock-door congestion due to uncoordinated 3PL carrier pickup arrivals.
              EXPECTED ACTION: Generate solutions for automated dock slot reservation and real-time EDI 856 Advance Shipping Notice (ASN) dispatch triggers.
              OUTPUT FORMAT: Idea matrix evaluating proposals on carrier adoption, API feasibility, reduction in demurrage fees, and ROI.
            stock: >-
              BUSINESS CONTEXT: Assembly lines suffer intermittent material shortages despite adequate total plant stock due to poor bin-level visibility.
              EXPECTED ACTION: Brainstorm IoT and automated scanning solutions for real-time WIP stock allocation dynamic safety buffers.
              OUTPUT FORMAT: Structured concept summary covering sensor hardware, event-driven software patterns, and operator workflow changes.
            referential: >-
              BUSINESS CONTEXT: Frequent discrepancies between PLM Engineering BOMs and MES Manufacturing BOMs lead to costly rework.
              EXPECTED ACTION: Facilitate ideation on automated EBOM-to-MBOM transformation and routing synchronization pipelines.
              OUTPUT FORMAT: Pro/Con evaluation matrix of potential synchronization architectures (event-driven ETL, GraphQL middleware, direct PLM triggers).
            pricing: >-
              BUSINESS CONTEXT: Volatile copper and steel market prices make static quote pricing risky for 12-week build cycles.
              EXPECTED ACTION: Brainstorm automated pricing engines that continuously update finished product quotes based on real-time component cost rollups.
              OUTPUT FORMAT: List of actionable pricing concepts detailing data source requirements, risk guardrails, and customer transparency mechanisms.
            orderAdmenment: >-
              BUSINESS CONTEXT: Customers frequently request custom modifications after work orders have been released to the shop floor.
              EXPECTED ACTION: Brainstorm automated amendment evaluation mechanisms to calculate instant scrap risk, rework labor, and delta billing.
              OUTPUT FORMAT: Conceptual framework outlining WIP state detection, automatic work order holding locks, and cost impact calculators.
        - ecommerce:
            order: >-
              BUSINESS CONTEXT: B2B customers demand real-time Available-To-Promise (ATP) inventory visibility during online checkout.
              EXPECTED ACTION: Brainstorm ultra-low-latency inventory synchronization strategies between core ERP stock tables and e-commerce storefronts.
              OUTPUT FORMAT: Solution matrix comparing caching layers, webhooks, and distributed ledger techniques for ATP queries.

    - icon: flame
      emoji: "🔥"
      name: Forge Idea
      description: Pressure-test and harden an idea until it proves out or dies cheaply
      command: bmad-forge-idea
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: Proposal to implement an AI-driven dynamic finite scheduling engine on the shop floor.
              EXPECTED ACTION: Pressure-test the proposal against edge cases like sudden multi-machine power failures, unrecorded operator absence, and missing raw material lots.
              OUTPUT FORMAT: Stress-Test Report containing Failure Modes Analysis, Critical Assumptions list, and Hardened Concept Specifications.
            order: >-
              BUSINESS CONTEXT: Idea to enforce zero-touch automated CTO order release directly to MES without human planner review.
              EXPECTED ACTION: Challenge this concept by simulating high-risk order edge cases (custom engineered options, unverified credit, obsolete sub-assemblies).
              OUTPUT FORMAT: Risk Assessment Log with explicit Go/No-Go guardrails and mandatory human-in-the-loop fallback conditions.
            orderDelivery: >-
              BUSINESS CONTEXT: Proposal for fully automated EDI 856 shipping notice dispatch upon automated packaging line scan.
              EXPECTED ACTION: Stress-test against network latency, partial pallet loads, damaged barcodes, and misaligned carrier pickup slots.
              OUTPUT FORMAT: Vulnerability Analysis highlighting failure scenarios, automated rollback protocols, and exception queue designs.
            stock: >-
              BUSINESS CONTEXT: Proposal to use computer vision for automated WIP bin stock level tracking on assembly lines.
              EXPECTED ACTION: Challenge technical feasibility against factory environmental factors (lighting variations, stacked parts, dirty lenses).
              OUTPUT FORMAT: Feasibility Evaluation Matrix with alternative low-cost fallbacks (e.g., smart scale weight sensors, RFID tags).
            referential: >-
              BUSINESS CONTEXT: Proposal to automate continuous real-time synchronization between EBOM in Teamcenter and MBOM in SAP.
              EXPECTED ACTION: Stress-test against simultaneous engineering changes, active work orders in flight, and circular BOM dependencies.
              OUTPUT FORMAT: Data Integrity Risk Assessment detailing lock protocols, staging queues, and reconciliation procedures.
            pricing: >-
              BUSINESS CONTEXT: Idea to dynamically adjust order pricing post-checkout if component spot prices increase by >5%.
              EXPECTED ACTION: Pressure-test against legal liability, customer relationship damage, contract terms, and order cancellation risks.
              OUTPUT FORMAT: Business Risk & Viability Audit with recommended pricing model adjustments and contract clause requirements.
            orderAdmenment: >-
              BUSINESS CONTEXT: Proposal to allow self-service B2B order amendments up to 24 hours prior to final assembly.
              EXPECTED ACTION: Stress-test against parts already issued to WIP, sub-assembly staging delays, and scheduling slot loss.
              OUTPUT FORMAT: Operational Feasibility Report defining strict non-amendable production thresholds and automated penalty charges.
        - ecommerce:
            order: >-
              BUSINESS CONTEXT: Proposal to instantly lock factory stock for 30 minutes during customer e-commerce cart sessions.
              EXPECTED ACTION: Pressure-test against cart abandonment, inventory starvation for high-priority industrial clients, and Denial-of-Service scenarios.
              OUTPUT FORMAT: Threat and Bottleneck Evaluation Report with dynamic lock duration and user tier recommendations.

    - icon: file-text
      emoji: "📄"
      name: Product Brief
      description: Create a concise product brief
      command: bmad-product-brief
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: High-mix discrete machinery manufacturer requires a modern Finite Capacity Production Scheduling Engine.
              EXPECTED ACTION: Write a Product Brief defining core problem, target persona (Plant Scheduler), business goals (OEE +12%, OTIF >98%), and key features.
              OUTPUT FORMAT: Executive Product Brief following standard structure: Problem, Opportunity, Target User, Core Value Proposition, Success Metrics.
            order: >-
              BUSINESS CONTEXT: Industrial equipment company needs an Order Build Validation & Constraint Engine.
              EXPECTED ACTION: Draft a Product Brief outlining automated rule evaluation for CTO builds, preventing unbuildable configurations from entering MES.
              OUTPUT FORMAT: Structured Product Brief with explicit Functional Objectives, Integration Points (ERP/MES), and Key Performance Indicators.
            orderDelivery: >-
              BUSINESS CONTEXT: Dispatch operations need an Automated Outbound Shipping & ASN Management Portal.
              EXPECTED ACTION: Create a Product Brief detailing 3PL carrier API integration, dock scheduling, and automatic EDI 856 shipping notice generation.
              OUTPUT FORMAT: Product Brief with clear Business Drivers, Target User Personas (Warehouse Manager, Carrier Dispatcher), and Operational Requirements.
            stock: >-
              BUSINESS CONTEXT: Assembly plant requires a Real-Time WIP Stock Allocation and Bin Management System.
              EXPECTED ACTION: Author a Product Brief for real-time inventory tracking, automatic safety buffer alerts, and component reservation locks.
              OUTPUT FORMAT: Concise Product Brief specifying Key Capabilities, Data Integration Boundaries, and ROI Targets.
            referential: >-
              BUSINESS CONTEXT: Enterprise manufacturing group requires a Master Data Referential Management Service for BOMs and Routings.
              EXPECTED ACTION: Produce a Product Brief for automated EBOM-to-MBOM conversion, versioning control, and Work Center master mapping.
              OUTPUT FORMAT: Product Brief document covering Scope, Architectural Principles, Key Dependencies, and Success Criteria.
            pricing: >-
              BUSINESS CONTEXT: Industrial equipment manufacturer needs a Dynamic Component Cost Rollup and Pricing Engine.
              EXPECTED ACTION: Write a Product Brief detailing dynamic price calculation based on raw material spot prices, margins, and volume tiers.
              OUTPUT FORMAT: Product Brief featuring Core Features, Financial Objectives, System Interfaces, and Guardrail Rules.
            orderAdmenment: >-
              BUSINESS CONTEXT: Machinery builder requires an Order Amendment Impact & WIP Lock Engine.
              EXPECTED ACTION: Develop a Product Brief for assessing post-release order changes, calculating scrap/rework costs, and updating MES work orders.
              OUTPUT FORMAT: Product Brief outlining System Vision, Key Functional Requirements, Operating Constraints, and Impact Metrics.
        - ecommerce:
            order: >-
              BUSINESS CONTEXT: B2B industrial portal requires an E-commerce Order Ingestion & ATP Reservation Middleware.
              EXPECTED ACTION: Draft a Product Brief for seamless order passing from web shopfront to ERP with instant stock locking.
              OUTPUT FORMAT: Product Brief with Clear Scope Statement, Performance SLA Targets (<200ms response), and Success Metrics.

    - icon: arrow-left
      emoji: "🔙"
      name: "Working Backwards (PRFAQ)"
      description: Stress-test and forge your concept
      command: bmad-prfaq
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: Launching a new Autonomous Shop-Floor Rescheduling Engine for industrial plants.
              EXPECTED ACTION: Author a PRFAQ starting with the press release announcing zero-downtime reschedule capabilities, followed by internal FAQs on algorithmic fairness and operator overrides.
              OUTPUT FORMAT: Customer Press Release (1 page) + Internal FAQ section addressing technical and operational queries.
            order: >-
              BUSINESS CONTEXT: Launching an Instant Order Constraint Verification API for CTO heavy machinery.
              EXPECTED ACTION: Write a PRFAQ celebrating zero-error order entry and addressing FAQs on custom engineering rule maintenance.
              OUTPUT FORMAT: External Press Release + Comprehensive FAQ covering integration, performance, and rule authoring.
            orderDelivery: >-
              BUSINESS CONTEXT: Unveiling an Automated Dock Dispatch & EDI 856 Shipping Manifest Platform.
              EXPECTED ACTION: Draft a PRFAQ highlighting total elimination of carrier demurrage fines and real-time shipping tracking.
              OUTPUT FORMAT: Press Release + Technical/Business FAQ answering carrier onboarding and data format questions.
            stock: >-
              BUSINESS CONTEXT: Introducing Zero-Stockout Smart Bin Sensors and Dynamic Allocation Locks for factory lines.
              EXPECTED ACTION: Construct a PRFAQ emphasizing 100% material availability on assembly lines and labor reduction in manual audits.
              OUTPUT FORMAT: Press Release + Operational FAQ addressing sensor calibration, network outages, and inventory sync errors.
            referential: >-
              BUSINESS CONTEXT: Announcing Single-Click EBOM to MBOM Transformation & Master Referential Engine.
              EXPECTED ACTION: Write a PRFAQ focusing on eliminating plant engineering scrap caused by out-of-date drawing revisions.
              OUTPUT FORMAT: Press Release + Engineering FAQ detailing CAD/PLM integration and multi-site routing management.
            pricing: >-
              BUSINESS CONTEXT: Launching Real-Time Dynamic BOM Pricing for customized industrial equipment.
              EXPECTED ACTION: Create a PRFAQ highlighting transparent component cost breakdown and instant customer quotation generation.
              OUTPUT FORMAT: Press Release + Financial/Sales FAQ addressing margin guarantees, price lock windows, and API SLA.
            orderAdmenment: >-
              BUSINESS CONTEXT: Releasing Automated Mid-Production Order Amendment Controller for shop floors.
              EXPECTED ACTION: Author a PRFAQ detailing seamless handling of mid-build customization requests with zero unexpected scrap.
              OUTPUT FORMAT: Press Release + Operations FAQ on work order holding, component return-to-stock, and cost recalculation.
        - ecommerce:
            order: >-
              BUSINESS CONTEXT: Launching High-Volume B2B E-commerce Order Sync with Real-Time Factory Stock Reservation.
              EXPECTED ACTION: Draft a PRFAQ focusing on friction-free customer checkout experience and guaranteed build slot reservation.
              OUTPUT FORMAT: Press Release + Technical FAQ on system throughput, concurrency limits, and ERP failover mechanisms.

    - icon: beaker
      emoji: "🔬"
      name: Deep Recon
      description: "Decision-grade research — market, domain, technical, competitive, user-voice or academic"
      command: bmad-deep-recon
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: Need research on state-of-the-art finite capacity scheduling algorithms (OR-Tools, Genetic Algorithms, CP-SAT) for complex job shops.
              EXPECTED ACTION: Conduct decision-grade research analyzing performance, scalability, and integration requirements for MES scheduling engines.
              OUTPUT FORMAT: Deep Recon Report featuring Benchmarks, Algorithmic Trade-offs Table, Architectural Recommendations, and Literature References.
            order: >-
              BUSINESS CONTEXT: Researching industrial rule engines (e.g., Drools, Camunda, custom AST solvers) for heavy machinery CTO validation.
              EXPECTED ACTION: Perform technical recon on configuration rule evaluation speed, rule maintainability by non-programmers, and ERP compatibility.
              OUTPUT FORMAT: Comparative Analysis Report with Evaluation Matrix, Performance Sizing, and Recommended Solution Architecture.
            orderDelivery: >-
              BUSINESS CONTEXT: Investigating logistics integration standards (GS1 EDIFACT, ANSI X12 856, REST APIs) for global 3PL freight carriers.
              EXPECTED ACTION: Research industry standard shipping notice protocols, carrier webhook capabilities, and automated dispatch requirements.
              OUTPUT FORMAT: Technical Recon Paper detailing Protocol Specifications, Carrier Compatibility Matrix, and Recommended Adapter Architecture.
            stock: >-
              BUSINESS CONTEXT: Researching IoT inventory tracking hardware (UWB, RFID, BLE Beacons, Automated Guided Vehicles) for WIP bin management.
              EXPECTED ACTION: Perform domain recon on tracking accuracy, signal interference in metallic environments, and battery maintenance costs.
              OUTPUT FORMAT: Field Research Summary with Sensor Technology Comparison Table, Industrial Interference Guidelines, and Cost Analysis.
            referential: >-
              BUSINESS CONTEXT: Researching STEP AP242 and ISA-95 standards for unified master data management across PLM, ERP, and MES.
              EXPECTED ACTION: Conduct deep recon on standardized data schemas for multi-level BOM explosion and Work Center capability models.
              OUTPUT FORMAT: Standards Alignment Document with Schema Mappings, Industry Best Practices, and Migration Strategies.
            pricing: >-
              BUSINESS CONTEXT: Studying commodity price index APIs (London Metal Exchange, Platts) for automated raw material cost indexation.
              EXPECTED ACTION: Research real-time financial data feeds, rate limits, latency, and integration methods for automated BOM cost rollups.
              OUTPUT FORMAT: Vendor Recon Report with API SLA Comparisons, Cost Structures, and Resiliency Patterns.
            orderAdmenment: >-
              BUSINESS CONTEXT: Investigating MES work-order state machine models across SAP ME, Siemens Opcenter, and Rockwell Plex.
              EXPECTED ACTION: Research how leading industrial MES platforms handle mid-execution work order holds, scrap logging, and operation rerouting.
              OUTPUT FORMAT: Domain Research Paper with State Transition Diagrams, Industry Comparison Matrix, and API Design Recommendations.
        - ecommerce:
            order: >-
              BUSINESS CONTEXT: Researching high-throughput event streaming patterns (Kafka vs. RabbitMQ vs. NATS) for B2B e-commerce order ingestion.
              EXPECTED ACTION: Conduct technical recon on message ordering, at-least-once delivery, idempotency key strategies, and inventory state locks.
              OUTPUT FORMAT: Architectural Recon Report with Performance Benchmarks, Infrastructure Cost Analysis, and Pattern Topology Diagrams.

- id: phase2-planning
  title: "Phase 2: Planning"
  description: Define what to build and for whom
  icon: list-ordered
  emoji: "📋"
  skills:
    - icon: checklist
      emoji: "📝"
      name: Product Requirements
      description: Create, update, or validate a PRD
      command: bmad-prd
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: Industrial machinery plant needs a comprehensive PRD for the Finite Capacity Scheduling Service.
              EXPECTED ACTION: Generate a detailed PRD including functional requirements for shift management, work center capacity constraints, machine maintenance locks, and schedule optimization.
              OUTPUT FORMAT: Formal PRD document with User Stories, Functional & Non-Functional Requirements, Edge Cases, and Acceptance Criteria.
            order: >-
              BUSINESS CONTEXT: Equipment builder requires a PRD for the CTO Order Build Validation Engine.
              EXPECTED ACTION: Write a PRD covering constraint evaluation rules, credit check integration, mandatory option dependencies, and order state transitions.
              OUTPUT FORMAT: Full PRD with Requirements Traceability Matrix, Data Model Diagrams (Mermaid), and Detailed Acceptance Criteria.
            orderDelivery: >-
              BUSINESS CONTEXT: Logistics department needs a PRD for the Outbound Shipping Notice & 3PL Integration Hub.
              EXPECTED ACTION: Produce a PRD specifying EDI 856 generation, carrier slot booking workflows, shipping label generation, and dock status tracking.
              OUTPUT FORMAT: Complete PRD featuring API Endpoints Specification, Event Schemas, Exception Handling Rules, and Compliance Requirements.
            stock: >-
              BUSINESS CONTEXT: Plant warehouse requires a PRD for the WIP Stock Allocation & Smart Bin System.
              EXPECTED ACTION: Author a PRD covering real-time bin scanning, dynamic safety buffer recalculation, component lock reservation, and ERP stock sync.
              OUTPUT FORMAT: Comprehensive PRD with System Architecture Diagrams, Detailed User Personas, and NFRs (Latency <100ms, 99.99% uptime).
            referential: >-
              BUSINESS CONTEXT: Manufacturing engineering team needs a PRD for the Master Data Referential Sync Service (PLM to MES).
              EXPECTED ACTION: Write a PRD defining EBOM-to-MBOM conversion logic, routing operation mapping, version control, and audit logging.
              OUTPUT FORMAT: Complete PRD containing Transformation Logic Rules, Data Validation Rules, Error Handling Protocols, and Security Requirements.
            pricing: >-
              BUSINESS CONTEXT: Commercial operations requires a PRD for the Dynamic BOM Cost Rollup & Surcharge Engine.
              EXPECTED ACTION: Create a PRD specifying raw material price feed ingest, dynamic margin calculation, quantity tier discounting, and quote generation.
              OUTPUT FORMAT: Detailed PRD with Mathematical Formula Specifications, API Integration Contracts, and Precision Requirements.
            orderAdmenment: >-
              BUSINESS CONTEXT: Plant operations needs a PRD for the Order Amendment Impact & WIP Controller.
              EXPECTED ACTION: Author a PRD defining mid-production change evaluation, scrap/rework labor cost calculation, WIP lock enforcement, and ERP billing sync.
              OUTPUT FORMAT: Exhaustive PRD with Workflow Diagrams, State Machine Tables, Security Roles, and Audit Trail Requirements.
        - ecommerce:
            order: >-
              BUSINESS CONTEXT: E-commerce team requires a PRD for B2B Web Order Ingestion & ATP Stock Reservation Service.
              EXPECTED ACTION: Create a PRD covering shopping cart inventory hold locks, customer tier pricing resolution, order payload mapping, and ERP submission.
              OUTPUT FORMAT: Production-Ready PRD with Endpoint Contracts, Sequence Diagrams, Rate-Limiting Rules, and SLA Commitments.

    - icon: paintcan
      emoji: "🎨"
      name: UX Design
      description: Design user experience and UX specifications
      command: bmad-ux
      prompts:
        - vc4i:
            planning: >-
              BUSINESS CONTEXT: Plant Schedulers need an intuitive visual interface to view machine load factors and manually adjust scheduled job sequences.
              EXPECTED ACTION: Design UX specifications for an interactive Gantt-chart shop floor scheduling portal with drag-and-drop job re-sequencing and capacity overload highlights.
              OUTPUT FORMAT: UX Design Specification with Component Hierarchies, Layout Wireframe descriptions, Color/Status Conventions, and Interaction Patterns.
            order: >-
              BUSINESS CONTEXT: Customer service agents entering complex CTO machinery orders face confusion when options conflict.
              EXPECTED ACTION: Specify UX design for an Order Validation portal that visually highlights invalid option combinations in red with guided resolution steps.
              OUTPUT FORMAT: UX Specification including Component Wireframe Text Descriptions, Form State Patterns, and Error Recovery Workflow Steps.
            orderDelivery: >-
              BUSINESS CONTEXT: Shipping dock workers using rugged tablets need a touch-friendly interface to manage carrier pickup queues and trigger shipping notices.
              EXPECTED ACTION: Design UX specs for a high-contrast, large-button tablet interface for dock operators to confirm pallet loads and print ASN labels.
              OUTPUT FORMAT: UX Design Guide detailing Touch Targets, Contrast Requirements, Workflow Sequences, and Hardware Key Bindings.
            stock: >-
              BUSINESS CONTEXT: Assembly line operators need a hands-free or quick-scan visual interface to check bin stock levels and call for material replenishment.
              EXPECTED ACTION: Design UX/UI specs for a Smart Replenishment Station screen showing color-coded stock levels (Green/Amber/Red) and one-touch reorder actions.
              OUTPUT FORMAT: UX Specification document covering Screen Mockup Layouts, Color Threshold Rules, Audio Feedback Cues, and Accessibility Standards.
            referential: >-
              BUSINESS CONTEXT: Manufacturing engineers need to visually compare Engineering BOMs from CAD with active Manufacturing BOMs in the factory.
              EXPECTED ACTION: Design UX specs for a Split-Screen BOM Comparison & Mapping Portal with side-by-side diff highlighting and drag-and-drop routing line assignment.
              OUTPUT FORMAT: Detailed UX Specs including Visual Diff Color Coding, Contextual Action Menus, Shortcut Keys, and Filter Bar Layouts.
            pricing: >-
              BUSINESS CONTEXT: Sales engineers quoting custom machinery require a visual breakdown of material costs, surcharges, and gross margins.
              EXPECTED ACTION: Design UX specs for a Dynamic Cost Rollup Dashboard featuring interactive cost pie charts, margin slider controls, and price escalation alerts.
              OUTPUT FORMAT: UX Design Specs with Chart Interaction Rules, Input Masking Specifications, and Export Functionality Layouts.
            orderAdmenment: >-
              BUSINESS CONTEXT: Order modification analysts need to visualize the exact WIP location of a machine in assembly before approving an amendment.
              EXPECTED ACTION: Design UX specs for an Order Amendment Workbench showing real-time factory floor location, completed vs. pending operations, and scrap impact metrics.
              OUTPUT FORMAT: UX Specification detailing Multi-step Wizard Wireframes, Operational Progress Bars, and Cost Impact Alert Badges.
        - ecommerce:
            order: >-
              BUSINESS CONTEXT: B2B buyers placing $100k+ equipment orders need clear visibility into build slot allocation and shipping estimated delivery dates at checkout.
              EXPECTED ACTION: Design UX specs for a B2B Checkout Flow detailing real-time stock allocation badges, delivery slot pickers, and credit check status indicators.
              OUTPUT FORMAT: UX Specification Document detailing Step-by-Step Checkout Flow Wireframes, Field Validation Behaviors, and Mobile/Desktop Responsiveness.

