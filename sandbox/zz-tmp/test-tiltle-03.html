          <meta charset="UTF-8" />

  <title>Token Razor - Holographic Prism</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f12;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Outfit', sans-serif;
    }
    h1 {
      font-size: 6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      background: linear-gradient(
        45deg,
        #ff007f,
        #7928ca,
        #00dfd8,
        #ff007f
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: holoShift 6s ease infinite;
      filter: drop-shadow(0 0 20px rgba(121, 40, 202, 0.4));
    }
    @keyframes holoShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
