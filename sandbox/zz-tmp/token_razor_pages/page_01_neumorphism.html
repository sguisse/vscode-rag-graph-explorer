<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module">
      import RefreshRuntime from 'http://127.0.0.1:5173/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
          <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Neumorphism</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #e0e5ec;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      padding: 50px 80px;
      border-radius: 30px;
      background: #e0e5ec;
      box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
      text-align: center;
    }
    h1 {
      font-size: 4.5rem;
      font-weight: 900;
      color: #2d3748;
      letter-spacing: -2px;
      margin-bottom: 10px;
    }
    p {
      color: #718096;
      font-size: 1.1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .badge {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 50px;
      background: #e0e5ec;
      box-shadow: inset 6px 6px 12px #b8b9be, inset -6px -6px 12px #ffffff;
      color: #3182ce;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Token Razor</h1>
    <p>Soft UI Precision Engine</p>
    <div class="badge">v2.5 Connected</div>
  </div>
</body>
</html>
