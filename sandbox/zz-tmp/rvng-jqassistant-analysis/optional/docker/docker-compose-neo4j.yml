services:
  neo4j:
    image: neo4j:5.26.24
    container_name: ctn-ai-agent-rev-eng-neo4j
    ports:
      - "$NEO4J_PORT:7474"
      - "$NEO4J_BOLT_PORT:7687"
    environment:
      - NEO4J_AUTH=$NEO4J_USER/$NEO4J_PASSWORD
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    networks:
      - ai-agents-rev-eng-network

volumes:
  neo4j_data:
  neo4j_import:
  neo4j_plugins:

networks:
  ai-agents-rev-eng-network:
    external: true
