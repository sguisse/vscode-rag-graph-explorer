<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module">
      import RefreshRuntime from 'http://127.0.0.1:5173/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
          <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor Neon Title</title>

  <!-- Rounded Neon-style Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030e14; /* Dark teal-black background */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Comfortaa', cursive, sans-serif;
      overflow: hidden;
    }

    .neon-wrapper {
      position: relative;
      padding: 20px;
    }

    .neon-title {
      position: relative;
      font-size: 5.5rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: transparent;

      /* 1. Gradient applied across the stroke height */
      background: linear-gradient(
        180deg,
        #00f2ff 0%,
        #0099ff 50%,
        #a040ff 100%
      );
      -webkit-background-clip: text;
      background-clip: text;

      /* Outer stroke thickness */
      -webkit-text-stroke: 8px transparent;

      /* 2. Layered Neon Glows (Cyan on top, Purple on bottom) */
      filter:
        drop-shadow(0 -4px 8px rgba(0, 242, 255, 0.9))
        drop-shadow(0 4px 12px rgba(160, 64, 255, 0.85))
        drop-shadow(0 0 25px rgba(0, 242, 255, 0.5))
        drop-shadow(0 0 45px rgba(160, 64, 255, 0.4));
    }

    /* 3. Dark inner mask to create the hollow tube effect */
    .neon-title::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: #030e14; /* Matches background to cut out center */
      -webkit-text-stroke: 0px;
      -webkit-text-fill-color: #ffffff;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="neon-wrapper">
    <h1 class="neon-title" data-text="TOKEN RAZOR">TOKEN RAZOR</h1>
  </div>

</body>
</html>
