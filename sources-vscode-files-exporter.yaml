    content: |-
      import * as vscode from 'vscode';
      import * as path from 'path';
      import * as os from 'os';
      import { execSync } from 'child_process';
      
      export class ConfigService {
          private static readonly PREFIX = 'filesExporter';
      
          public getConfiguration() {
              return vscode.workspace.getConfiguration(ConfigService.PREFIX);
          }
      
          public shouldPinWebview(): boolean {
              return this.getConfiguration().get<boolean>('pinFilesExporter') ?? true;
          }
      
          public shouldPinBrowserTab(): boolean {
              return this.getConfiguration().get<boolean>('pinBrowserTab') ?? true;
          }
      
          public getPythonScriptPath(extensionPath: string): string {
              const customPath = this.getConfiguration().get<string>('scriptPythonPath');
              return customPath || path.join(extensionPath, 'scripts', 'files-exporter.py');
          }
      
          public getHistoryFilePath(): string {
              const rawPath = this.getConfiguration().get<string>('historyYamlPath') || '~/.files-exporter-history.yaml';
              if (rawPath.startsWith('~')) {
                  return path.join(os.homedir(), rawPath.slice(1));
              }
              return rawPath;
          }
      
          public getWorkspaceRootPath(): string {
              if (vscode.workspace.workspaceFolders && vscode.workspace.workspaceFolders.length > 0) {
                  return vscode.workspace.workspaceFolders[0].uri.fsPath;
              }
              return os.homedir();
          }
      
          public getRepoName(): string {
              const wsPath = this.getWorkspaceRootPath();
              try {
                  const gitRoot = execSync('git rev-parse --show-toplevel', { cwd: wsPath, stdio: ['ignore', 'pipe', 'ignore'], encoding: 'utf8' }).trim();
                  return path.basename(gitRoot);
              } catch {
                  return path.basename(wsPath);
              }
          }
      
          public getFileExtsCategoryGroups(): any[] {
              const config = this.getConfiguration();
              return config.get<any[]>('fileExtsCategoryGroups') ||
                     config.get<any[]>('fileextscategorygroups') || [];
          }
      }

  - filename: "export-orchestrator.service"
    extension: "ts"
    path: "d:\\Projects\\mycpgn\\vscode-files-exporter\\src\\services"
    content: |-
      import * as vscode from 'vscode';
      import * as fs from 'fs';
      import * as path from 'path';
      import * as os from 'os';
      import { ConfigService } from './config.service';
      import { ProcessRunnerService } from './process-runner.service';
      
      export class ExportOrchestratorService {
          constructor(
              private readonly context: vscode.ExtensionContext,
              private readonly configService: ConfigService,
              private readonly processRunner: ProcessRunnerService,
              private readonly webviewPanel: vscode.WebviewPanel
          ) {}
      
          public cancelActiveExport(): boolean {
              const script = this.configService.getPythonScriptPath(this.context.extensionPath);
              return this.processRunner.killActivePythonScript(script);
          }
      
          private makePathsAbsolute(paths: string[], workspaceRoot: string): string[] {
              return paths.map(p => {
                  let clean = p.replace(/^['"]|['"]$/g, '').trim();
                  if (!clean) return '';
                  if (!path.isAbsolute(clean)) {
                      return path.join(workspaceRoot, clean);
                  }
                  return clean;
              }).filter(Boolean);
          }
      
          private makeSinglePathAbsolute(p: string, workspaceRoot: string): string {
              let clean = (p || '').replace(/^['"]|['"]$/g, '').trim();
              if (!clean) return workspaceRoot;
              if (!path.isAbsolute(clean)) {
                  return path.join(workspaceRoot, clean);
              }
              return clean;
          }
      
          private async verifyFilesReady(filePaths: string[], retries = 5, delay = 500): Promise<boolean> {
          for (const path of filePaths) {
              for (let i = 0; i < retries; i++) {
                  try {
                      // Verify existence and basic accessibility
                      await fs.promises.access(path, fs.constants.R_OK);
                      // Optional: Check if content is actually written (stat.size > 0)
                      const stats = await fs.promises.stat(path);
                      if (stats.size > 0) break;
                  } catch (err) {
                      if (i === retries - 1) return false;
                      await new Promise(resolve => setTimeout(resolve, delay));
                  }
              }
          }
          return true;
      }
      
          public async run(formData: any): Promise<void> {
              const script = this.configService.getPythonScriptPath(this.context.extensionPath);
              const workspaceRoot = this.configService.getWorkspaceRootPath();
      
              const absoluteSourcesArray = this.makePathsAbsolute(formData.paths || [], workspaceRoot);
              const absoluteDestDirectory = this.makeSinglePathAbsolute(formData.destDir, workspaceRoot);
              const concatenatedSources = absoluteSourcesArray.join(',');
      
              const runtimeTransmittedData = {
                  ...formData,
                  destDir: absoluteDestDirectory
              };
      
              const execArgs = this.buildArgs(runtimeTransmittedData, concatenatedSources);
              const displayArgs = this.buildDisplayArgs(runtimeTransmittedData, concatenatedSources);
      
              const fullCommand = `python3 '${script}' ${displayArgs.join(' ')}`;
              this.webviewPanel.webview.postMessage({ command: 'updateCommand', text: fullCommand });
      
              try {
                  const { code, signal, stdout, stderr } = await this.processRunner.executePython(
                      script, execArgs,
                      (out) => this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: out }),
                      (err) => this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: `\x1b[91mERROR: ${err}\x1b[0m` })
                  );
      
                  // If the user killed the process or it exited via signal, abort and suppress confirmation alert maps
                  if (signal !== null || code === null) {
                      return;
                  }
      
                  if (code === 0) {
                      this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: `\n✅ Process exited safely.\n` });
                      vscode.window.showInformationMessage("Export Complete!");
                      const generatedFiles = this.parseAndSendReport(stdout, runtimeTransmittedData.destDir);
                      // Use verified readiness before copying
                      const isReady = await this.verifyFilesReady(generatedFiles);
                      if (isReady && runtimeTransmittedData.copyGeneratedFilesToClipboard) {
                          await this.copyGeneratedFilesToClipboard(generatedFiles);
                      } else if (!isReady) {
                          this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: `\n❌ Clipboard copy failed: Files not ready after generation.\n` });
                      }
                  } else {
                      const lastErrorLine = stderr.trim().split(/\r?\n/).filter(Boolean).pop();
                      const detail = lastErrorLine ? `: ${lastErrorLine}` : '';
                      this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: `\n❌ Process exited with code ${code}${detail}\n` });
                      vscode.window.showErrorMessage(`Export engine failed with exit code ${code}${detail}`);
                  }
              } catch (e: any) {
                  if (e.message && e.message.includes('Error: kill')) return;
                  vscode.window.showErrorMessage(`Engine Error : ${e.message}`);
              }
          }
      
          private buildArgs(formData: any, sources: string): string[] {
              const args: string[] = ['--src', sources, '--dest', formData.destDir, '--format', formData.format];
              if (formData.mode) args.push('--mode', formData.mode); // Inject Mode
              if (formData.maxFile) args.push('--max-file', formData.maxFile.toString());
              if (formData.maxChunk) args.push('--max-chunk', formData.maxChunk.toString());
              if (formData.groupByExt) args.push('--group-ext');
              if (formData.logConsole) args.push('--log-console');
              if (formData.logFile) args.push('--log-file');
              if (formData.generateTreeView) args.push('--tree-view');
      
              const cleanFilters = (val: string) => val.split(/[\n,]/).map(s => s.trim()).filter(s => s).join(',');
              if (formData.incPaths) args.push('--inc-paths', cleanFilters(formData.incPaths));
              if (formData.excPaths) args.push('--exc-paths', cleanFilters(formData.excPaths));
              if (formData.incExts) args.push('--inc-ext', cleanFilters(formData.incExts));
              if (formData.excExts) args.push('--exc-ext', cleanFilters(formData.excExts));
              return args;
          }
      
          private buildDisplayArgs(formData: any, sources: string): string[] {
              const args: string[] = ['--src', `'${sources}'`, '--dest', `'${formData.destDir}'`, '--format', `'${formData.format}'`];
              if (formData.mode) args.push('--mode', `'${formData.mode}'`); // Inject Mode
              if (formData.maxFile) args.push('--max-file', `'${formData.maxFile}'`);
              if (formData.maxChunk) args.push('--max-chunk', `'${formData.maxChunk}'`);
              if (formData.groupByExt) args.push('--group-ext');
              if (formData.logConsole) args.push('--log-console');
              if (formData.logFile) args.push('--log-file');
              if (formData.generateTreeView) args.push('--tree-view');
      
              const cleanFilters = (val: string) => val.split(/[\n,]/).map(s => s.trim()).filter(s => s).join(',');
              if (formData.incPaths) args.push('--inc-paths', `'${cleanFilters(formData.incPaths)}'`);
              if (formData.excPaths) args.push('--exc-paths', `'${cleanFilters(formData.excPaths)}'`);
              if (formData.incExts) args.push('--inc-ext', `'${cleanFilters(formData.incExts)}'`);
              if (formData.excExts) args.push('--exc-ext', `'${cleanFilters(formData.excExts)}'`);
              return args;
          }
      
          private parseAndSendReport(stdout: string, destDirOverride: string): string[] {
              const lines = stdout.split('\n');
              let timestamp: string | undefined;
              for (let i = lines.length - 1; i >= 0; i--) {
                  if (/^\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}$/.test(lines[i].trim())) {
                      timestamp = lines[i].trim();
                      break;
                  }
              }
              if (timestamp) {
                  const destDir = destDirOverride || path.join(this.configService.getWorkspaceRootPath(), "exported-files");
                  const reportFileName = `export-${timestamp}-report.json`;
                  const reportPath = path.join(destDir, reportFileName);
                  if (fs.existsSync(reportPath)) {
                      const reportContent = fs.readFileSync(reportPath, 'utf8');
                      const reportData = JSON.parse(reportContent);
                      if (!reportData.results.generated_files) reportData.results.generated_files = {};
                      reportData.results.generated_files.reports = [reportFileName];
                      reportData.results.generated_files.logs = fs.existsSync(path.join(destDir, `export-${timestamp}.log`)) ? [`export-${timestamp}.log`] : [];
      
                      const treeFileName = `export-${timestamp}-tree.json`;
                      const treePath = path.join(destDir, treeFileName);
                      if (fs.existsSync(treePath)) {
                          reportData.results.tree_manifest = JSON.parse(fs.readFileSync(treePath, 'utf8'));
                      }
      
                      // Deterministic and precise calculation of the number of tokens (Blended Char/Word count) on exported files
                          const exportedFilesList = (reportData.results.generated_files.exports || []).filter((filePath: string) => fs.existsSync(filePath));
                          let totalTokens = 0;
      
                          for (const filePath of exportedFilesList) {
                              try {
                                  const text = fs.readFileSync(filePath, 'utf8').replace(/\r/g, '');
                                  const normalized = text.replace(/\s+/g, ' ').trim();
      
                                  const charCount = normalized.length;
                                  const wordCount = normalized ? normalized.split(' ').length : 0;
      
                                  const charEstimate = charCount / 4;
                                  const wordEstimate = wordCount * 0.75;
      
                                  const blended = (charEstimate + wordEstimate) / 2;
                                  totalTokens += Math.max(0, Math.round(blended));
                              } catch (err) {
                                  console.error('Error calculating file tokens:', filePath, err);
                              }
                          }
                          reportData.results.estimatedInputTokens = totalTokens;
      
                          this.webviewPanel.webview.postMessage({ command: 'updateExportReport', data: reportData.results });
                      return (reportData.results.generated_files.exports || []).filter((filePath: string) => fs.existsSync(filePath));
                  }
              }
              return [];
          }
      
          private async copyGeneratedFilesToClipboard(filePaths: string[]) {
              if (filePaths.length === 0) {
                  this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: `\n⚠️ Clipboard auto-copy skipped: no generated export files found.\n` });
                  return;
              }
      
              try {
                  const timeoutMs = this.configService.getConfiguration().get<number>('copyFilesToClipboardTimeout') ?? 10000;
                  const pyOut = await this.processRunner.copyFilesToClipboard(filePaths, timeoutMs);
                  if (pyOut) this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: `\n🐍 [Python Clipboard]:\n${pyOut}\n` });
                  this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: `\n📋 Auto-copied and verified ${filePaths.length} generated file(s) to OS clipboard.\n` });
                  vscode.window.showInformationMessage(`Copied and verified ${filePaths.length} generated file(s) to clipboard.`);
              } catch (err: any) {
                  this.webviewPanel.webview.postMessage({ command: 'terminalLog', text: `\n❌ Clipboard auto-copy failed: ${err.message}\n` });
                  vscode.window.showErrorMessage(`Clipboard verification failed: ${err.message}`);
              }
          }
      
          public async simulateFilters(payload: any): Promise<void> {
              const script = this.configService.getPythonScriptPath(this.context.extensionPath);
      
              const args: string[] = [
                  '--mode', 'filter-check',
                  '--paths-to-check', payload.input
              ];
      
              const cleanFilters = (val: string) => val.split(/[\n,]/).map(s => s.trim()).filter(s => s).join(',');
      
              if (payload.incPaths) args.push('--inc-paths', cleanFilters(payload.incPaths));
              if (payload.excPaths) args.push('--exc-paths', cleanFilters(payload.excPaths));
              if (payload.incExts) args.push('--inc-ext', cleanFilters(payload.incExts));
              if (payload.excExts) args.push('--exc-ext', cleanFilters(payload.excExts));
      
              console.info('\n[Orchestrator Backend] 🔄 Preparing to spawn Python Simulator...');
              console.info(`[Orchestrator Backend] 📜 Script Path: ${script}`);
              console.info(`[Orchestrator Backend] ⚙️ Arguments:`, args);
      
              try {
                  // Execute silently but capture stdout and stderr for our console.info trace
                  const { code, stdout, stderr } = await this.processRunner.executePython(script, args, () => {}, () => {});
      
                  console.info(`[Orchestrator Backend] ✅ Python process finished with Exit Code: ${code}`);
                  if (stdout) console.info(`[Orchestrator Backend] 💬 stdout: \n${stdout.trim()}`);
                  if (stderr) console.info(`[Orchestrator Backend] 🚨 stderr: \n${stderr.trim()}`);
      
                  this.webviewPanel.webview.postMessage({ command: 'simulateFiltersResult', code });
              } catch (err: any) {
                  console.error(`[Orchestrator Backend] 💥 Python process CRASHED:`, err);
                  this.webviewPanel.webview.postMessage({ command: 'simulateFiltersResult', code: 2 });
              }
          }
      }

  - filename: "file-system.service"
    extension: "ts"
    path: "d:\\Projects\\mycpgn\\vscode-files-exporter\\src\\services"
    content: |-
      import * as fs from 'fs';
      import * as fsPromises from 'fs/promises';
      import * as path from 'path';
      
      export class FileSystemService {
          public exists(fsPath: string): boolean {
              return fs.existsSync(fsPath);
          }
      
          public isDirectory(fsPath: string): boolean {
              try {
                  return fs.statSync(fsPath).isDirectory();
              } catch {
                  return false;
              }
          }
      
          public async clearDirectory(dirPath: string): Promise<void> {
              if (!fs.existsSync(dirPath)) return;
              const files = await fsPromises.readdir(dirPath);
              for (const file of files) {
                  await fsPromises.rm(path.join(dirPath, file), { recursive: true, force: true });
              }
          }
      
          public getInvalidPaths(paths: string[], workspaceRoot: string): string[] {
              const invalidPaths: string[] = [];
              for (const rawPath of paths) {
                  let cleanPath = rawPath.replace(/^['"]|['"]$/g, '').trim();
                  if (!cleanPath) continue;
                  if (!path.isAbsolute(cleanPath)) {
                      cleanPath = path.join(workspaceRoot, cleanPath);
                  }
                  if (!fs.existsSync(cleanPath)) {
                      invalidPaths.push(rawPath);
                  }
              }
              return invalidPaths;
          }
      }

  - filename: "git.service"
    extension: "ts"
    path: "d:\\Projects\\mycpgn\\vscode-files-exporter\\src\\services"
    content: |-
      import { exec } from 'child_process';
      import * as path from 'path';
      import * as fs from 'fs';
      
      export interface GitDiffResult {
          success: boolean;
          files: string[];
          message: string;
      }
      
      export class GitService {
          /**
           * Gets all local modified files (staged or unstaged) compared to the last commit (HEAD).
           */
          public getLocalModifiedFilesFromLastCommit(wsPath: string): Promise<GitDiffResult> {
              return new Promise((resolve) => {
                  // --porcelain ensures stable output format across git versions
                  exec('git status --porcelain', { cwd: wsPath }, (err, stdout) => {
                      if (err) {
                          resolve({ success: false, files: [], message: `[Git Status Error]: ${err.message}` });
                          return;
                      }
      
                      if (!stdout.trim()) {
                          resolve({ success: true, files: [], message: 'No local modifications detected since last commit.' });
                          return;
                      }
      
                      // git status --porcelain outputs: XY path/to/file.ts
                      // We need to strip the status codes (first 3 characters) to get the file path
                      const relativePaths = stdout
                          .split('\n')
                          .map(line => line.substring(3).trim())
                          .filter(line => line);
      
                      // Convert to full string output for parsing uniformity
                      const pathsRawString = relativePaths.join('\n');
      
                      resolve({
                          success: true,
                          files: this.parseOutput(pathsRawString, wsPath),
                          message: ''
                      });
                  });
              });
          }
      
          /**
           * Gets all local modified files compared to the remote branch.
           * Includes all unpushed commits AND current modified files (staged or unstaged).
           */
          public getLocalModifiedFilesFromRemoteBranch(wsPath: string): Promise<GitDiffResult> {
              return new Promise((resolve) => {
                  exec('git fetch', { cwd: wsPath }, (fetchErr) => {
                      // Removing "..HEAD" ensures we diff tracking branch all the way to the working directory
                      // (including uncommitted staged/unstaged changes)
                      const diffCommand = 'git diff $(git merge-base HEAD @{upstream}) --name-only';
      
                      exec(diffCommand, { cwd: wsPath }, (err, stdout) => {
                          if (err) {
                              exec('git diff origin/HEAD --name-only', { cwd: wsPath }, (fallbackErr, fallbackStdout) => {
                                  if (!fallbackErr && fallbackStdout) {
                                      resolve({ success: true, files: this.parseOutput(fallbackStdout, wsPath), message: '' });
                                  } else {
                                      resolve({ success: false, files: [], message: '[Git Diff Warning]: No upstream tracking configuration found for the active branch.' });
                                  }
                              });
                          } else {
                              if (stdout) {
                                  resolve({ success: true, files: this.parseOutput(stdout, wsPath), message: '' });
                              } else {
                                  resolve({ success: true, files: [], message: 'Up-to-date. No changes detected between local and remote origin.' });
                              }
                          }
                      });
                  });
              });
          }
      
          private parseOutput(stdout: string, wsPath: string): string[] {
              return stdout.split('\n')
                  .map(l => l.trim())
                  .filter(l => l)
                  .map(line => path.isAbsolute(line) ? line : path.join(wsPath, line))
                  .filter(p => fs.existsSync(p));
          }
      }

  - filename: "history.service"
    extension: "ts"
    path: "d:\\Projects\\mycpgn\\vscode-files-exporter\\src\\services"
    content: |-
      import * as fs from 'fs/promises';
      import { existsSync } from 'fs';
      import * as path from 'path';
      import { HistoryEntry, ExportConfig } from '../interfaces/export.interface';
      
      export class HistoryService {
          constructor(private readonly historyFilePath: string) {}
      
          public async getFullWrapper(currentRepo?: string): Promise<any> {
              let parsed: any = {};
              if (existsSync(this.historyFilePath)) {
                  try {
                      const fileData = await fs.readFile(this.historyFilePath, 'utf8');
                      parsed = JSON.parse(fileData.trim() || '{}');
                  } catch (e) {}
              }
      
              if (!parsed.config) {
                  parsed.config = {};
              }
              if (!parsed.config.repo) {
                  parsed.config.repo = [];
              }
              if (!parsed.history) {
                  parsed.history = [];
              }
      
              if (currentRepo) {
                  let repoEntry = parsed.config.repo.find((r: any) => r.repo === currentRepo);
                  if (!repoEntry) {
                      repoEntry = {
                          repo: currentRepo,
                          lastRunConfigId: parsed.config.lastRunConfigId || 'default',
                          historyViewMode: parsed.config.historyViewMode || 'scope-current-repo'
                      };
                      parsed.config.repo.push(repoEntry);
                  }
              }
      
              return parsed;
          }
      
          private async writeWrapper(wrapper: any): Promise<void> {
              await fs.mkdir(path.dirname(this.historyFilePath), { recursive: true });
              wrapper.history = wrapper.history.map((h: any) => ({
                  id: h.id,
                  repo: h.repo || 'unknown',
                  display: h.display,
                  frozen: h.frozen || false,
                  config: h.config
              }));
              await fs.writeFile(this.historyFilePath, JSON.stringify(wrapper, null, 2), 'utf8');
          }
      
          public async loadHistory(): Promise<HistoryEntry[]> {
              const wrapper = await this.getFullWrapper();
              return wrapper.history;
          }
      
          public async getLastRunConfigId(repo: string): Promise<string> {
              const wrapper = await this.getFullWrapper(repo);
              const repoEntry = wrapper.config.repo.find((r: any) => r.repo === repo);
              return repoEntry ? repoEntry.lastRunConfigId : 'default';
          }
      
          public async setHistoryViewMode(mode: string, repo: string): Promise<void> {
              const wrapper = await this.getFullWrapper(repo);
              const repoEntry = wrapper.config.repo.find((r: any) => r.repo === repo);
              if (repoEntry) {
                  repoEntry.historyViewMode = mode;
              }
              await this.writeWrapper(wrapper);
          }
      
          public async saveHistory(formData: any, currentHistoryId: string | undefined, repo: string): Promise<{ history: HistoryEntry[], selectedId: string }> {
              const wrapper = await this.getFullWrapper(repo);
              const uiConfig = this.mapFormDataToConfig(formData);
      
              if (currentHistoryId && currentHistoryId !== 'default') {
                  const existingIndex = wrapper.history.findIndex((h: any) => h.id === currentHistoryId);
                  if (existingIndex !== -1 && !wrapper.history[existingIndex].frozen) {
                      wrapper.history[existingIndex].config = uiConfig;
                      // ✨ Fix: We DO NOT overwrite wrapper.history[existingIndex].repo here.
                      // It must retain its original creation scope.
      
                      const repoEntry = wrapper.config.repo.find((r: any) => r.repo === repo);
                      if (repoEntry) {
                          repoEntry.lastRunConfigId = currentHistoryId;
                      }
      
                      await this.writeWrapper(wrapper);
                      return { history: wrapper.history, selectedId: currentHistoryId };
                  }
              }
      
              const finalSelectedId = currentHistoryId || 'default';
              const repoEntry = wrapper.config.repo.find((r: any) => r.repo === repo);
              if (repoEntry) {
                  repoEntry.lastRunConfigId = finalSelectedId;
              }
      
              await this.writeWrapper(wrapper);
              return { history: wrapper.history, selectedId: finalSelectedId };
          }
      
          public async duplicateEntry(id: string, repo: string): Promise<{ history: HistoryEntry[], newId: string }> {
              const wrapper = await this.getFullWrapper(repo);
              const target = wrapper.history.find((h: any) => h.id === id);
              if (!target) return { history: wrapper.history, newId: id };
      
              const newId = new Date().toISOString() + "-copy";
              const newEntry: HistoryEntry = {
                  id: newId,
                  repo: repo,
                  display: `${target.display} copy`,
                  frozen: false,
                  config: JSON.parse(JSON.stringify(target.config))
              };
      
              wrapper.history = [newEntry, ...wrapper.history];
              await this.writeWrapper(wrapper);
              return { history: wrapper.history, newId };
          }
      
          public async addNewEntry(defaultConfig: ExportConfig, workspaceName: string, repo: string, customName?: string): Promise<{ history: HistoryEntry[], newId: string }> {
              const wrapper = await this.getFullWrapper(repo);
              const now = new Date();
              const pad = (n: number) => n.toString().padStart(2, '0');
              const displayName = customName || `${pad(now.getMonth() + 1)}/${pad(now.getDate())}-${pad(now.getHours())}:${pad(now.getMinutes())} --> ${workspaceName} --> ⚙️ New config`;
      
              const newId = now.toISOString();
              const newEntry: HistoryEntry = {
                  id: newId,
                  repo: repo,
                  display: displayName,
                  frozen: false,
                  config: JSON.parse(JSON.stringify(defaultConfig))
              };
      
              wrapper.history = [newEntry, ...wrapper.history];
              await this.writeWrapper(wrapper);
              return { history: wrapper.history, newId };
          }
      
          public async toggleFreeze(id: string, isFrozen: boolean): Promise<HistoryEntry[]> {
              const wrapper = await this.getFullWrapper();
              const entry = wrapper.history.find((h: any) => h.id === id);
              if (entry) {
                  entry.frozen = isFrozen;
                  await this.writeWrapper(wrapper);
              }
              return wrapper.history;
          }
      
          public async updateEntryDisplay(id: string, newDisplay: string): Promise<HistoryEntry[]> {
              const wrapper = await this.getFullWrapper();
              const entry = wrapper.history.find((h: any) => h.id === id);
              if (entry) {
                  entry.display = newDisplay;
                  await this.writeWrapper(wrapper);
              }
              return wrapper.history;
          }
      
          public async removeEntry(id: string): Promise<HistoryEntry[]> {
              const wrapper = await this.getFullWrapper();
              wrapper.history = wrapper.history.filter((h: any) => h.id !== id);
      
              if (wrapper.config && wrapper.config.repo) {
                  wrapper.config.repo.forEach((r: any) => {
                      if (r.lastRunConfigId === id) {
                          r.lastRunConfigId = 'default';
                      }
                  });
              }
      
              await this.writeWrapper(wrapper);
              return wrapper.history;
          }
      
          public async clearHistory(): Promise<void> {
              const wrapper = await this.getFullWrapper();
              wrapper.history = [];
              if (wrapper.config && wrapper.config.repo) {
                  wrapper.config.repo.forEach((r: any) => {
                      r.lastRunConfigId = 'default';
                  });
              }
              await this.writeWrapper(wrapper);
          }
      
          public async softClearHistory(): Promise<void> {
              if (existsSync(this.historyFilePath)) {
                  const now = new Date();
                  const pad = (n: number) => n.toString().padStart(2, '0');
                  const timestamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_\${pad(now.getHours())}-\${pad(now.getMinutes())}-\${pad(now.getSeconds())}`;
                  const backupPath = `${this.historyFilePath}.${timestamp}.del`;
                  await fs.copyFile(this.historyFilePath, backupPath);
              }
          }
      
          private mapFormDataToConfig(formData: any): ExportConfig {
              return {
                  src: formData.paths.join(', '),
                  dest: formData.destDir,
                  format: formData.format,
                  max_file: formData.maxFile,
                  max_chunk: formData.maxChunk,
                  groupByExt: formData.groupByExt,
                  copyGeneratedFilesToClipboard: formData.copyGeneratedFilesToClipboard,
                  generateTreeView: formData.generateTreeView,
                  logConsole: formData.logConsole,
                  logFile: formData.logFile,
                  inc_paths: formData.incPaths,
                  exc_paths: formData.excPaths,
                  inc_ext: formData.incExts,
                  exc_ext: formData.excExts
              };
          }
      }

  - filename: "process-runner.service"
    extension: "ts"
    path: "d:\\Projects\\mycpgn\\vscode-files-exporter\\src\\services"
    content: |-
      import { spawn, exec, ChildProcess } from 'child_process';
      import { existsSync } from 'fs';
      import { ClipboardService } from './clipboard/clipboard.service';
      
      export class ProcessRunnerService {
          private clipboardService = new ClipboardService();
          private activeProcesses: Map<string, ChildProcess> = new Map();
      
          public executePython(
              scriptPath: string,
              args: string[],
              onStdout: (data: string) => void,
              onStderr: (data: string) => void
          ): Promise<{ code: number | null, signal: string | null, stdout: string, stderr: string }> {
              return new Promise((resolve, reject) => {
                  if (!existsSync(scriptPath)) {
                      return reject(new Error(`Le script moteur est introuvable à l'adresse : ${scriptPath}`));
                  }
      
                  const command = process.platform === 'win32' ? 'python' : 'python3';
                  const processArgs = [scriptPath, ...args];
                  const child = spawn(command, processArgs);
      
                  const processTrackingKey = scriptPath;
                  this.activeProcesses.set(processTrackingKey, child);
      
                  let fullStdout = '';
                  let fullStderr = '';
      
                  child.stdout.on('data', (chunk) => {
                      const text = chunk.toString('utf8');
                      fullStdout += text;
                      onStdout(text);
                  });
      
                  child.stderr.on('data', (chunk) => {
                      const text = chunk.toString('utf8');
                      fullStderr += text;
                      onStderr(text);
                  });
      
                  // Capture both termination exit code and close signals atomically without masking overrides
                  child.on('close', (code, signal) => {
                      this.activeProcesses.delete(processTrackingKey);
                      resolve({ code, signal, stdout: fullStdout, stderr: fullStderr });
                  });
      
                  child.on('error', (err) => {
                      this.activeProcesses.delete(processTrackingKey);
                      reject(err);
                  });
              });
          }
      
          public killActivePythonScript(scriptPath: string): boolean {
              const child = this.activeProcesses.get(scriptPath);
              if (child) {
                  child.kill('SIGKILL');
                  this.activeProcesses.delete(scriptPath);
                  return true;
              }
              return false;
          }
      
          public copyFilesToClipboard(filePaths: string[], timeoutMs: number = 10000): Promise<string> {
              return this.clipboardService.copyFilesToClipboard(filePaths, timeoutMs);
          }
      }

  - filename: "rich-notification.service"
    extension: "ts"
    path: "d:\\Projects\\mycpgn\\vscode-files-exporter\\src\\services"
    content: |-
      import * as vscode from 'vscode';
      
      export type NotificationPosition =
          | 'top-left'
          | 'top-center'
          | 'top-right'
          | 'center'
          | 'bottom-left'
          | 'bottom-center'
          | 'bottom-right';
      
      export type NotificationType = 'info' | 'warn' | 'error' | 'success';
      
      export interface NotificationAction {
          label: string;
          command: string;
          data?: any;
      }
      
      export interface RichNotificationOptions {
          type?: NotificationType;
          position?: NotificationPosition;
          header?: string;
          message?: string;    // Rich HTML for the Webview
          durationMs?: number;
          actions?: NotificationAction[];
      }
      
      export class RichNotificationService {
          constructor(private panel: vscode.WebviewPanel | undefined) {}
      
          public setPanel(panel: vscode.WebviewPanel | undefined) {
              this.panel = panel;
          }
      
          /**
           * Displays a rich notification. Routes to Webview if available, otherwise falls back to native VS Code UI.
           */
          public show(
              fallbackText: string, // Plain text for native VS Code UI
              options: RichNotificationOptions = {},
              callback?: (command: string, payload: any) => void
          ) {
              const type = options.type || 'info';
              const position = options.position || 'bottom-right';
              const durationMs = options.durationMs || 3000;
      
              // 1. Send to Webview if it is currently active and visible
              if (this.panel && this.panel.visible) {
                  this.panel.webview.postMessage({
                      command: 'showRichNotification',
                      payload: {
                          text: options.message || fallbackText,
                          header: options.header,
                          type,
                          position,
                          durationMs,
                          actions: options.actions
                      }
                  });
                  // Note: To handle button clicks inside the Webview, your MessageRouter
                  // will need to listen for the specific commands returned by the UI.
                  return;
              }
      
              // 2. Fallback to native VS Code notifications (positioning ignored by VS Code)
              this.fallbackToNative(fallbackText, type, options.actions, callback);
          }
      
          private fallbackToNative(
              text: string,
              type: NotificationType,
              actions?: NotificationAction[],
              callback?: (command: string, payload: any) => void
          ) {
              // Extract just the labels for VS Code native buttons (Filter out "Dismiss" as native has an 'X')
              const actionLabels = actions
                  ? actions.filter(a => a.label !== "Dismiss").map(a => a.label)
                  : [];
      
              let promise: Thenable<string | undefined>;
      
              switch (type) {
                  case 'error':
                      promise = vscode.window.showErrorMessage(text, ...actionLabels);
                      break;
                  case 'warn':
                      promise = vscode.window.showWarningMessage(text, ...actionLabels);
                      break;
                  default: // Handles both 'info' and 'success'
                      promise = vscode.window.showInformationMessage(text, ...actionLabels);
                      break;
              }
      
              // Handle the button click natively
              promise.then(selection => {
                  if (selection && actions && callback) {
                      const selectedAction = actions.find(a => a.label === selection);
                      if (selectedAction) {
                          callback(selectedAction.command, selectedAction.data);
                      }
                  }
              });
          }
      }

