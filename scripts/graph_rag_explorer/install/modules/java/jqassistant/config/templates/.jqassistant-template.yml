# Template for repository-specific jQAssistant configuration (mixed strategy)
# https://jqassistant.github.io/jqassistant/current/#core:Configuration
#
jqassistant:
  #maven:
    # Force the module where 'mvn' is being executed to be used as root module. The database will be created in this module and contain all information of the reactor. Rules will be read from the rules folder of this module.
    #
    # jqassistant.maven.use-execution-root-as-project-root: true|false
  #  use-execution-root-as-project-root: true
    # Re-use store instances across all modules of the Maven reactor. Can be set to false for mitigating problems in specific setups,
    # the jQAssistant Maven plugin will display an according hint when this is necessary.
    #
    # jqassistant.maven.reuse-store: true|false
  #  reuse-store: true

  # ---------------------------------------------------------------------------
  # Plugins — full Maven coordinates required (group-id/artifact-id/version)
  # ---------------------------------------------------------------------------
  plugins:
    - group-id: org.jqassistant.plugin
      artifact-id: jqassistant-openapi-plugin
      version: 1.0.0-M2
    - group-id: org.jqassistant.plugin.typescript
      artifact-id: jqassistant-typescript-plugin
      version: 1.4.4
    # Spring plugin: provides spring-component:*, spring-mvc:*, spring-injection:* and spring-transaction:* concepts/constraints
    # reused by the tech-* / xc-* packs (jqassistant-java, -xml, -yaml2, -junit and -maven3 plugins are bundled in the CLI distribution).
    - group-id: org.jqassistant.plugin
      artifact-id: jqassistant-spring-plugin
      version: 2.9.0

  # ---------------------------------------------------------------------------
  # Store — NEO4J database configuration (embedded or remote)
  # ---------------------------------------------------------------------------
  store:
    # URI of the database to connect to. Supported URI schemes are 'file' for embedded databases and 'bolt' for connecting to a running Neo4j instance (3.x+), e.g.
    uri: '{{JQA_BOLT_URL}}'

    # embedded:
    #   neo4j-version: 5.26.20
    #   # Specify the ports here
    #   bolt-port: {{JQA_BOLT_PORT}} # default: 7687
    #   http-port: {{JQA_HTTP_PORT}} # default: 7474
    #   # Optional: listen on all interfaces (0.0.0.0) or just localhost
    #   listen-address: "{{JQA_HOST}}"
    #   # The neo4j apoc-core is always useful (use apoc-enabled: true to auto-include it), but if you want to specify it explicitly, use the neo4j-plugins section, ⚠️ Do not use both at the same time (apoc-enabled and neo4j-plugins) as that will cause conflicts and errors.
    #   #apoc-enabled: true
    #   neo4j-plugins:
    #     - group-id: org.neo4j.procedure
    #       artifact-id: apoc-core
    #       classifier: core
    #       version: 5.26.2

    remote:
      # Optional: specify username and password for authentication
      username: '{{JQA_BOLT_USERNAME}}'
      password: '{{JQA_BOLT_PASSWORD}}'
      # Activate encryption level for 'bolt' connections.
      encryption: false
      # trustAllCertificates|trustCustomCaSignedCertificates|trustSystemCaSignedCertificates
      trust-strategy: trustAllCertificates
      # -Djqassistant.store.trust-certificate
      trust-certificate:

      # Additional properties to be passed to the remote store as key-value pairs.
      #properties:

  # ---------------------------------------------------------------------------
  # Scan targets
  # ---------------------------------------------------------------------------
  # IMPORTANT: Do NOT list target/classes or target/test-classes here.
  #   The jqa.plugin.maven3 plugin auto-scans those as Maven artifacts (bytecode),
  #   creating :Java:Type:Class/:Method nodes. Listing them here causes the
  #   filesystem scanner to re-scan them and skip .class files → 0 entries.
  #
  # DO list src/main/java here.
  #   The filesystem scanner visits .java source files and creates :SourceFile nodes
  #   with absolute_path properties. These are required by the graph-rag main.py
  #   enrichment query:  MATCH (f:SourceFile) WHERE f.absolute_path ENDS WITH '.java'
  #
  # target/test-classes is scanned through the 'java:classpath::' scope (injected by the installer
  #   source discovery together with target/classes) so that :Test types exist (tech-junit5-testing:TestType).
  #
  # {JQA_CONFIG_DIRS_YAML_LIST} lists src/main/resources and .github/workflows directories (YAML 2 / XML plugins),
  #   used by the configuration, Maven and CI rules.
  scan:
    reset: true
    continue-on-error: true
    include:
      files:
      # TODO: Adjust the following to your project structure if needed (after a fresh installation).
      # ! If you do a new fresh installation, manual modifications to this file will be overwritten. Instead, adjust the source discovery logic in scripts/graph_rag_explorer/services/sources_discovery.py and re-run the installation.
        # Scanning the root POM and all child POMs. Ignored if not found.
  {{JQA_POM_FILES_YAML_LIST}}
        # Scanning the source directories of all modules. Ignored if not found.
  {{JQA_SRC_DIRS_YAML_LIST}}
        # Configuration (YAML/XML) and CI workflow directories. Ignored if not found.
  {{JQA_CONFIG_DIRS_YAML_LIST}}
    properties:
      file.exclude:
        - /node_modules/**
        - /dist.*/**
        - /out.*/**

      #urls:

  # ---------------------------------------------------------------------------
  # Analyze — mixed strategy
  #   groups:    Option A — built-in Java ruleset (produces report entries)
  #   concepts:  Option C — explicit graph-enrichment concepts (enrich graph)
  #   rule:      Option B — custom rules directory auto-scanned from jqassistant/rules/
  # ---------------------------------------------------------------------------
  analyze:
    # Option A: activate built-in Java rule group
    groups:
      - '{{PROJECT_NAME}}:Default' # Option B: our custom rules in jqassistant/rules/smarttopic-microservices-core-rules.xml (file name pattern: <project-name>-rules.xml)
      # Portable good-practice packs (tech-* / xc-*) are rules/gp-*.xml; the group gp:Default includes them all.
      # Violations are indicated only (see report below). An application pack may add its own group (e.g. sam:Audit) in jqassistant/.
      - 'gp:Default'
      # Application audit groups (ids ending with ':Audit') declared by the application pack in <workspace>/jqassistant/*.xml. Ignored if none.
  {{JQA_APP_GROUPS_YAML}}

    # Option C: explicit concepts for graph enrichment (add more as needed)
    concepts:
      - java:VirtualInvokes
      - java:GeneratedType
      - java:InnerType
      - java:MethodOverrides

    # Rule parameters consumed by the tech-* / xc-* packs. Every parameter has a safe default declared in the rule itself,
    # so nothing is set here by default. Application values come from <workspace>/jqassistant/rule-parameters.yml
    # (flat 'name: value' pairs) which the installer injects below.
    # Available: moduleSchemas, internalPathRegex, destructivePathRegex, publicPathRegex, adminExprRegex, forbiddenNameRegex,
    #            forbiddenDependencies, requiredDependencies, outboxTypeRegex, idempotencyTypeRegex, sensitiveRegex,
    #            allowedKafkaProducerRegex, executorNames
    rule-parameters:
  {{JQA_RULE_PARAMETERS_YAML}}

    # Severity defaults for custom rules (lowercase: blocker, critical, major, minor, info)
    rule:
      directory: '{{JQA_RULES_DIRECTORY}}'
      default-concept-severity: minor
      default-constraint-severity: major
      # A missing / empty provider concept must not stop the rules that consume its label
      required-concepts-are-optional-by-default: true

    # Re-apply concepts on every run (labels written by an earlier run must not be skipped silently)
    execute-applied-concepts: true

    # Slow rules are flagged, not killed
    warn-on-rule-execution-time-seconds: 5

    # Reporting - violations are INDICATED, never block the analysis
    report:
      continue-on-failure: true
      # Severity is information only: BLOCKER results are labelled FAILURE, every lower result is shown as WARNING
      fail-on-severity: BLOCKER
      warn-on-severity: INFO

    # The jQA baseline would hide known violations; known-vs-new is computed in graph-rag (firstSeen / lastSeen)
    baseline:
      enabled: false

  server:
    daemon: true
    open-browser: false
