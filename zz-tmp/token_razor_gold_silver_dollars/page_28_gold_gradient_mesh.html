<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Gold Gradient Mesh</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top left, #ca8a04, transparent 50%),
                  radial-gradient(circle at bottom right, #15803d, transparent 50%),
                  #09090b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Outfit', sans-serif;
    }
    h1 {
      font-size: 5.5rem;
      color: #ffffff;
      letter-spacing: -1px;
    }
  </style>
</head>
<body>
  <h1>Token Razor</h1>
</body>
</html>
