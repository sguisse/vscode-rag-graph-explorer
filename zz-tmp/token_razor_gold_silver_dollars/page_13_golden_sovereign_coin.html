<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Sovereign Coin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0c0a09;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Cinzel Decorative', serif;
    }
    .coin {
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, #fef08a 0%, #ca8a04 70%, #854d0e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 60px rgba(202, 138, 4, 0.4);
      border: 8px double #fef08a;
    }
    h1 {
      font-size: 2.8rem;
      color: #422006;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="coin">
    <h1>TOKEN<br>RAZOR</h1>
  </div>
</body>
</html>
