<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module">
      import RefreshRuntime from 'http://127.0.0.1:5173/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
          <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Gold & Silver Duo</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
    }
    .title-wrapper {
      text-align: center;
    }
    h1 {
      font-size: 6rem;
      text-transform: uppercase;
      letter-spacing: -1px;
    }
    .gold-part {
      background: linear-gradient(135deg, #ffd700, #b8860b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .silver-part {
      background: linear-gradient(135deg, #ffffff, #8a9ea7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="title-wrapper">
    <h1><span class="gold-part">TOKEN</span> <span class="silver-part">RAZOR</span></h1>
  </div>
</body>
</html>
