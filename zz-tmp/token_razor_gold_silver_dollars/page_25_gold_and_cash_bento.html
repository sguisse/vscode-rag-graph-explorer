<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Gold Cash Bento</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bento {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      max-width: 800px;
      width: 90%;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 30px;
    }
    .card-large {
      grid-column: span 2;
    }
    h1 {
      font-size: 3.5rem;
      background: linear-gradient(90deg, #fef08a, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="bento">
    <div class="card card-large">
      <h1>Token Razor</h1>
    </div>
  </div>
</body>
</html>
