<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Trio Monetary Apex</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050b07;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Outfit', sans-serif;
    }
    .card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #94a3b8;
      border-radius: 24px;
      padding: 4rem 6rem;
      text-align: center;
      box-shadow: 0 0 50px rgba(34, 197, 94, 0.2);
    }
    h1 {
      font-size: 5rem;
      background: linear-gradient(90deg, #ffd700 0%, #e2e8f0 50%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Token Razor</h1>
  </div>
</body>
</html>
