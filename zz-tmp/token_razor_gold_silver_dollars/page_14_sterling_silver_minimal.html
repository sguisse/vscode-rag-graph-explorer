<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Sterling Minimal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: 5rem;
      font-weight: 200;
      letter-spacing: 10px;
      text-transform: uppercase;
    }
    h1 strong {
      font-weight: 800;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <h1>Token <strong>Razor</strong></h1>
</body>
</html>
