<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Silver Chrome Blade</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0c10;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Syne', sans-serif;
    }
    .blade-box {
      position: relative;
      padding: 3rem 6rem;
      background: rgba(255, 255, 255, 0.02);
      border-left: 4px solid #e0e0e0;
      border-right: 4px solid #a1a1a1;
    }
    h1 {
      font-size: 6rem;
      text-transform: uppercase;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #ffffff 0%, #c0c0c0 40%, #708090 60%, #e6e8fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(192, 192, 192, 0.4));
    }
    p {
      color: #a1a1a1;
      letter-spacing: 8px;
      font-size: 0.9rem;
      margin-top: 1rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="blade-box">
    <h1>Token Razor</h1>
    <p>STERLING PRECISION CORE</p>
  </div>
</body>
</html>
