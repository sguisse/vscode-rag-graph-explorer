<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Dollar Bill Engraving</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1f0d;
      color: #85bb65;
      font-family: 'Playfair Display', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .bill-frame {
      border: 3px double #85bb65;
      padding: 4rem 6rem;
      background: radial-gradient(circle, #0e2a12 0%, #051407 100%);
      box-shadow: 0 0 40px rgba(133, 187, 101, 0.2);
      text-align: center;
    }
    h1 {
      font-size: 5.5rem;
      color: #85bb65;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0px #030b04, 0 0 15px rgba(133, 187, 101, 0.4);
    }
    .sub {
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 6px;
      color: #2e7d32;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="bill-frame">
    <h1>TOKEN RAZOR</h1>
    <div class="sub">IN LIQUIDITY WE TRUST</div>
  </div>
</body>
</html>
