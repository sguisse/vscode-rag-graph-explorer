<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Dynamic Holo Stroke</title>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Syncopate', sans-serif;
      overflow: hidden;
    }
    h1 {
      font-size: 5.5rem;
      color: transparent;
      -webkit-text-stroke: 3px #ffd700;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: holoStrokeShift 6s infinite alternate ease-in-out;
    }
    @keyframes holoStrokeShift {
      0% { -webkit-text-stroke-color: #ffd700; filter: drop-shadow(0 0 20px rgba(255,215,0,0.8)); }
      50% { -webkit-text-stroke-color: #e2e8f0; filter: drop-shadow(0 0 20px rgba(226,232,240,0.8)); }
      100% { -webkit-text-stroke-color: #22c55e; filter: drop-shadow(0 0 20px rgba(34,197,94,0.8)); }
    }
  </style>
</head>
<body>
  <h1>TOKEN RAZOR</h1>
</body>
</html>
