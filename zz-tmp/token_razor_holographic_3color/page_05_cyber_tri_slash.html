<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Tri Slash</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08080a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
    }
    .wrapper {
      position: relative;
    }
    h1 {
      font-size: 6rem;
      text-transform: uppercase;
      background: linear-gradient(45deg, #eab308, #cbd5e1, #16a34a);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: triColorMorph 4s ease infinite;
    }
    @keyframes triColorMorph {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .slash {
      position: absolute;
      top: 50%; left: -10%; width: 120%; height: 4px;
      background: linear-gradient(90deg, #eab308, #cbd5e1, #16a34a);
      transform: rotate(-3deg);
      box-shadow: 0 0 15px #16a34a;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>TOKEN RAZOR</h1>
    <div class="slash"></div>
  </div>
</body>
</html>
