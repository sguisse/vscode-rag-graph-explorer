<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Dual Holo Layer</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #040806;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
    }
    .wrapper {
      position: relative;
      text-align: center;
    }
    h1 {
      font-size: 5rem;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffd700 0%, #cbd5e1 50%, #10b981 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: holoShift 5s ease infinite;
    }
    .stroke-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      color: transparent;
      -webkit-text-stroke: 2px #22c55e;
      animation: strokeGlow 5s ease infinite alternate;
    }
    @keyframes holoShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes strokeGlow {
      0% { -webkit-text-stroke-color: #22c55e; }
      50% { -webkit-text-stroke-color: #fef08a; }
      100% { -webkit-text-stroke-color: #cbd5e1; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
      <div class="stroke-overlay">TOKEN RAZOR</div>
  </div>
</body>
</html>
