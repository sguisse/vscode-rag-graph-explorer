<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module">
      import RefreshRuntime from 'http://127.0.0.1:5173/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
          <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Prism Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .card {
      background: rgba(255, 255, 255, 0.02);
      border: 2px solid transparent;
      border-radius: 24px;
      padding: 4rem 6rem;
      text-align: center;
      position: relative;
      animation: border3Color 6s infinite linear;
    }
    @keyframes border3Color {
      0% { border-color: #ffd700; box-shadow: 0 0 30px rgba(255,215,0,0.3); }
      50% { border-color: #e2e8f0; box-shadow: 0 0 30px rgba(226,232,240,0.3); }
      100% { border-color: #22c55e; box-shadow: 0 0 30px rgba(34,197,94,0.3); }
    }
    h1 {
      font-size: 5rem;
      color: transparent;
      -webkit-text-stroke: 2px #ffffff;
      animation: textStrokePulse 6s infinite linear;
    }
    @keyframes textStrokePulse {
      0% { -webkit-text-stroke-color: #ffd700; }
      50% { -webkit-text-stroke-color: #e2e8f0; }
      100% { -webkit-text-stroke-color: #22c55e; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Token Razor</h1>
  </div>
</body>
</html>
