<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Solarized IDE</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #002b36;
      color: #839496;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ide-card {
      background: #073642;
      border-radius: 12px;
      padding: 40px 60px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .keyword { color: #859900; }
    .class-name { color: #b58900; }
    .title { color: #268bd2; font-size: 4rem; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="ide-card">
    <p><span class="keyword">class</span> <span class="class-name">LiquidityEngine</span> {</p>
    <h1 class="title">TokenRazor</h1>
    <p>}</p>
  </div>
</body>
</html>
