<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Modern SaaS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0c;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hero {
      text-align: center;
      max-width: 800px;
    }
    .pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 20px;
      color: #a1a1aa;
    }
    h1 {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }
    .btn {
      background: #6366f1;
      color: #fff;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 600;
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="pill">⚡ Ultra Fast Execution</div>
    <h1>Token Razor</h1>
    <button class="btn">Launch Terminal</button>
  </div>
</body>
</html>
