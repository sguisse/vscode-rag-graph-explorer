<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Liquid Aura</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Sora', sans-serif;
    }
    .blob {
      position: absolute;
      width: 300px; height: 300px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border-radius: 50%;
      filter: blur(80px);
    }
    h1 {
      position: relative;
      z-index: 10;
      font-size: 5rem;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="blob"></div>
  <h1>Token Razor</h1>
</body>
</html>
