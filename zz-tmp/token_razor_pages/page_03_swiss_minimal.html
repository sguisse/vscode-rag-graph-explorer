<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Swiss Minimal</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f0f0;
      color: #111;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .grid-box {
      background: #fff;
      border: 3px solid #111;
      padding: 60px;
      max-width: 700px;
      width: 100%;
      position: relative;
    }
    .grid-box::before {
      content: "01 / ARCHITECTURE";
      position: absolute;
      top: 20px; right: 20px;
      font-size: 0.85rem; font-weight: 700; letter-spacing: 2px;
    }
    .tag {
      background: #ff3300;
      color: #fff;
      font-weight: 700;
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    h1 {
      font-size: 5rem;
      line-height: 0.95;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: -2px;
    }
    .footer-line {
      margin-top: 40px;
      border-top: 2px solid #111;
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="grid-box">
    <div class="tag">SWISS PRECISION</div>
    <h1>TOKEN<br>RAZOR</h1>
    <div class="footer-line">
      <span>EFFICIENCY / 99.9%</span>
      <span>EST. 2026</span>
    </div>
  </div>
</body>
</html>
