<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Pixel Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #181425;
      color: #ff0055;
      font-family: 'Press Start 2P', cursive;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .pixel-box {
      background: #262b44;
      padding: 50px;
      border: 8px solid #f2a65a;
      box-shadow: 10px 10px 0px #000;
      text-align: center;
    }
    h1 {
      font-size: 2.8rem;
      color: #ffcc00;
      text-shadow: 4px 4px 0px #ff0055;
      line-height: 1.4;
    }
    p {
      color: #f2a65a;
      font-size: 0.9rem;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <div class="pixel-box">
    <h1>TOKEN<br>RAZOR</h1>
    <p>INSERT COIN TO SWAP</p>
  </div>
</body>
</html>
