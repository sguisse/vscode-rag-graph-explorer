<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Luxury Editorial</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fbf9f5;
      color: #1c1917;
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrapper {
      max-width: 800px;
      padding: 40px;
    }
    .sub {
      font-size: 1rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #78716c;
    }
    h1 {
      font-size: 6.5rem;
      font-weight: 300;
      line-height: 0.9;
      margin: 20px 0;
    }
    .italic {
      font-style: italic;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="sub">Vol. 01 — Edition 2026</div>
    <h1>Token <span class="italic">Razor</span></h1>
  </div>
</body>
</html>
