<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030d03;
      color: #00ff66;
      font-family: 'Fira Code', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }
    .terminal {
      border: 2px solid #00ff66;
      padding: 40px 60px;
      box-shadow: 0 0 30px rgba(0,255,102,0.3), inset 0 0 15px rgba(0,255,102,0.2);
      background: rgba(0, 20, 0, 0.85);
      max-width: 650px;
      width: 90%;
    }
    h1 {
      font-size: 3.8rem;
      text-shadow: 0 0 10px #00ff66;
      margin: 15px 0;
    }
    .cursor {
      display: inline-block;
      width: 14px;
      height: 1.1em;
      background: #00ff66;
      vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="terminal">
    <p>&gt; EXECUTE --MODULE=SWAP_CORE</p>
    <h1>TOKEN_RAZOR<span class="cursor"></span></h1>
    <p>[STATUS: 100% BLADE-SHARP SLIPPAGE CONTROL]</p>
  </div>
</body>
</html>
