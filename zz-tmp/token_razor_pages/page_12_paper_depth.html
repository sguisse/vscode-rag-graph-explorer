<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Paper Cutout</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Rubik', sans-serif;
    }
    .layer-1 {
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .layer-2 {
      background: #334155;
      padding: 20px;
      border-radius: 16px;
    }
    .layer-3 {
      background: #38bdf8;
      padding: 3rem 5rem;
      border-radius: 12px;
      color: #0f172a;
    }
    h1 {
      font-size: 4.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="layer-1">
    <div class="layer-2">
      <div class="layer-3">
        <h1>TOKEN RAZOR</h1>
      </div>
    </div>
  </div>
</body>
</html>
