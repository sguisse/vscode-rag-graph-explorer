<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Slanted Laser</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Kanit', sans-serif;
    }
    .slant-box {
      transform: skewX(-12deg);
      background: #dc2626;
      padding: 2rem 5rem;
      box-shadow: -15px 15px 0px #fef08a;
    }
    h1 {
      font-size: 5.5rem;
      color: #ffffff;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="slant-box">
    <h1>TOKEN RAZOR</h1>
  </div>
</body>
</html>
