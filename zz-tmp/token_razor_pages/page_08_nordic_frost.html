<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Razor - Nordic Frost</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8fafc;
      color: #0f172a;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .frost-box {
      border-left: 4px solid #38bdf8;
      padding-left: 30px;
    }
    h1 {
      font-size: 4.5rem;
      font-weight: 200;
      letter-spacing: 12px;
      text-transform: uppercase;
    }
    h1 strong {
      font-weight: 700;
      color: #0284c7;
    }
    p {
      color: #64748b;
      letter-spacing: 6px;
      font-size: 0.85rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="frost-box">
    <h1>Token <strong>Razor</strong></h1>
    <p>PURE ICE LIQUIDITY PROTOCOL</p>
  </div>
</body>
</html>
