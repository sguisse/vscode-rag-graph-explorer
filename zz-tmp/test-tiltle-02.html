<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module">
      import RefreshRuntime from 'http://127.0.0.1:5173/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
          <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Token Razor - Cyberpunk</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080810;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .grid-bg {
      position: absolute;
      width: 200%;
      height: 200%;
      background-image:
        linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: rotateX(60deg) translateY(-20%);
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
      0% { transform: rotateX(60deg) translateY(0); }
      100% { transform: rotateX(60deg) translateY(40px); }
    }
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 4rem 6rem;
      background: rgba(10, 10, 20, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.3);
      clip-path: polygon(0 0, 92% 0, 100% 15%, 100% 100%, 8% 100%, 0 85%);
      box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
    }
    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 6px;
      color: #00f3ff;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #00f3ff 50%, #ff0055 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
    }
    .btn {
      margin-top: 2rem;
      padding: 0.8rem 2.5rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #080810;
      background: #00f3ff;
      border: none;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 25px #ff0055;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="card">
    <div class="subtitle">// Web3 Edge Precision</div>
    <h1>Token Razor</h1>
    <button class="btn">INITIALIZE APEX</button>
  </div>
</body>
</html>
