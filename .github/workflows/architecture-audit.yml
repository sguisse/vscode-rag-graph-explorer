name: Architecture Audit CI Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  architecture-audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: architecture_auditor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.18.0
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Auditor Service
        run: mvn clean package -DskipTests

      - name: Run Architecture Audit Pipeline
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/architecture_auditor
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: password
        run: |
          java -jar modules/ai-architecture-auditor/target/ai-architecture-auditor-1.0.0-SNAPSHOT.jar . --fail-on=CRITICAL

      - name: Upload SARIF Audit Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: target/audit-results.sarif